# =============================================================================
# PCCM - Structure Contract
# =============================================================================
# Semantic authority for STRUCTURAL RUNTIME: the applied timeline, the derived
# structural state, the profiling and inflation grids, permanent-ID identity, the
# persistent counters, and the Stage-B command surface.
#
# Authority split:
#   workbook.yaml           structure and presentation
#   input_contract.yaml     Setup inputs and Config master lists
#   driver_contract.yaml    Cost Line and Risk Register schemas
#   structure_contract.yaml structural runtime                    <- this file
#
# This file is the ONLY place these values are written. Python reads it, the
# generated modConstants.bas is emitted from it, and the Windows bootstrap and
# functional harness read the names they need from the generated artifacts rather
# than restating them. Nothing here may be duplicated in VBA, PowerShell or Python.
#
# Scope: Phase 4. Structure only. No cost, risk, escalation, FX, NPV, EMV,
# simulation, RNG, Model Check, sensitivity or results logic appears here.
# =============================================================================

structure_contract_version: "1.0.0"

# -----------------------------------------------------------------------------
# Structural limits.
#
# TWO INDEPENDENT PROTECTIONS. They guard different things and must never be
# derived from one another.
#
#   min_year / max_year
#       The supported CALENDAR-YEAR boundary. It constrains Base Year, Start Year
#       and Last Project Year, and therefore the possible span of the Inflation
#       grid, which is keyed by calendar year. 1900-2200.
#
#   max_generated_year_columns
#       The Architecture Lock Revision B structural protection on generated
#       PROJECT-YEAR columns: "Generated column count > 200 = ERROR". It constrains
#       Duration and the width of the two profiling grids. It is a locked constant
#       in its own right, NOT a function of the calendar-year window, and it imposes
#       NO 200-year cap on the inflation span.
#
# Neither is a business maximum. The 25-year figure in the Architecture design is a
# benchmark target and is deliberately encoded nowhere: a 40-year project is a
# legitimate model, and so is a 200-year one.
# -----------------------------------------------------------------------------
limits:
  min_year: 1900
  max_year: 2200
  # Architecture Lock Revision B: generated project-year column count > 200 = ERROR.
  max_generated_year_columns: 200

# -----------------------------------------------------------------------------
# Entered vs applied timeline.
#
# The ENTERED triple is the accepted Phase-2 Setup input cells. They are not moved,
# renamed or re-owned: the inp* defined names remain the single semantic source for
# each entered value. The nm*_Entered names below are CONTRACT-DECLARED ALIASES over
# those same cells, so structural VBA reads a stable canonical name instead of a
# hardcoded Setup coordinate. The loader asserts each alias resolves to exactly the
# same reference as the input it aliases.
#
# The APPLIED triple is separate, model-controlled state. Entered values have no
# structural effect until Apply / Update Timeline succeeds.
# -----------------------------------------------------------------------------
timeline:

  entered_aliases:
    - defined_name: "nmBaseYear_Entered"
      input_key: "base_year"
    - defined_name: "nmStartYear_Entered"
      input_key: "project_start_year"
    - defined_name: "nmDuration_Entered"
      input_key: "duration_years"

  applied_block:
    sheet: "Setup"
    section: "Applied Timeline"
    section_row: 43
    note_row: 44
    note: "Model-controlled. These values change only when Apply / Update Timeline succeeds. Editing the entered values above has no structural effect until then."
    label_column: "B"
    value_column: "C"
    note_column: "E"

  # The applied triple. Written by structural runtime only; blank until first apply.
  applied:
    - key: "applied_base_year"
      label: "Applied Base Year"
      defined_name: "nmBaseYear_Applied"
      label_cell: "B46"
      cell: "C46"
      number_format: "0"
      note: "Price base year actually in force for the generated inflation span."

    - key: "applied_start_year"
      label: "Applied Start Year"
      defined_name: "nmStartYear_Applied"
      label_cell: "B47"
      cell: "C47"
      number_format: "0"
      note: "Calendar year of project year 1 in the generated profiling grids."

    - key: "applied_duration"
      label: "Applied Duration (Years)"
      defined_name: "nmDuration_Applied"
      label_cell: "B48"
      cell: "C48"
      number_format: "0"
      note: "Number of project years actually generated in the profiling grids."

  # Derived structural state. Formulas, not stored values, so they cannot go stale
  # against the applied triple. Section 25 of the Phase-4 scope permits exactly
  # this class of formula: structural state display, never business calculation.
  derived:
    - key: "applied_last_year"
      label: "Applied Last Project Year"
      defined_name: "nmLastYear_Applied"
      label_cell: "B50"
      cell: "C50"
      number_format: "0"
      formula: '=IF(OR(nmStartYear_Applied="",nmDuration_Applied=""),"",nmStartYear_Applied+nmDuration_Applied-1)'
      note: "Applied Start Year + Applied Duration - 1."

    - key: "applied_year_count"
      label: "Applied Project Year Count"
      defined_name: "nmYearCount_Applied"
      label_cell: "B51"
      cell: "C51"
      number_format: "0"
      formula: '=IF(nmDuration_Applied="","",nmDuration_Applied)'
      note: "Number of project-year columns the profiling grids must currently carry."

    - key: "inflation_first_year"
      label: "Inflation First Required Year"
      defined_name: "nmInflFirstYear"
      label_cell: "B53"
      cell: "C53"
      number_format: "0"
      formula: '=IF(nmBaseYear_Applied="","",nmBaseYear_Applied+1)'
      note: "Escalation applies from the year after the applied base year."

    - key: "inflation_last_year"
      label: "Inflation Last Required Year"
      defined_name: "nmInflLastYear"
      label_cell: "B54"
      cell: "C54"
      number_format: "0"
      formula: '=IF(nmLastYear_Applied="","",nmLastYear_Applied)'
      note: "Equal to the applied last project year. An empty span is legitimate when it precedes the first required year."

# -----------------------------------------------------------------------------
# Structural state indicator.
#
# A worksheet formula, deliberately NOT a Worksheet_Change handler: the flag must
# update the instant an entered value is edited, and an event handler would make
# structural state depend on hidden automation. Section 27 of the Phase-4 scope
# forbids using input events as a shortcut for structural behaviour.
#
# Three honest states. "Timeline current" is not claimed before anything has been
# applied, and blank == blank must not read as agreement.
# -----------------------------------------------------------------------------
structural_state:
  sheet: "Setup"
  label: "Structural State"
  defined_name: "nmStructuralState"
  label_cell: "B41"
  cell: "C41"
  number_format: "@"
  note_column: "E"
  note: "Structural state of the workbook. Recomputed by Excel; no macro maintains it."
  labels:
    not_applied: "No timeline applied"
    pending: "STRUCTURE CHANGE PENDING"
    current: "Timeline current"
  formula: >-
    =IF(AND(nmBaseYear_Applied="",nmStartYear_Applied="",nmDuration_Applied=""),
    IF(AND(nmBaseYear_Entered="",nmStartYear_Entered="",nmDuration_Entered=""),
    "No timeline applied","STRUCTURE CHANGE PENDING"),
    IF(AND(nmBaseYear_Entered=nmBaseYear_Applied,nmStartYear_Entered=nmStartYear_Applied,
    nmDuration_Entered=nmDuration_Applied),"Timeline current","STRUCTURE CHANGE PENDING"))

# -----------------------------------------------------------------------------
# Permanent identity.
#
# Sequence counters are persistent workbook state, held on _Calc and addressed by
# defined name. They are advanced on allocation and NEVER decremented on deletion,
# so an identifier is never reused.
# -----------------------------------------------------------------------------
identity:
  sheet: "_Calc"
  intro_row: 6
  intro: "Internal structural workspace. These counters are persistent model state: they advance on allocation and are never decremented, so a permanent identifier is never reused after deletion."
  section: "Permanent ID Counters"
  section_row: 8
  label_column: "B"
  value_column: "C"
  note_column: "E"

  counters:
    - key: "cost_line"
      label: "Cost Line ID Counter"
      defined_name: "nmCounterCostLine"
      label_cell: "B10"
      cell: "C10"
      number_format: "0"
      initial: 0
      prefix: "CL-"
      pad_width: 3
      # Pad width is a MINIMUM display width, not a range limit. CL-1000 is valid.
      pattern: "^CL-[0-9]{3,}$"
      driver_register: "cost_lines"
      note: "Advanced by Add Cost Line. Never decremented by Delete Cost Line."

    - key: "risk"
      label: "Risk ID Counter"
      defined_name: "nmCounterRisk"
      label_cell: "B11"
      cell: "C11"
      number_format: "0"
      initial: 0
      prefix: "R-"
      pad_width: 3
      pattern: "^R-[0-9]{3,}$"
      driver_register: "risk_register"
      note: "Advanced by Add Risk. Never decremented by Delete Risk. Independent of the cost line counter."

# -----------------------------------------------------------------------------
# Structural grids.
#
# Each grid materialises in Stage A with its FIXED columns only. Project-year and
# calendar-year columns do not exist until a valid timeline is applied: fabricating
# year columns before an apply would invent a timeline the user never entered.
#
# reserved_rows is initial capacity, exactly as in the driver contract. For the two
# profiling grids the loader asserts it equals the reserved capacity of the driver
# register the grid mirrors, so the two cannot drift apart.
# -----------------------------------------------------------------------------
grids:

  cost_profiling:
    sheet: "Cost Profiling"
    table_name: "tblCostProfiling"
    kind: "profiling"
    driver_register: "cost_lines"
    key_driver_column: "cost_line_id"
    section: "Cost Line Annual Allocation"
    section_row: 8
    note_row: 9
    note: "One row per identified cost line, keyed by permanent Cost Line ID. Percentages are preserved by permanent ID and project-year index, never by worksheet row."
    intro_row: 6
    intro: "Phase 4. Rows are synchronised from the Cost Line register by permanent ID. Project-year columns are generated by Apply / Update Timeline."
    state_message_row: 10
    header_row: 12
    first_column: "B"
    reserved_rows: 25
    freeze_panes: "D13"

    fixed_columns:
      - key: "cost_line_id"
        header: "Cost Line ID"
        source_driver_column: "cost_line_id"
        number_format: "@"
        width: 14
        note: "Permanent key. Model-controlled; the join between this grid and the register."
      - key: "description"
        header: "Description"
        source_driver_column: "description"
        number_format: "@"
        width: 42
        note: "Trace copy, refreshed by structural synchronisation. Editing it here changes nothing: the register owns the description."

    year_column:
      header_format: "0"
      number_format: "0%"
      width: 11
      initial_value: 0
      # Percentages are user input. No cell rule is imposed: the 100% requirement is
      # a Model Check rule, and a per-cell bound would block ordinary partial entry.
      validation: null

  risk_profiling:
    sheet: "Risk Profiling"
    table_name: "tblRiskProfiling"
    kind: "profiling"
    driver_register: "risk_register"
    key_driver_column: "risk_id"
    section: "Risk Annual Allocation"
    section_row: 8
    note_row: 9
    note: "One row per identified risk, keyed by permanent Risk ID. Occurrence probability lives on the Risk Register and is entirely separate from these allocation percentages."
    intro_row: 6
    intro: "Phase 4. Rows are synchronised from the Risk Register by permanent ID. Project-year columns are generated by Apply / Update Timeline."
    state_message_row: 10
    header_row: 12
    first_column: "B"
    reserved_rows: 25
    freeze_panes: "D13"

    fixed_columns:
      - key: "risk_id"
        header: "Risk ID"
        source_driver_column: "risk_id"
        number_format: "@"
        width: 12
        note: "Permanent key. Model-controlled; the join between this grid and the register."
      - key: "risk_name"
        header: "Risk Name"
        source_driver_column: "risk_name"
        number_format: "@"
        width: 30
        note: "Trace copy, refreshed by structural synchronisation. The register owns the name."

    year_column:
      header_format: "0"
      number_format: "0%"
      width: 11
      initial_value: 0
      validation: null

  inflation:
    sheet: "Inflation"
    table_name: "tblInflation"
    kind: "inflation"
    source_list_table: "tblInflationProfiles"
    section: "Annual Escalation Profiles"
    section_row: 8
    note_row: 9
    note: "One row per inflation profile name from Config, keyed by profile name. Rates are anchored to CALENDAR year, not to column position."
    intro_row: 6
    intro: "Phase 4. Rows are synchronised from the Config profile master by name. Calendar-year columns are generated by Apply / Update Timeline."
    state_message_row: 10
    header_row: 12
    first_column: "B"
    reserved_rows: 10
    freeze_panes: "C13"

    fixed_columns:
      - key: "profile_name"
        header: "Inflation Profile"
        source_list_column: "Inflation Profile"
        number_format: "@"
        width: 24
        note: "Permanent key. Model-controlled; synchronised from the Config profile master by name."

    year_column:
      header_format: "0"
      number_format: "0.00%"
      width: 11
      # BLANK, never zero. A new annual escalation assumption the user has not made
      # must not be fabricated as 0%. A missing rate becomes a blocking Model Check
      # condition in a later phase; silently seeding zero would hide it forever.
      initial_value: null
      validation: null

# -----------------------------------------------------------------------------
# Structural state messages rendered above each grid.
#
# Formulas, so they clear themselves the moment a timeline is applied and reappear
# if the applied state is ever cleared. Nothing maintains them at runtime.
# -----------------------------------------------------------------------------
state_messages:
  not_applied: "Timeline not yet applied. Project-year columns are generated by Apply / Update Timeline on Setup."
  inflation_empty_span: "No inflation years are required for the applied timeline. This is legitimate when Base Year = Start Year and Duration = 1."
  profiling_formula: >-
    =IF(nmYearCount_Applied="","Timeline not yet applied. Project-year columns are
    generated by Apply / Update Timeline on Setup.","")
  inflation_formula: >-
    =IF(nmYearCount_Applied="","Timeline not yet applied. Project-year columns are
    generated by Apply / Update Timeline on Setup.",IF(nmInflFirstYear>nmInflLastYear,
    "No inflation years are required for the applied timeline. This is legitimate
    when Base Year = Start Year and Duration = 1.",""))

# -----------------------------------------------------------------------------
# Stage-B command surface.
#
# entry_point is the public VBA procedure bound to the shape's OnAction. Both the
# bootstrap and the functional harness read these definitions from the generated
# constants module rather than restating them.
# -----------------------------------------------------------------------------
buttons:
  shape_prefix: "btnPCCM"
  width: 150
  height: 28

  definitions:
    - key: "apply_timeline"
      sheet: "Setup"
      shape_name: "btnPCCMApplyTimeline"
      caption: "Apply / Update Timeline"
      entry_point: "PCCM_ApplyTimeline"
      anchor_cell: "E43"

    - key: "add_cost_line"
      sheet: "Cost Lines"
      shape_name: "btnPCCMAddCostLine"
      caption: "Add Cost Line"
      entry_point: "PCCM_AddCostLine"
      anchor_cell: "N6"

    - key: "delete_cost_line"
      sheet: "Cost Lines"
      shape_name: "btnPCCMDeleteCostLine"
      caption: "Delete Cost Line"
      entry_point: "PCCM_DeleteCostLine"
      anchor_cell: "N9"

    - key: "add_risk"
      sheet: "Risk Register"
      shape_name: "btnPCCMAddRisk"
      caption: "Add Risk"
      entry_point: "PCCM_AddRisk"
      anchor_cell: "O6"

    - key: "delete_risk"
      sheet: "Risk Register"
      shape_name: "btnPCCMDeleteRisk"
      caption: "Delete Risk"
      entry_point: "PCCM_DeleteRisk"
      anchor_cell: "O9"

# -----------------------------------------------------------------------------
# VBA module inventory.
#
# The bootstrap imports exactly this set. modConstants is GENERATED from this
# contract into build/vba/ at Stage-A build time; every other module is hand
# written under src/vba/. A module present on disk but absent here, or vice versa,
# fails the Linux inventory test.
# -----------------------------------------------------------------------------
vba:
  source_dir: "src/vba"
  generated_dir: "build/vba"
  generated_module: "modConstants"

  modules:
    - name: "modConstants"
      generated: true
      responsibility: "Contract-derived names, addresses, prefixes, limits and messages. The single VBA source for every structural literal."
    - name: "modWorkbook"
      generated: false
      responsibility: "Low-level workbook access primitives: sheets, defined names, list objects and blank handling. Holds no structural policy."
    - name: "modAppState"
      generated: false
      responsibility: "Application state save/restore, structured failure reporting and user confirmation prompts."
    - name: "modTimeline"
      generated: false
      responsibility: "Apply / Update Timeline: prevalidation, one combined old-to-new delta, orchestration and logical restore."
    - name: "modDrivers"
      generated: false
      responsibility: "Permanent ID allocation and the Add / Delete Cost Line and Risk operations."
    - name: "modProfiling"
      generated: false
      responsibility: "Profiling grid structure: year columns by project-year index, row synchronisation by permanent ID."
    - name: "modInflation"
      generated: false
      responsibility: "Inflation grid structure: year columns by calendar year, profile rows synchronised by name."
    - name: "modStructuralCheck"
      generated: false
      responsibility: "Focused Phase-4 structural revalidation. Not the future Model Check engine."
    - name: "modCalcContract"
      generated: true
      responsibility: "Calculation workspace geometry, fingerprint constants and tolerances, projected from spec/calc_contract.yaml and the fingerprint reference. Constants only."
    - name: "modCalcFactors"
      generated: false
      responsibility: "The numerical primitives: range-checked arithmetic, the exact rescue kernel, the inflation and discount series, Knom / Kpv and the conditioning magnitudes."
    - name: "modCalcAnalytical"
      generated: false
      responsibility: "The analytical calculation: distribution statistics, the per-driver audit amounts, A/B/C/D/E, the annual series and the reconciliation identities."
    - name: "modCalcFingerprint"
      generated: false
      responsibility: "The Calculation Input Fingerprint: canonical encoding, the double-modulus reduction and the digest. No analytical logic."
    - name: "modCalcResolve"
      generated: false
      responsibility: "The worksheet-aware resolution layer: reference sets, then referenced-only FX and inflation, applied-timeline scalars and Permanent-ID profiling, handed on as plain typed data."
    - name: "modCalcCheck"
      generated: false
      responsibility: "The Phase-5 numerical prerequisite checker over the resolved model: timeline, discount rate, profiling sum, three-point ordering, Quantity and Probability. Reports and refuses; never repairs."
    - name: "modCalcReport"
      generated: false
      responsibility: "The Phase-5 presentation and orchestration layer: one in-memory preparation path, the transactional _Calc snapshot with verify-then-commit and rollback, the derived-status axis, and the six calculation endpoints."
    - name: "modSimContract"
      generated: true
      responsibility: "Simulation constants projected from spec/sim_contract.yaml, spec/input_contract.yaml and spec/workbook.yaml. Constants only: no generator, no sampler, no statistic, no digest recurrence and no worksheet access."
    - name: "modSimRng"
      generated: false
      responsibility: "The pure Phase-6 generator backbone: state validation, FIXED and AUTO seeding mathematics, one recurrence step, the canonical 2^127 jump and canonical component-stream assignment. No sampling, no simulation and no worksheet access."
    - name: "modSimSample"
      generated: false
      responsibility: "The pure Phase-6 stochastic transforms: Uniform, Triangular, prepared Beta-PERT through the locked Cheng BB/BC formulation, and the Bernoulli occurrence primitive. All randomness arrives through the modSimRng public surface. No simulation orchestration and no worksheet access."
    - name: "modSimEngine"
      generated: false
      responsibility: "The pure Phase-6 Monte Carlo iteration and canonical contribution accumulation over resolved in-memory DriverFactors; retains the nominal and PV iteration totals. No worksheet access, no statistics, no fingerprint and no publication."
    - name: "modSimStats"
      generated: false
      responsibility: "The pure Phase-6 scale-safe simulation statistics: original-order moments, sorted-copy Hyndman-Fan type-7 quantiles, the full accepted quantile ladder and selected-Px contingency. No workbook access, no fingerprint, no digest and no publication."
    - name: "modSimFingerprint"
      generated: false
      responsibility: "The pure Phase-6 request fingerprint and iteration-result digest framing over the accepted Phase-5 canonical encoder and hash. Framing and order only: no encoding, no hash recurrence, no workbook access, no simulation, no statistics and no publication."
    - name: "modSimReport"
      generated: false
      responsibility: "Phase-6 workbook orchestration: the endpoint and the settled read accessors, the two simulation control reads, the AUTO nonce lifecycle, dual-bank publication into _SimData with verify-then-commit, and the attempt and status bookkeeping. It consumes the accepted pure simulation kernels and owns no simulation mathematics."

  # Public procedures the buttons bind to. Every one must exist in the source and be
  # referenced by exactly one button definition.
  entry_points:
    - "PCCM_ApplyTimeline"
    - "PCCM_AddCostLine"
    - "PCCM_DeleteCostLine"
    - "PCCM_AddRisk"
    - "PCCM_DeleteRisk"

  # Public PCCM_ procedures that are NOT buttons. They exist so the Windows
  # functional harness can drive a confirmation path and an injected failure without
  # a human clicking a dialog, and can ask the workbook for its structural report.
  # They are inert until automation is explicitly begun, and the static tests assert
  # no other PCCM_ procedure exists, so an orphan macro cannot appear unnoticed.
  harness_procedures:
    - "PCCM_AutomationBegin"
    - "PCCM_AutomationEnd"
    - "PCCM_AutomationResult"
    - "PCCM_AutomationPrompt"
    - "PCCM_StructuralReport"
    - "PCCM_DeleteCostLineById"
    - "PCCM_DeleteRiskById"

  # The Phase-5 calculation automation/API surface. These are NOT buttons and NOT
  # harness helpers: they are the externally callable endpoints a later Windows
  # harness drives through Application.Run, and the two read accessors an
  # integrator may call. Declaring them here is what keeps the orphan-macro test
  # meaningful now that PCCM_ procedures exist outside Phase 4.
  api_procedures:
    - "PCCM_Calculate"
    - "PCCM_CalculationStatus"
    - "PCCM_CalculationAttemptResult"
    - "PCCM_CalculationAttemptDetail"
    - "PCCM_CalculationFingerprint"
    - "PCCM_CurrentInputFingerprint"

  # Constructs that must NOT appear in VBA. The Linux static tests and the Gate-B
  # persisted-project sweep assert their absence, so a later phase's
  # functionality cannot leak in early.
  #
  # D6-11. A bare string is forbidden EVERYWHERE. A mapping with `allowed_in`
  # names the module - and only that module - permitted to contain the
  # construct in executable code. The scoped shape was added in Phase-6 Step 1
  # and deliberately granted to nothing until an owner existed.
  #
  # THE FIRST AND ONLY GRANT is MRG32k3a to modSimRng, made in the same commit
  # that introduces modSimRng. Landing a scoped rule before its owner would
  # leave the construct legal in a module that does not exist; landing the owner
  # first would leave it illegal in the module that must contain it.
  #
  # RunSimulation is now SCOPED, in the same commit that introduces its owner.
  # It was global while no module could legitimately contain it; scoping it
  # earlier would have licensed the endpoint before the step that authorises it,
  # and landing modSimReport first would have made the module illegal on
  # arrival. The construct is not removed and not widened: exactly one module
  # may spell it, and every other module still may not.
  forbidden_constructs:
    - "Worksheet_Change"
    - "Workbook_SheetChange"
    - "Worksheet_Calculate"
    - "Workbook_Open"
    - "Rnd("
    - "Randomize"
    - construct: "MRG32k3a"
      allowed_in:
        - "modSimRng"
    - "NPV"
    - "Percentile"
    - construct: "RunSimulation"
      allowed_in:
        - "modSimReport"
    - "FinalReleaseComObject"

# -----------------------------------------------------------------------------
# Structural revalidation.
#
# A focused post-operation gate, NOT the Model Check engine. Each rule is a hard
# structural invariant: a failure makes the macro operation fail. The validator
# reports; it never repairs.
# -----------------------------------------------------------------------------
structural_checks:
  - key: "applied_triple_consistent"
    description: "The applied triple is wholly blank or wholly populated, integer, and within the supported year window."
  - key: "profiling_column_count"
    description: "Each profiling grid carries exactly Applied Project Year Count year columns."
  - key: "profiling_year_headers"
    description: "Profiling year headers run from Applied Start Year to Applied Last Project Year with no gap."
  - key: "cost_profiling_ids_match"
    description: "Cost Profiling IDs match the identified Cost Lines one for one."
  - key: "risk_profiling_ids_match"
    description: "Risk Profiling IDs match the identified Risks one for one."
  - key: "no_duplicate_ids"
    description: "No permanent identifier appears twice in a register or in a profiling grid."
  - key: "id_pattern"
    description: "Every permanent identifier matches its declared prefix and pattern."
  - key: "inflation_year_headers"
    description: "Inflation calendar-year headers match the required applied span exactly."
  - key: "inflation_profile_rows"
    description: "Inflation rows match the current Config profile names, by name."
  - key: "counters_not_behind"
    description: "Each counter is greater than or equal to the highest sequence number it has issued."
  - key: "counter_integrity"
    description: "Each persistent ID counter is present, whole and within the representable range. It is the model's record of every identifier ever issued, so an invalid counter is a fault even when the register currently holds no identifiers at all."
  - key: "no_orphan_structural_data"
    description: "No unkeyed structural row holds owned data: a register row with a blank ID, a profiling row with a blank ID, or an inflation row with a blank profile name, any of which carries content elsewhere in the row. Synchronisation would erase it and no keyed destructive assessment can see it."
  - key: "grid_shape"
    description: "No grid or table is left in a malformed state: header row intact, table reference consistent with its rendered extent."
