# =============================================================================
# PCCM - Workbook Structural Manifest
# =============================================================================
# This file is the STRUCTURAL AUTHORITY for the generated workbook. The builder
# reads it; it does not hardcode sheet names, order, visibility or presentation.
#
# Scope: structure and presentation. Input semantics (Setup inputs, Config list
# masters, tables, defined names, validation) live in input_contract.yaml.
# No business rules and no calculation logic belong in either file.
#
# Authority for functional design: docs/ARCHITECTURE-LOCK Revision B.
# =============================================================================

manifest_version: "1.3.0"

model:
  name: "Probabilistic Cost & Contingency Model"
  short_name: "PCCM"
  model_version: "0.5.0"
  build_phase: "Phase 5 - Calculation Workspace (Gate A: source)"
  reporting_currency: "SAR"      # locked model constant

workbook:
  stage_a_filename: "PCCM_stageA.xlsx"
  active_sheet: "Dashboard"      # must be a visible sheet
  # Architectural lock. The loader asserts the sheet list below matches this
  # exactly, in this order, so manifest drift fails the build loudly.
  locked_sheet_order:
    - "Dashboard"
    - "Setup"
    - "Config"
    - "Cost Lines"
    - "Risk Register"
    - "Inflation"
    - "Cost Profiling"
    - "Risk Profiling"
    - "Model Check"
    - "Results"
    - "Sensitivity"
    - "Methodology"
    - "_Calc"
    - "_SimData"

# -----------------------------------------------------------------------------
# Centralised presentation tokens. Nothing else in the builder defines a font,
# size or colour literal.
# -----------------------------------------------------------------------------
presentation:
  font_family: "Calibri"
  sizes:
    title: 16
    subtitle: 10
    section: 11
    label: 10
    value: 10
    note: 9
  colors:
    title: "1F2933"
    subtitle: "5A6673"
    section: "1F2933"
    label: "3E4C59"
    value: "1F2933"
    note: "7B8794"
    rule: "CBD2D9"
    # --- input language ---
    input_fill: "FFFBEF"      # editable user input
    input_border: "D8C9A3"
    locked_fill: "EFF1F4"     # model-controlled or locked constant
    locked_border: "C2CAD3"
    locked_text: "3E4C59"
    header_fill: "E2E6EB"     # table header
    not_applicable_fill: "E9EBEE"   # presentation only: cell not applicable for this row
  row_heights:
    title: 24
    subtitle: 15
    spacer: 8
    section: 18
    default: 15
  table_style: "TableStyleLight1"
  layout:
    title_row: 2
    subtitle_row: 3
    rule_row: 4
    body_start_row: 6
    label_column: "B"
    value_column: "D"

# -----------------------------------------------------------------------------
# Sheets, in locked order.
#
# block types:
#   section - a heading, an optional note, and optional labelled rows
#   note    - a standalone explanatory line
# -----------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# THE PHASE-6 PUBLICATION SHELL - physical authority.
#
# sim_contract.yaml owns WHICH fields exist and what they mean; this block owns
# WHERE each label and formula sits on a sheet. The loader cross-validates the
# two, so a row here that names a field the contract does not have, or omits
# one it does, is a build failure.
#
# EVERY RESULTS FORMULA IS A LOOKUP. Nothing on Results averages, deviates,
# interpolates a quantile or subtracts a contingency: modSimStats computes
# those numbers and the run PERSISTS them into _SimData. A formula that
# recomputed one would be a second statistics engine living on a worksheet,
# and the two would drift the first time either changed.
#
# Every banked lookup reads the ACTIVE bank. A formula pinned to one bank would
# show the published distribution only half the time.
# ---------------------------------------------------------------------------
phase6_shell:
  # -----------------------------------------------------------------------
  # PHASE 7. The Sensitivity table, materialised as LOOKUPS and nothing else.
  #
  # Every cell reads the persisted `_SimData` sensitivity block for the active
  # bank. Nothing here computes a rank, a correlation or an ordering: the
  # authoritative answer was produced by PCCM_RunSensitivity and this sheet
  # shows it, exactly as Results shows the distribution it never computed.
  #
  # THE WINDOW IS BOUNDED AND THE COUNT DECIDES. A row beyond the persisted
  # record count is blank, so a later model with fewer drivers cannot leave a
  # previous run's surplus rows on display.
  #
  # AND IT SAYS WHOSE ANSWER IT IS. The availability line above the table
  # compares the sensitivity stamp against the active run's own identity, so a
  # table produced for one run can never be read as current for another.
  # -----------------------------------------------------------------------
  sensitivity:
    sheet: "Sensitivity"
    label_column: "B"
    first_column: "B"
    heading_row: 8
    note_row: 9
    availability_row: 10
    header_row: 12
    first_row: 13
    row_window: 200
    heading: "Ranked Drivers"
    note: "Spearman rank correlation of each driver's nominal contribution against Total Nominal Project Cost, over every iteration of the run named below. Monotone association, not a share of variance."
    availability_label: "Sensitivity"
    # THE THREE HONEST ANSWERS. Not produced; produced for THIS run; produced
    # for a different one. The third is the case that must never be silent.
    availability_formula: '=IF(_SimData!$D$30="","No simulation has been published.",IF(IF(_SimData!$D$30="A",_SimData!$J$14,_SimData!$S$14)<>"PUBLISHED","Not produced for this run. Run Sensitivity to produce it.",IF(AND(IF(_SimData!$D$30="A",_SimData!$J$10,_SimData!$S$10)=IF(_SimData!$D$30="A",_SimData!$D$10,_SimData!$F$10),IF(_SimData!$D$30="A",_SimData!$J$11,_SimData!$S$11)=IF(_SimData!$D$30="A",_SimData!$D$11,_SimData!$F$11)),"CURRENT for run "&IF(_SimData!$D$30="A",_SimData!$J$8,_SimData!$S$8),"NOT CURRENT - this table belongs to run "&IF(_SimData!$D$30="A",_SimData!$J$8,_SimData!$S$8)&", not to the published run.")))'
    columns:
      - {key: "driver_id", header: "Driver ID", column: "B", offset: 0}
      - {key: "driver_type", header: "Type", column: "C", offset: 1}
      - {key: "driver_name", header: "Name", column: "D", offset: 2}
      - {key: "rho", header: "Rho", column: "E", offset: 3}
      - {key: "abs_rho", header: "|Rho|", column: "F", offset: 4}
      - {key: "rank", header: "Rank", column: "G", offset: 5}
      - {key: "direction", header: "Direction", column: "H", offset: 6}
      - {key: "status", header: "Status", column: "I", offset: 7}

  sim_data:
    sheet: "_SimData"
    identity_heading: "Run identity and publication state"
    identity_note: "Machine data written by PCCM_RunSimulation. Bank A is column D, bank B is column F; D30 selects the published bank."
    summary_heading: "Summary statistics (persisted)"
    contingency_heading: "Contingency ladder (persisted)"
    iteration_heading: "Iteration records"
    iteration_note: "Both banks share these rows: the second bank consumes COLUMNS, so the technical ceiling is unchanged."
    heading_row: 6
    note_row: 7
    iteration_heading_row: 31
    iteration_note_row: 32
    bank_headers:
      A: {iteration_index: "Iteration (A)", total_nominal: "Total Nominal (A)", total_pv: "Total PV (A)"}
      B: {iteration_index: "Iteration (B)", total_nominal: "Total Nominal (B)", total_pv: "Total PV (B)"}
    summary_headers: {A: {nominal: "Nominal (A)", pv: "PV (A)"}, B: {nominal: "Nominal (B)", pv: "PV (B)"}}
    contingency_headers: {A: {nominal: "Nominal (A)", pv: "PV (A)"}, B: {nominal: "Nominal (B)", pv: "PV (B)"}}
    column_widths: {J: 30, K: 20, L: 20, M: 20, N: 20, P: 12, Q: 20, R: 20, S: 20, T: 20}
  results:
    sheet: "Results"
    label_column: "B"
    nominal_column: "D"
    pv_column: "F"
    sections:
      - {row: 8, title: "Run Stamp", note_row: 9,
         note: "The identity of the last successful simulation. Blank until one commits."}
      - {row: 26, title: "Summary Statistics", note_row: 27,
         note: "Persisted by the run. Nothing on this sheet recomputes a statistic."}
    run_stamp:
      first_row: 10
      last_row: 24
      fields:
        - row: 10
          key: "last_successful_stamp"
          label: "Last Successful Simulation"
          formula: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$D$8,_SimData!$F$8))'
        - row: 11
          key: "run_id"
          label: "Run ID"
          formula: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$D$9,_SimData!$F$9))'
        - row: 12
          key: "model_version"
          label: "Model Version"
          formula: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$D$19,_SimData!$F$19))'
        - row: 13
          key: "iterations_run"
          label: "Iterations Run"
          formula: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$D$16,_SimData!$F$16))'
        - row: 14
          key: "seed_mode"
          label: "Seed Mode"
          formula: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$D$12,_SimData!$F$12))'
        - row: 15
          key: "supplied_seed"
          label: "Supplied Seed"
          formula: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$D$13,_SimData!$F$13))'
        - row: 16
          key: "effective_seed"
          label: "Effective Seed"
          formula: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$D$14,_SimData!$F$14))'
        - row: 17
          key: "consumed_auto_nonce"
          label: "Consumed AUTO Nonce"
          formula: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$D$15,_SimData!$F$15))'
        - row: 18
          key: "applied_timeline"
          label: "Applied Timeline"
          formula: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$D$20,_SimData!$F$20))'
        - row: 19
          key: "rng_version"
          label: "RNG Version"
          formula: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$D$17,_SimData!$F$17))'
        - row: 20
          key: "sim_method_version"
          label: "Simulation Method Version"
          formula: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$D$18,_SimData!$F$18))'
        - row: 21
          key: "request_fingerprint"
          label: "Request Fingerprint"
          formula: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$D$10,_SimData!$F$10))'
        - row: 22
          key: "result_digest"
          label: "Result Digest"
          formula: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$D$11,_SimData!$F$11))'
        - row: 23
          key: "simulation_status"
          label: "Simulation Status (last evaluated)"
          formula: '=IF(_SimData!$D$28="","",_SimData!$D$28)'
        - row: 24
          key: "status_evaluated_at"
          label: "Status Evaluated At"
          formula: '=IF(_SimData!$D$29="","",_SimData!$D$29)'
    summary:
      header_row: 28
      headers: {label: "Metric", nominal: "Nominal (SAR)", pv: "PV (SAR)"}
      first_row: 29
      last_row: 44
      metrics:
        - row: 29
          key: "mean"
          label: "Mean"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$8,_SimData!$M$8))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$8,_SimData!$N$8))'
        - row: 30
          key: "sample_standard_deviation"
          label: "Sample Standard Deviation"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$9,_SimData!$M$9))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$9,_SimData!$N$9))'
        - row: 31
          key: "minimum"
          label: "Minimum"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$10,_SimData!$M$10))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$10,_SimData!$N$10))'
        - row: 32
          key: "quantile_1"
          label: "P10"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$11,_SimData!$M$11))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$11,_SimData!$N$11))'
        - row: 33
          key: "quantile_2"
          label: "P50"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$12,_SimData!$M$12))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$12,_SimData!$N$12))'
        - row: 34
          key: "quantile_3"
          label: "P55"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$13,_SimData!$M$13))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$13,_SimData!$N$13))'
        - row: 35
          key: "quantile_4"
          label: "P60"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$14,_SimData!$M$14))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$14,_SimData!$N$14))'
        - row: 36
          key: "quantile_5"
          label: "P65"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$15,_SimData!$M$15))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$15,_SimData!$N$15))'
        - row: 37
          key: "quantile_6"
          label: "P70"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$16,_SimData!$M$16))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$16,_SimData!$N$16))'
        - row: 38
          key: "quantile_7"
          label: "P75"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$17,_SimData!$M$17))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$17,_SimData!$N$17))'
        - row: 39
          key: "quantile_8"
          label: "P80"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$18,_SimData!$M$18))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$18,_SimData!$N$18))'
        - row: 40
          key: "quantile_9"
          label: "P85"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$19,_SimData!$M$19))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$19,_SimData!$N$19))'
        - row: 41
          key: "quantile_10"
          label: "P90"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$20,_SimData!$M$20))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$20,_SimData!$N$20))'
        - row: 42
          key: "quantile_11"
          label: "P95"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$21,_SimData!$M$21))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$21,_SimData!$N$21))'
        - row: 43
          key: "maximum"
          label: "Maximum"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$22,_SimData!$M$22))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$22,_SimData!$N$22))'
        - row: 44
          key: "deterministic_base_a"
          label: "Deterministic Base A"
          nominal: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$K$23,_SimData!$M$23))'
          pv: '=IF(_SimData!$D$30="","",IF(_SimData!$D$30="A",_SimData!$L$23,_SimData!$N$23))'
    selected:
      confidence_level_row: 46
      quantile_row: 47
      contingency_row: 48
      labels:
        confidence_level: "Selected Confidence Level"
        quantile: "Selected Px"
        contingency: "Contingency"
      confidence_level_formula: '=IF(inpSelectedConfidenceLevel="","",inpSelectedConfidenceLevel)'
      quantile_nominal: '=IF(OR(_SimData!$D$30="",COUNTIF(_SimData!$J$12:$J$21,inpSelectedConfidenceLevel)=0),"",IF(_SimData!$D$30="A",INDEX(_SimData!$K$11:$K$21,MATCH(inpSelectedConfidenceLevel,_SimData!$J$11:$J$21,0)),INDEX(_SimData!$M$11:$M$21,MATCH(inpSelectedConfidenceLevel,_SimData!$J$11:$J$21,0))))'
      quantile_pv: '=IF(OR(_SimData!$D$30="",COUNTIF(_SimData!$J$12:$J$21,inpSelectedConfidenceLevel)=0),"",IF(_SimData!$D$30="A",INDEX(_SimData!$L$11:$L$21,MATCH(inpSelectedConfidenceLevel,_SimData!$J$11:$J$21,0)),INDEX(_SimData!$N$11:$N$21,MATCH(inpSelectedConfidenceLevel,_SimData!$J$11:$J$21,0))))'
      contingency_nominal: '=IF(OR(_SimData!$D$30="",COUNTIF(_SimData!$P$9:$P$18,inpSelectedConfidenceLevel)=0),"",IF(_SimData!$D$30="A",INDEX(_SimData!$Q$8:$Q$18,MATCH(inpSelectedConfidenceLevel,_SimData!$P$8:$P$18,0)),INDEX(_SimData!$S$8:$S$18,MATCH(inpSelectedConfidenceLevel,_SimData!$P$8:$P$18,0))))'
      contingency_pv: '=IF(OR(_SimData!$D$30="",COUNTIF(_SimData!$P$9:$P$18,inpSelectedConfidenceLevel)=0),"",IF(_SimData!$D$30="A",INDEX(_SimData!$R$8:$R$18,MATCH(inpSelectedConfidenceLevel,_SimData!$P$8:$P$18,0)),INDEX(_SimData!$T$8:$T$18,MATCH(inpSelectedConfidenceLevel,_SimData!$P$8:$P$18,0))))'
    deferred:
      - {row: 51, title: "Annual Cash Flow", note_row: 52,
         note: "Deferred. Mean annual cash flow split base cost / risk / total, nominal and PV."}
      - {row: 54, title: "Reconciliation", note_row: 55,
         note: "Deferred. The analytical bridge from deterministic base estimate to selected Px."}

sheets:

  - name: "Dashboard"
    codename: "shDashboard"
    visibility: "visible"
    role: "output"
    purpose: "Executive decision summary. Read-only; every figure originates on Results."
    show_gridlines: false
    title: "Dashboard"
    subtitle: "Executive summary - populated after a simulation run"
    freeze_panes: null
    column_widths: { A: 3, B: 34, C: 3, D: 22, E: 3, F: 22, G: 3, H: 22 }
    blocks:
      - type: note
        text: "Not implemented yet. No results, charts or formulas are implemented yet."
      - type: section
        title: "Run Status"
        note: "Model status, run identity and staleness banner."
      - type: section
        title: "Headline Figures"
        note: "Base estimate, expected risk exposure, selected Px total, contingency."
      - type: section
        title: "Statistical Summary"
        note: "Mean, standard deviation, P10 / P50 / selected Px / P90, nominal and PV."
      - type: section
        title: "Charts"
        note: "S-curve, distribution histogram, mean annual cash flow, top sensitivity drivers."
      - type: section
        title: "Basis and Assumptions"
        note: "Deterministic basis, escalation base year, FX convention, discounting convention."

  - name: "Setup"
    codename: "shSetup"
    visibility: "visible"
    role: "input"
    purpose: "Project-level parameters and the FX rate table. Sole FX-rate authority."
    show_gridlines: false
    title: "Setup"
    subtitle: "Project parameters, FX rates, and the applied timeline"
    body: "contract"
    freeze_panes: "A6"
    column_widths: { A: 3, B: 34, C: 26, D: 3, E: 54 }

  - name: "Config"
    codename: "shConfig"
    visibility: "visible"
    role: "admin"
    purpose: "User-maintainable list masters and locked model constants. Owns no FX rates."
    show_gridlines: false
    title: "Config"
    subtitle: "List masters - user-maintainable lists and locked model constants"
    body: "contract"
    freeze_panes: "A6"
    column_widths: { A: 3, B: 34, C: 26, D: 3, E: 54 }

  - name: "Cost Lines"
    codename: "shCostLines"
    visibility: "visible"
    role: "input"
    purpose: "Base cost driver register. Uncertainty is entered at unit-cost level only."
    show_gridlines: false
    title: "Cost Lines"
    subtitle: "Base cost drivers - schema and validation are functional; no calculation is wired yet"
    body: "drivers"
    freeze_panes: "C12"
    column_widths: { A: 3 }

  - name: "Risk Register"
    codename: "shRiskRegister"
    visibility: "visible"
    role: "input"
    purpose: "Discrete risk driver register. Every risk entered is simulated; there is no Included field."
    show_gridlines: false
    title: "Risk Register"
    subtitle: "Risk drivers - schema and validation are functional; no occurrence logic is wired yet"
    body: "drivers"
    freeze_panes: "C12"
    column_widths: { A: 3 }

  - name: "Inflation"
    codename: "shInflation"
    visibility: "visible"
    role: "input"
    purpose: "Annual escalation rates by inflation profile."
    show_gridlines: false
    title: "Inflation"
    subtitle: "Annual escalation profiles - calendar-year columns are generated by Apply / Update Timeline"
    body: "structure"
    freeze_panes: null
    column_widths: { A: 3 }

  - name: "Cost Profiling"
    codename: "shCostProfiling"
    visibility: "visible"
    role: "input"
    purpose: "Annual percentage allocation of each cost line across project years."
    show_gridlines: false
    title: "Cost Profiling"
    subtitle: "Cost line annual allocation - project-year columns are generated by Apply / Update Timeline"
    body: "structure"
    freeze_panes: null
    column_widths: { A: 3 }

  - name: "Risk Profiling"
    codename: "shRiskProfiling"
    visibility: "visible"
    role: "input"
    purpose: "Annual percentage allocation of each risk across project years."
    show_gridlines: false
    title: "Risk Profiling"
    subtitle: "Risk annual allocation - project-year columns are generated by Apply / Update Timeline"
    body: "structure"
    freeze_panes: null
    column_widths: { A: 3 }

  - name: "Model Check"
    codename: "shModelCheck"
    visibility: "visible"
    role: "output"
    purpose: "Validation register and the gate that blocks simulation on ERROR."
    show_gridlines: false
    title: "Model Check"
    subtitle: "Validation register - no rules are implemented in Phase 1"
    freeze_panes: "A6"
    column_widths: { A: 3, B: 34, C: 2, D: 26, E: 3, F: 46 }
    blocks:
      - type: note
        text: "Not implemented yet. No checks, severities or overall status logic exist yet."
      - type: section
        title: "Overall Model Status"
        note: "Reserved for the aggregate PASS / WARNING / ERROR status."
      - type: section
        title: "Validation Results"
