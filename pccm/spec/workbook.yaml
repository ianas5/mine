# =============================================================================
# PCCM - Workbook Structural Manifest
# =============================================================================
# This file is the STRUCTURAL AUTHORITY for the generated workbook. The builder
# reads it; it does not hardcode sheet names, order, visibility or presentation.
#
# Scope: structure and presentation. Input semantics (Setup inputs, Config list
# masters, tables, defined names, validation) live in input_contract.yaml.
# No business rules and no calculation logic belong in either file.
#
# Authority for functional design: docs/ARCHITECTURE-LOCK Revision B.
# =============================================================================

manifest_version: "1.3.0"

model:
  name: "Probabilistic Cost & Contingency Model"
  short_name: "PCCM"
  model_version: "0.4.0"
  build_phase: "Phase 4 - Structural Runtime (Gate A: source)"
  reporting_currency: "SAR"      # locked model constant

workbook:
  stage_a_filename: "PCCM_stageA.xlsx"
  active_sheet: "Dashboard"      # must be a visible sheet
  # Architectural lock. The loader asserts the sheet list below matches this
  # exactly, in this order, so manifest drift fails the build loudly.
  locked_sheet_order:
    - "Dashboard"
    - "Setup"
    - "Config"
    - "Cost Lines"
    - "Risk Register"
    - "Inflation"
    - "Cost Profiling"
    - "Risk Profiling"
    - "Model Check"
    - "Results"
    - "Sensitivity"
    - "Methodology"
    - "_Calc"
    - "_SimData"

# -----------------------------------------------------------------------------
# Centralised presentation tokens. Nothing else in the builder defines a font,
# size or colour literal.
# -----------------------------------------------------------------------------
presentation:
  font_family: "Calibri"
  sizes:
    title: 16
    subtitle: 10
    section: 11
    label: 10
    value: 10
    note: 9
  colors:
    title: "1F2933"
    subtitle: "5A6673"
    section: "1F2933"
    label: "3E4C59"
    value: "1F2933"
    note: "7B8794"
    rule: "CBD2D9"
    # --- input language ---
    input_fill: "FFFBEF"      # editable user input
    input_border: "D8C9A3"
    locked_fill: "EFF1F4"     # model-controlled or locked constant
    locked_border: "C2CAD3"
    locked_text: "3E4C59"
    header_fill: "E2E6EB"     # table header
    not_applicable_fill: "E9EBEE"   # presentation only: cell not applicable for this row
  row_heights:
    title: 24
    subtitle: 15
    spacer: 8
    section: 18
    default: 15
  table_style: "TableStyleLight1"
  layout:
    title_row: 2
    subtitle_row: 3
    rule_row: 4
    body_start_row: 6
    label_column: "B"
    value_column: "D"

# -----------------------------------------------------------------------------
# Sheets, in locked order.
#
# block types:
#   section - a heading, an optional note, and optional labelled rows
#   note    - a standalone explanatory line
# -----------------------------------------------------------------------------
sheets:

  - name: "Dashboard"
    codename: "shDashboard"
    visibility: "visible"
    role: "output"
    purpose: "Executive decision summary. Read-only; every figure originates on Results."
    show_gridlines: false
    title: "Dashboard"
    subtitle: "Executive summary - populated after a simulation run"
    freeze_panes: null
    column_widths: { A: 3, B: 34, C: 3, D: 22, E: 3, F: 22, G: 3, H: 22 }
    blocks:
      - type: note
        text: "Not implemented yet. No results, charts or formulas are implemented yet."
      - type: section
        title: "Run Status"
        note: "Model status, run identity and staleness banner."
      - type: section
        title: "Headline Figures"
        note: "Base estimate, expected risk exposure, selected Px total, contingency."
      - type: section
        title: "Statistical Summary"
        note: "Mean, standard deviation, P10 / P50 / selected Px / P90, nominal and PV."
      - type: section
        title: "Charts"
        note: "S-curve, distribution histogram, mean annual cash flow, top sensitivity drivers."
      - type: section
        title: "Basis and Assumptions"
        note: "Deterministic basis, escalation base year, FX convention, discounting convention."

  - name: "Setup"
    codename: "shSetup"
    visibility: "visible"
    role: "input"
    purpose: "Project-level parameters and the FX rate table. Sole FX-rate authority."
    show_gridlines: false
    title: "Setup"
    subtitle: "Project parameters, FX rates, and the applied timeline"
    body: "contract"
    freeze_panes: "A6"
    column_widths: { A: 3, B: 34, C: 26, D: 3, E: 54 }

  - name: "Config"
    codename: "shConfig"
    visibility: "visible"
    role: "admin"
    purpose: "User-maintainable list masters and locked model constants. Owns no FX rates."
    show_gridlines: false
    title: "Config"
    subtitle: "List masters - user-maintainable lists and locked model constants"
    body: "contract"
    freeze_panes: "A6"
    column_widths: { A: 3, B: 34, C: 26, D: 3, E: 54 }

  - name: "Cost Lines"
    codename: "shCostLines"
    visibility: "visible"
    role: "input"
    purpose: "Base cost driver register. Uncertainty is entered at unit-cost level only."
    show_gridlines: false
    title: "Cost Lines"
    subtitle: "Base cost drivers - schema and validation are functional; no calculation is wired yet"
    body: "drivers"
    freeze_panes: "C12"
    column_widths: { A: 3 }

  - name: "Risk Register"
    codename: "shRiskRegister"
    visibility: "visible"
    role: "input"
    purpose: "Discrete risk driver register. Every risk entered is simulated; there is no Included field."
    show_gridlines: false
    title: "Risk Register"
    subtitle: "Risk drivers - schema and validation are functional; no occurrence logic is wired yet"
    body: "drivers"
    freeze_panes: "C12"
    column_widths: { A: 3 }

  - name: "Inflation"
    codename: "shInflation"
    visibility: "visible"
    role: "input"
    purpose: "Annual escalation rates by inflation profile."
    show_gridlines: false
    title: "Inflation"
    subtitle: "Annual escalation profiles - calendar-year columns are generated by Apply / Update Timeline"
    body: "structure"
    freeze_panes: null
    column_widths: { A: 3 }

  - name: "Cost Profiling"
    codename: "shCostProfiling"
    visibility: "visible"
    role: "input"
    purpose: "Annual percentage allocation of each cost line across project years."
    show_gridlines: false
    title: "Cost Profiling"
    subtitle: "Cost line annual allocation - project-year columns are generated by Apply / Update Timeline"
    body: "structure"
    freeze_panes: null
    column_widths: { A: 3 }

  - name: "Risk Profiling"
    codename: "shRiskProfiling"
    visibility: "visible"
    role: "input"
    purpose: "Annual percentage allocation of each risk across project years."
    show_gridlines: false
    title: "Risk Profiling"
    subtitle: "Risk annual allocation - project-year columns are generated by Apply / Update Timeline"
    body: "structure"
    freeze_panes: null
    column_widths: { A: 3 }

  - name: "Model Check"
    codename: "shModelCheck"
    visibility: "visible"
    role: "output"
    purpose: "Validation register and the gate that blocks simulation on ERROR."
    show_gridlines: false
    title: "Model Check"
    subtitle: "Validation register - no rules are implemented in Phase 1"
    freeze_panes: "A6"
    column_widths: { A: 3, B: 34, C: 2, D: 26, E: 3, F: 46 }
    blocks:
      - type: note
        text: "Not implemented yet. No checks, severities or overall status logic exist yet."
      - type: section
        title: "Overall Model Status"
        note: "Reserved for the aggregate PASS / WARNING / ERROR status."
      - type: section
        title: "Validation Results"
        note: "Reserved for the check register: id, group, severity, result, offending IDs, guidance."

  - name: "Results"
    codename: "shResults"
    visibility: "visible"
    role: "output"
    purpose: "Full statistical output, cash flow and the analytical reconciliation bridge."
    show_gridlines: false
    title: "Results"
    subtitle: "Simulation output - no statistics are implemented in Phase 1"
    freeze_panes: "A6"
    column_widths: { A: 3, B: 34, C: 2, D: 26, E: 3, F: 46 }
    blocks:
      - type: note
        text: "Not implemented yet. No percentiles, moments or cash flows are implemented yet."
      - type: section
        title: "Run Stamp"
        note: "Reserved for model version, run id, timestamp, iterations, seed and applied timeline."
      - type: section
        title: "Summary Statistics"
        note: "Reserved for the percentile ladder, mean, standard deviation and dispersion."
      - type: section
        title: "Annual Cash Flow"
        note: "Reserved for mean annual cash flow split base cost / risk / total, nominal and PV."
      - type: section
        title: "Reconciliation"
        note: "Reserved for the analytical bridge from deterministic base estimate to selected Px."

  - name: "Sensitivity"
    codename: "shSensitivity"
    visibility: "visible"
    role: "output"
    purpose: "Driver ranking by Spearman rank correlation against total project cost."
    show_gridlines: false
    title: "Sensitivity"
    subtitle: "Ranked drivers - no correlation analysis is implemented in Phase 1"
    freeze_panes: "A6"
    column_widths: { A: 3, B: 34, C: 2, D: 26, E: 3, F: 46 }
    blocks:
      - type: note
        text: "Not implemented yet. No driver data, correlations or tornado chart exist yet."
      - type: section
        title: "Ranked Drivers"
        note: "Reserved for driver id, type, name, Spearman rho, absolute rho, rank and direction."

  - name: "Methodology"
    codename: "shMethodology"
    visibility: "visible"
    role: "reference"
    purpose: "In-workbook documentation of the calculation methodology and assumptions."
    show_gridlines: false
    title: "Methodology"
    subtitle: "In-workbook documentation - written progressively as each phase lands"
    freeze_panes: "A6"
    column_widths: { A: 3, B: 34, C: 2, D: 26, E: 3, F: 62 }
    blocks:
      - type: section
        title: "Model Description"
        note: "PCCM is a probabilistic cost model for a single project. It combines deterministic cost estimating, three-point estimating and Monte Carlo simulation to produce a total project cost distribution and a defensible contingency at a stated confidence level."
      - type: section
        title: "Build Metadata"
        note: "Recorded at build time. None of these values is a computational input."
        metadata: true
      - type: section
        title: "Methodology Sections"
        note: "Reserved for escalation, FX, profiling, discounting, distributions, percentile method, contingency definitions, sensitivity method and stated limitations."

  - name: "_Calc"
    codename: "shCalc"
    visibility: "hidden"
    role: "technical"
    purpose: "Derived factor tables. Hidden but not very hidden, so an auditor can inspect it."
    show_gridlines: true
    title: "_Calc"
    subtitle: "Internal calculation workspace - holds the persistent permanent-ID counters"
    body: "structure"
    freeze_panes: null
    column_widths: { A: 3, B: 34, C: 16, D: 3, E: 62 }

  - name: "_SimData"
    codename: "shSimData"
    visibility: "veryHidden"
    role: "technical"
    purpose: "Raw iteration output. Machine data with no audit value in raw form."
    show_gridlines: true
    title: "_SimData"
    subtitle: "Internal simulation workspace"
    freeze_panes: null
    column_widths: { A: 3, B: 34, C: 2, D: 26 }
    blocks:
      - type: note
        text: "Not implemented yet. Internal workspace; intentionally empty."
