# =============================================================================
# PCCM - Workbook Structural Manifest
# =============================================================================
# This file is the STRUCTURAL AUTHORITY for the generated workbook. The builder
# reads it; it does not hardcode sheet names, order, visibility or presentation.
#
# Scope: structure and presentation. Input semantics (Setup inputs, Config list
# masters, tables, defined names, validation) live in input_contract.yaml.
# No business rules and no calculation logic belong in either file.
#
# Authority for functional design: docs/ARCHITECTURE-LOCK Revision B.
# =============================================================================

manifest_version: "1.3.0"

model:
  name: "Probabilistic Cost & Contingency Model"
  short_name: "PCCM"
  model_version: "0.5.0"
  build_phase: "Phase 5 - Calculation Workspace (Gate A: source)"
  reporting_currency: "SAR"      # locked model constant

workbook:
  stage_a_filename: "PCCM_stageA.xlsx"
  active_sheet: "Dashboard"      # must be a visible sheet
  # Architectural lock. The loader asserts the sheet list below matches this
  # exactly, in this order, so manifest drift fails the build loudly.
  locked_sheet_order:
    - "Dashboard"
    - "Setup"
    - "Config"
    - "Cost Lines"
    - "Risk Register"
    - "Inflation"
    - "Cost Profiling"
    - "Risk Profiling"
    - "Model Check"
    - "Results"
    - "Sensitivity"
    - "Methodology"
    - "_Calc"
    - "_SimData"

# -----------------------------------------------------------------------------
# Centralised presentation tokens. Nothing else in the builder defines a font,
# size or colour literal.
# -----------------------------------------------------------------------------
presentation:
  font_family: "Calibri"
  sizes:
    title: 16
    subtitle: 10
    section: 11
    label: 10
    value: 10
    note: 9
  colors:
    title: "1F2933"
    subtitle: "5A6673"
    section: "1F2933"
    label: "3E4C59"
    value: "1F2933"
    note: "7B8794"
    rule: "CBD2D9"
    # --- input language ---
    input_fill: "FFFBEF"      # editable user input
    input_border: "D8C9A3"
    locked_fill: "EFF1F4"     # model-controlled or locked constant
    locked_border: "C2CAD3"
    locked_text: "3E4C59"
    header_fill: "E2E6EB"     # table header
    not_applicable_fill: "E9EBEE"   # presentation only: cell not applicable for this row
  row_heights:
    title: 24
    subtitle: 15
    spacer: 8
    section: 18
    default: 15
  table_style: "TableStyleLight1"
  layout:
    title_row: 2
    subtitle_row: 3
    rule_row: 4
    body_start_row: 6
    label_column: "B"
    value_column: "D"

# ---------------------------------------------------------------------------
# PHASE 9 - THE MODEL CHECK SURFACE
# ---------------------------------------------------------------------------
# MODEL CHECK OWNS NO FACT. Every row below is a PRESENTATION of something an
# accepted owner already decided: the structural report, the live calculation
# state, the live simulation state, the four annual accessors, the Sensitivity
# sheet's own availability sentence and the requested iteration count. There is
# no state machine here, no second derivation, and no severity that changes a
# refusal anybody else would make.
#
# WHY THE REGISTER IS DECLARED AND NOT DISCOVERED. A check's severity, group,
# message and guidance are contract text; only WHETHER IT APPLIES is a runtime
# question. Declaring the population means the ORDER is fixed at build time -
# severity, then group, then check id - so the sheet cannot depend on the order
# in which Excel happened to evaluate anything. Discovery order is not an input
# to this layout.
#
# WHY TWO ROWS FOR ONE SIMULATION WORD. `SIM-010` and `SIM-020` both fire on
# simulation INVALID and are mutually exclusive on the calculation state. That
# is the Step-1 rule expressed as two conditions rather than as one row with a
# severity that moves: a severity that moved could not be sorted at build time,
# and a reader could not tell which rule produced the word in front of them.
#
# WHY THE STRUCTURAL FAULTS ARE SLOTS. ValidateStructure returns a LIST whose
# length nobody can know in advance, one fault per line. The slots below carry
# that list one line per row; the TOTAL is counted from the report string itself
# and is therefore exact and unbounded, whatever the slot capacity is.
# ---------------------------------------------------------------------------
phase9_shell:
  model_check:
    sheet: "Model Check"
    label_column: "B"
    value_column: "D"
    # RESTATED HERE ONLY SO THE TWO CAN BE COMPARED. The sheet entry below is
    # the authority; the builder refuses a mismatch rather than letting a
    # projection promise a freeze the workbook does not have.
    freeze_panes: "A6"

    # THE VOCABULARIES, DECLARED ONCE. Sort ranks are the list positions: a
    # severity or a group that is not in these lists has no ordinal and fails
    # the build rather than sorting somewhere arbitrary.
    severity_order: ["ERROR", "WARNING", "INFO"]
    group_order: ["Structure", "Inputs", "Calculation", "Simulation", "Annual", "Sensitivity"]
    # ACTIONABLE IS A PROPERTY OF SEVERITY AND NOTHING ELSE. INFO is context;
    # it is displayed faithfully and never counted, so it can never move the
    # Overall Status.
    actionable_severities: ["ERROR", "WARNING"]
    overall_states: ["PASS", "WARNING", "ERROR"]

    # THE VISIBLE WINDOW. One hundred rows, and one hundred is a RENDERING
    # capacity, never a claim about how many checks exist: the counts above the
    # register are computed over the whole logical population and the
    # disclosure below says so in words whenever the population is larger.
    row_window: 100
    disclosure_template: "Showing the first {window} of {total} checks."
    # THE ACCEPTED NO-DATA REPRESENTATION. An empty slot is not a check, exactly
    # as an empty tornado slot is not a category: Excel plots and compares "" as
    # a hard zero, and a zero here would be an issue nobody reported.
    no_data_formula: "=NA()"
    # THE SAME GUARD THE DASHBOARD MIRRORS USE, and for the same reason: Excel
    # reads an empty reference back as a hard 0, so an unguarded mirror of a
    # blank publication cell would print a fabricated zero where the honest
    # answer is "nothing has been published".
    mirror_formula: '=IF({ref}="","",{ref})'

    number_formats:
      text: "@"
      count: "#,##0"
      timestamp: "yyyy-mm-dd hh:mm:ss"

    summary:
      heading_row: 6
      note_row: 7
      heading: "Overall Model Status"
      note: "The aggregate of the register below. Errors and Warnings are the ACTIONABLE rows; information rows are context and are never counted. The Overall Status is derived from those two counts and from nothing else."
      rows:
        - {key: "overall_status", row: 8, label: "Overall Status", format: "text"}
        - {key: "error_count", row: 9, label: "Errors", format: "count"}
        - {key: "warning_count", row: 10, label: "Warnings", format: "count"}
        - {key: "info_count", row: 11, label: "Information", format: "count"}
        - {key: "total_checks", row: 12, label: "Checks evaluated", format: "count"}
        - {key: "evaluated", row: 13, label: "Evaluated", format: "timestamp"}
        - {key: "disclosure", row: 14, label: "Disclosure", format: "text"}

    register:
      heading_row: 15
      note_row: 16
      header_row: 17
      first_row: 18
      heading: "Validation Results"
      note: "One row per issue, ordered by severity, then by group in the declared order, then by check id. Never by worksheet position and never by the order anything was discovered. A row that reads #N/A is an unused slot, not a check."
      columns:
        - {key: "check_id", header: "Check ID", column: "B"}
        - {key: "group", header: "Group", column: "C"}
        - {key: "severity", header: "Severity", column: "D"}
        - {key: "subject", header: "Subject", column: "E"}
        - {key: "message", header: "Message", column: "F"}
        - {key: "guidance", header: "Guidance", column: "G"}

    # -------------------------------------------------------------------
    # THE EVALUATION SOURCE, IN PLAIN SIGHT
    # -------------------------------------------------------------------
    # It is on the sheet, below the register, and it is not hidden. Every
    # number in the summary can be added up by hand from these rows, which is
    # the whole claim the summary makes.
    evaluation:
      heading_row: 120
      note_row: 121
      heading: "Evaluation Source"
      note: "What the register is computed from. The readings are what the owners answered; the candidates are every declared check and every structural fault slot, in the fixed order, with the flags that decide whether each one is shown and counted."
      readings:
        heading_row: 123
        header_row: 124
        first_row: 125
        heading: "Readings"
        headers: {label: "Reading", value: "Value"}
        # EVERY ROW NAMES ITS OWNER. `procedure` calls a worksheet-safe
        # accessor; `mirror` reads a cell another accepted sheet already
        # publishes; `defined_name` reads the entered input itself; `derived`
        # is arithmetic over the rows above it and reaches nothing new.
        #
        # `anchor: true` MARKS A ZERO-ARGUMENT ACCESSOR THAT IS NOT VOLATILE.
        # Excel cannot see such a function's dependencies, so a cell holding one
        # would answer once and keep that answer forever - the defect the P8-1
        # record names. The anchored cells are made dependents of the volatile
        # `evaluated` heartbeat instead, which is the same declaration
        # `Application.Volatile` makes, expressed by the caller that needs it
        # rather than inside a module the command paths share.
        rows:
          - {key: "calculation_state", row: 125, label: "Calculation State (live)", kind: "procedure", procedure: "PCCM_ModelCheckCalculationState", format: "text"}
          - {key: "simulation_state", row: 126, label: "Simulation State (live)", kind: "procedure", procedure: "PCCM_ResultsSimulationState", format: "text"}
          - {key: "annual_distribution_state", row: 127, label: "Annual Distributions (live)", kind: "procedure", procedure: "PCCM_ResultsAnnualDistributionState", format: "text"}
          - {key: "annual_profile_state", row: 128, label: "Annual Profile (live)", kind: "procedure", procedure: "PCCM_ResultsAnnualProfileState", format: "text"}
          - {key: "annual_profile_px", row: 129, label: "Profile Confidence Level (live)", kind: "procedure", procedure: "PCCM_ResultsAnnualProfilePx", format: "text"}
          - {key: "annual_year_count", row: 130, label: "Years Covered (live)", kind: "procedure", procedure: "PCCM_ResultsAnnualYearCount", format: "count"}
          - {key: "structural_report", row: 131, label: "Structural Report (live)", kind: "procedure", procedure: "PCCM_StructuralReport", anchor: true, format: "text"}
          - {key: "calculation_refusal_detail", row: 132, label: "Why The Current Model Is Refused (live)", kind: "procedure", procedure: "PCCM_ModelCheckRefusalDetail", format: "text"}
          - {key: "calculation_refusal_subject", row: 133, label: "Which Driver The Refusal Is About (live)", kind: "procedure", procedure: "PCCM_ModelCheckRefusalSubject", format: "text"}
          - {key: "calculation_attempt_result", row: 134, label: "Last Calculation Attempt (last attempt)", kind: "procedure", procedure: "PCCM_CalculationAttemptResult", anchor: true, format: "text"}
          - {key: "calculation_attempt_detail", row: 135, label: "Last Calculation Attempt Detail (last attempt)", kind: "procedure", procedure: "PCCM_CalculationAttemptDetail", anchor: true, format: "text"}
          - {key: "requested_iterations", row: 136, label: "Monte Carlo Iterations (requested)", kind: "defined_name", defined_name: "inpMonteCarloIterations", format: "count"}
          - {key: "simulation_publication", row: 137, label: "Last Successful Simulation (publication)", kind: "mirror", source_block: "run_stamp", source_key: "last_successful_stamp", format: "text"}
          - {key: "published_run_id", row: 138, label: "Published Run ID (publication)", kind: "mirror", source_block: "run_stamp", source_key: "run_id", format: "text"}
          - {key: "published_iterations_run", row: 139, label: "Iterations Run (publication)", kind: "mirror", source_block: "run_stamp", source_key: "iterations_run", format: "count"}
          - {key: "simulation_status_last_evaluated", row: 140, label: "Simulation Status (last evaluated)", kind: "mirror", source_block: "run_stamp", source_key: "simulation_status", format: "text"}
          - {key: "sensitivity_availability", row: 141, label: "Sensitivity Availability (persisted comparison)", kind: "sensitivity_availability", format: "text"}
          - {key: "structural_fault_count", row: 142, label: "Structural Faults Reported", kind: "derived", derived: "structural_fault_count", format: "count"}
          - {key: "structural_surplus", row: 143, label: "Structural Faults Beyond The Slot Capacity", kind: "derived", derived: "structural_surplus", format: "count"}
      candidates:
        heading_row: 145
        header_row: 146
        first_row: 147
        heading: "Candidates"
        # THE SLOT CAPACITY IS THE VISIBLE WINDOW, and it is enough by
        # construction: structural faults are ERROR in the first group, so they
        # sort ahead of everything else, and a slot past the hundredth could
        # never be displayed even if it existed. The count above does not depend
        # on this number - it is read from the report string - so a larger fault
        # population is still reported in full, it is simply not all drawn.
        structural_slots: 100
        columns:
          - {key: "ordinal", header: "#", column: "B"}
          - {key: "check_id", header: "Check ID", column: "C"}
          - {key: "group", header: "Group", column: "D"}
          - {key: "severity", header: "Severity", column: "E"}
          - {key: "subject", header: "Subject", column: "F"}
          - {key: "message", header: "Message", column: "G"}
          - {key: "guidance", header: "Guidance", column: "H"}
          - {key: "active", header: "Active", column: "I"}
          - {key: "dedup_key", header: "Dedup Key", column: "J"}
          - {key: "counted", header: "Counted", column: "K"}
          - {key: "sequence", header: "Sequence", column: "L"}
          - {key: "line_start", header: "Line Start", column: "M"}
          - {key: "line_end", header: "Line End", column: "N"}
          - {key: "line", header: "Fault Line", column: "O"}

    # -------------------------------------------------------------------
    # THE STRUCTURAL FAULT SLOTS - what one line of the owner's report becomes
    # -------------------------------------------------------------------
    # ONE ROW PER FAULT, and the identity is the owner's own. `check_id` is the
    # bracketed key ValidateStructure prints, which names WHICH invariant
    # failed; `subject` is the rest of the line, which is how the owner
    # identifies WHAT failed. Model Check parses neither into a permanent id of
    # its own invention: it shows what the owner said.
    structural:
      group: "Structure"
      severity: "ERROR"
      guidance: "Correct the reported structural fault, then re-run the structural operation that reports it."

    # -------------------------------------------------------------------
    # THE DECLARED REGISTER
    # -------------------------------------------------------------------
    # `condition` is a worksheet expression over the READING KEYS above, written
    # as {key}. Nothing here spells a cell address: the builder resolves each key
    # to the row the readings block gives it, so a reading that moves takes its
    # conditions with it and a key that stops existing fails the BUILD by name.
    #
    # `{recommended_iterations}` resolves to the value the INPUT CONTRACT owns.
    # It is not written here, and <recommended> in a message or a guidance
    # sentence is the same value formatted for a reader. There is no literal.
    #
    # A `subject`, `message` or `check_id` that is exactly {key} becomes a
    # reference to that reading. Anything else is text.
    checks:
      - check_id: "STR-000"
        group: "Structure"
        severity: "INFO"
        subject: ""
        condition: '{structural_fault_count}=0'
        message: "Structural validation reports no fault."
        guidance: "No action is required."

      - check_id: "INP-010"
        group: "Inputs"
        severity: "WARNING"
        subject: "Monte Carlo Iterations"
        condition: '{requested_iterations}<{recommended_iterations}'
        message: "Monte Carlo iterations are below the recommended <recommended>; simulation precision may be lower at this setting."
        guidance: "Increase Monte Carlo Iterations on Setup to <recommended> or more before the next simulation run."
      - check_id: "INP-011"
        group: "Inputs"
        severity: "INFO"
        subject: "Monte Carlo Iterations"
        condition: '{requested_iterations}>={recommended_iterations}'
        message: "Monte Carlo iterations are at or above the recommended <recommended>."
        guidance: "No action is required."

      - check_id: "CAL-010"
        group: "Calculation"
        severity: "ERROR"
        # THE OFFENDING PERMANENT ID, AS A VALUE. P9-2B threads it out of the
        # owners that already hold it when they refuse; nothing here parses the
        # sentence beside it. It is legitimately BLANK for a model-wide refusal
        # - a missing register, an unusable discount rate - because no driver is
        # at fault in one, and a fabricated id would be worse than none.
        subject: "{calculation_refusal_subject}"
        condition: '{calculation_state}="INVALID"'
        # THE OWNER'S OWN LIVE SENTENCE, not a paraphrase and not the persisted
        # one. It names the fault - and, in prose, the driver - as of the model
        # AS IT STANDS. The (last attempt) rows below are history and may say
        # something else entirely.
        message: "{calculation_refusal_detail}"
        guidance: "Correct the refused input named above, then press Calculate on Setup."
      - check_id: "CAL-020"
        group: "Calculation"
        severity: "WARNING"
        subject: ""
        condition: '{calculation_state}="NOT CALCULATED"'
        message: "No calculation has been performed for this model."
        guidance: "Press Calculate on Setup to produce the calculated model."
      - check_id: "CAL-030"
        group: "Calculation"
        severity: "WARNING"
        subject: ""
        condition: '{calculation_state}="STALE"'
        message: "The inputs have changed since the last successful calculation."
        guidance: "Press Calculate on Setup to bring the calculated model up to date."
      - check_id: "CAL-040"
        group: "Calculation"
        severity: "INFO"
        subject: ""
        condition: '{calculation_state}="CURRENT"'
        message: "The calculated model is current for the inputs as they stand."
        guidance: "No action is required."
      - check_id: "CAL-050"
        group: "Calculation"
        severity: "INFO"
        subject: "{calculation_attempt_result}"
        condition: 'AND({calculation_attempt_result}<>"",{calculation_attempt_result}<>"NONE")'
        message: "The last recorded calculation attempt (last attempt). It is history and never the live state above."
        guidance: "No action is required; the live Calculation State reading is the current answer."
      - check_id: "CAL-051"
        group: "Calculation"
        severity: "INFO"
        subject: "{calculation_attempt_detail}"
        condition: '{calculation_attempt_detail}<>""'
        message: "What the last calculation attempt reported (last attempt). Where an input was refused, this is where the owner named it."
        guidance: "No action is required; press Calculate to produce a fresh answer."

      - check_id: "SIM-010"
        group: "Simulation"
        severity: "ERROR"
        subject: ""
        condition: 'AND({simulation_state}="INVALID",{calculation_state}="CURRENT")'
        message: "The simulation request cannot be formed even though the calculation is current, so the fault belongs to the request itself."
        guidance: "Correct the iteration count or the seed on Setup, then run the simulation again."
      - check_id: "SIM-020"
        group: "Simulation"
        severity: "INFO"
        subject: ""
        condition: 'AND({simulation_state}="INVALID",{calculation_state}<>"CURRENT")'
        message: "The simulation is INVALID because the calculation is not current. The calculation row is the root cause and this row is shown as context rather than counted a second time."
        guidance: "Resolve the calculation state; this clears with it."
      - check_id: "SIM-030"
        group: "Simulation"
        severity: "WARNING"
        subject: ""
        condition: '{simulation_state}="STALE"'
        message: "The model has changed since the published simulation was run."
        guidance: "Run Simulation on Setup to publish a result for the model as it stands."
      - check_id: "SIM-040"
        group: "Simulation"
        severity: "INFO"
        subject: ""
        condition: '{simulation_state}="CURRENT"'
        message: "The published simulation is current for the model as it stands."
        guidance: "No action is required."
      - check_id: "SIM-050"
        group: "Simulation"
        severity: "INFO"
        # AN OPTIONAL PRODUCT THAT HAS NOT BEEN PRODUCED IS NOT A DEFECT. No
        # accepted contract makes the simulation, the annual step or the
        # sensitivity ranking mandatory, so their absence is context and can
        # never be actionable. The flag is projected so a runner can check that
        # without knowing which ids they happen to be.
        optional_publication: true
        subject: ""
        condition: '{simulation_publication}=""'
        message: "No simulation has been published. Simulation is optional and its absence is not a defect."
        guidance: "Run Simulation on Setup when a probabilistic result is wanted."
      - check_id: "SIM-060"
        group: "Simulation"
        severity: "INFO"
        subject: "{published_run_id}"
        condition: '{simulation_publication}<>""'
        message: "The published run (publication history)."
        guidance: "No action is required."
      - check_id: "SIM-070"
        group: "Simulation"
        severity: "INFO"
        subject: "{simulation_status_last_evaluated}"
        condition: '{simulation_status_last_evaluated}<>""'
        message: "The simulation status as it was last evaluated (last evaluated). It is history and never the live state above."
        guidance: "No action is required; the live Simulation State reading is the current answer."

      - check_id: "ANN-010"
        group: "Annual"
        severity: "WARNING"
        subject: ""
        condition: '{annual_profile_state}="HISTORICAL"'
        message: "The stored annual profile belongs to an earlier run."
        guidance: "Run Annual Stochastic on Setup again for the published run."
      - check_id: "ANN-020"
        group: "Annual"
        severity: "WARNING"
        subject: "{annual_profile_px}"
        condition: '{annual_profile_state}="OTHER Px"'
        message: "The stored annual profile belongs to a different confidence level from the one now selected."
        guidance: "Run Annual Stochastic on Setup again at the selected confidence level."
      - check_id: "ANN-030"
        group: "Annual"
        severity: "INFO"
        optional_publication: true
        subject: ""
        condition: '{annual_distribution_state}="NOT PRODUCED"'
        message: "No annual result has been produced. The annual step is optional and its absence is not a defect."
        guidance: "Run Annual Stochastic on Setup when an annual profile is wanted."
      - check_id: "ANN-040"
        group: "Annual"
        severity: "INFO"
        subject: "{annual_year_count}"
        condition: '{annual_distribution_state}="CURRENT"'
        message: "The stored annual distributions are current for the published run, over the stamped year count."
        guidance: "No action is required."
      - check_id: "ANN-050"
        group: "Annual"
        severity: "WARNING"
        subject: ""
        condition: '{annual_distribution_state}="HISTORICAL"'
        message: "The stored annual distributions belong to an earlier run."
        guidance: "Run Annual Stochastic on Setup again for the published run."

      - check_id: "SEN-010"
        group: "Sensitivity"
        severity: "INFO"
        # THE WHOLE SENTENCE, INCLUDING "not produced for this run". The
        # Sensitivity sheet says all three of its honest answers in one line and
        # Model Check mirrors it rather than splitting it into rows of its own.
        optional_publication: true
        subject: ""
        condition: '{sensitivity_availability}<>""'
        message: "{sensitivity_availability}"
        guidance: "No action is required; the sentence is the Sensitivity sheet's own and is a persisted comparison."


# -----------------------------------------------------------------------------
# Sheets, in locked order.
#
# block types:
#   section - a heading, an optional note, and optional labelled rows
#   note    - a standalone explanatory line
# -----------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# THE PHASE-6 PUBLICATION SHELL - physical authority.
#
# sim_contract.yaml owns WHICH fields exist and what they mean; this block owns
# WHERE each label and formula sits on a sheet. The loader cross-validates the
# two, so a row here that names a field the contract does not have, or omits
# one it does, is a build failure.
#
# EVERY RESULTS FORMULA IS A LOOKUP. Nothing on Results averages, deviates,
# interpolates a quantile or subtracts a contingency: modSimStats computes
# those numbers and the run PERSISTS them into _SimData. A formula that
# recomputed one would be a second statistics engine living on a worksheet,
# and the two would drift the first time either changed.
#
# Every banked lookup reads the ACTIVE bank. A formula pinned to one bank would
# show the published distribution only half the time.
# ---------------------------------------------------------------------------
phase6_shell:
  # -----------------------------------------------------------------------
  # PHASE 7. The Sensitivity table, materialised as LOOKUPS and nothing else.
  #
  # Every cell reads the persisted `_SimData` sensitivity block for the active
  # bank. Nothing here computes a rank, a correlation or an ordering: the
  # authoritative answer was produced by PCCM_RunSensitivity and this sheet
  # shows it, exactly as Results shows the distribution it never computed.
  #
  # THE WINDOW IS BOUNDED AND THE COUNT DECIDES. A row beyond the persisted
  # record count is blank, so a later model with fewer drivers cannot leave a
  # previous run's surplus rows on display.
  #
  # AND IT SAYS WHOSE ANSWER IT IS. The availability line above the table
  # compares the sensitivity stamp against the active run's own identity, so a
  # table produced for one run can never be read as current for another.
  # -----------------------------------------------------------------------
  sensitivity:
    sheet: "Sensitivity"
    label_column: "B"
    first_column: "B"
    heading_row: 8
    note_row: 9
    availability_row: 10
    header_row: 12
    first_row: 13
    # DECLARED, NOT DERIVED, and said plainly because there is nothing to
    # derive it from: no contract names a maximum driver population. 200 was
    # the value that truncated the 300-driver design-scale probe in silence.
    # 1000 clears the largest model this project has measured by more than
    # threefold and costs Excel 8,000 lookup formulas where it already carried
    # 1,600. It is a capacity, not a limit on the result: the persisted block
    # remains complete whatever this number is, and the availability line below
    # announces an overflow rather than letting the sheet imply there is none.
    row_window: 1000
    heading: "Ranked Drivers"
    note: "Spearman rank correlation of each driver's nominal contribution against Total Nominal Project Cost, over every iteration of the run named below. Monotone association, not a share of variance."
    availability_label: "Sensitivity"
    # THE THREE HONEST ANSWERS. Not produced; produced for THIS run; produced
    # for a different one. The third is the case that must never be silent.
    availability_formula: '=IF(_SimData!$D$30="","No simulation has been published.",IF(IF(_SimData!$D$30="A",_SimData!$CC$14,_SimData!$CL$14)<>"PUBLISHED","Not produced for this run. Run Sensitivity to produce it.",IF(AND(IF(_SimData!$D$30="A",_SimData!$CC$10,_SimData!$CL$10)=IF(_SimData!$D$30="A",_SimData!$D$10,_SimData!$F$10),IF(_SimData!$D$30="A",_SimData!$CC$11,_SimData!$CL$11)=IF(_SimData!$D$30="A",_SimData!$D$11,_SimData!$F$11)),"CURRENT for run "&IF(_SimData!$D$30="A",_SimData!$CC$8,_SimData!$CL$8),"NOT CURRENT - this table belongs to run "&IF(_SimData!$D$30="A",_SimData!$CC$8,_SimData!$CL$8)&", not to the published run.")&IF(IF(_SimData!$D$30="A",_SimData!$CC$13,_SimData!$CL$13)>1000," - showing the first 1000 of "&IF(_SimData!$D$30="A",_SimData!$CC$13,_SimData!$CL$13)&" ranked drivers; the complete result is persisted.","")))'
    columns:
      - {key: "driver_id", header: "Driver ID", column: "B", offset: 0}
      - {key: "driver_type", header: "Type", column: "C", offset: 1}
      - {key: "driver_name", header: "Name", column: "D", offset: 2}
      - {key: "rho", header: "Rho", column: "E", offset: 3}
      - {key: "abs_rho", header: "|Rho|", column: "F", offset: 4}
      - {key: "rank", header: "Rank", column: "G", offset: 5}
      - {key: "direction", header: "Direction", column: "H", offset: 6}
      - {key: "status", header: "Status", column: "I", offset: 7}

