    selected:
      confidence_level_row: 46
      quantile_row: 47
      contingency_row: 48
      labels:
        confidence_level: "Selected Confidence Level"
        quantile: "Selected Px"
        contingency: "Contingency"
      confidence_level_formula: '=IF(inpSelectedConfidenceLevel="","",inpSelectedConfidenceLevel)'
      quantile_nominal: '=IF(OR(_SimData!$D$30="",COUNTIF(_SimData!$J$12:$J$21,inpSelectedConfidenceLevel)=0),"",IF(_SimData!$D$30="A",INDEX(_SimData!$K$11:$K$21,MATCH(inpSelectedConfidenceLevel,_SimData!$J$11:$J$21,0)),INDEX(_SimData!$M$11:$M$21,MATCH(inpSelectedConfidenceLevel,_SimData!$J$11:$J$21,0))))'
      quantile_pv: '=IF(OR(_SimData!$D$30="",COUNTIF(_SimData!$J$12:$J$21,inpSelectedConfidenceLevel)=0),"",IF(_SimData!$D$30="A",INDEX(_SimData!$L$11:$L$21,MATCH(inpSelectedConfidenceLevel,_SimData!$J$11:$J$21,0)),INDEX(_SimData!$N$11:$N$21,MATCH(inpSelectedConfidenceLevel,_SimData!$J$11:$J$21,0))))'
      contingency_nominal: '=IF(OR(_SimData!$D$30="",COUNTIF(_SimData!$P$9:$P$18,inpSelectedConfidenceLevel)=0),"",IF(_SimData!$D$30="A",INDEX(_SimData!$Q$8:$Q$18,MATCH(inpSelectedConfidenceLevel,_SimData!$P$8:$P$18,0)),INDEX(_SimData!$S$8:$S$18,MATCH(inpSelectedConfidenceLevel,_SimData!$P$8:$P$18,0))))'
      contingency_pv: '=IF(OR(_SimData!$D$30="",COUNTIF(_SimData!$P$9:$P$18,inpSelectedConfidenceLevel)=0),"",IF(_SimData!$D$30="A",INDEX(_SimData!$R$8:$R$18,MATCH(inpSelectedConfidenceLevel,_SimData!$P$8:$P$18,0)),INDEX(_SimData!$T$8:$T$18,MATCH(inpSelectedConfidenceLevel,_SimData!$P$8:$P$18,0))))'
    # -------------------------------------------------------------------
    # PHASE 8, STEP 1. The two sections this sheet reserved from the start.
    #
    # `sheets: Results` has declared "Full statistical output, cash flow and the
    # analytical reconciliation bridge" since Phase 1, and the two blocks below
    # were carried as `deferred` placeholders until the thing they present
    # existed. Phase 7 produced it, so they stop being placeholders here. NO NEW
    # WORKSHEET: the workbook stays at fourteen sheets and this is the surface
    # the existing design pointed at.
    #
    # NOT ONE `_SimData` ADDRESS IS WRITTEN BELOW, and that is deliberate. The
    # Sensitivity availability line above spells its addresses as literals, and
    # P7-4 is what that cost: the persisted block moved from J/S to CC/CL, every
    # generated cell moved with it, and the hand-written formula did not - so a
    # successful run reported "Not produced for this run" forever. These blocks
    # carry ROWS, LABELS, HEADERS and FORMATS only. Every column letter, every
    # stamp row and every state word is resolved by the renderer from
    # `sim_contract.yaml`, and the two identity tolerances come from
    # `calc_contract.yaml`. A contract move moves this sheet with it.
    # -------------------------------------------------------------------
    annual:
      heading_row: 51
      note_row: 52
      distribution_state_row: 53
      profile_state_row: 54
      profile_px_row: 55
      year_count_row: 56
      header_row: 58
      first_row: 59
      heading: "Annual Cash Flow"
      note: "The selected-Px annual profile of the published run, read back from the stored result. The publication marker and the stamped year count decide how far the answer reaches - never the last non-blank row. Nothing here recomputes a percentile, a profile or a blend."
      labels:
        distribution_state: "Annual Distributions"
        profile_state: "Annual Profile"
        profile_px: "Profile Confidence Level"
        year_count: "Years Covered"
      columns:
        - {key: "project_index", header: "Project Year", column: "B",
           source: "index", field: "project_index", format: "year"}
        - {key: "calendar_year", header: "Calendar Year", column: "D",
           source: "index", field: "calendar_year", format: "year"}
        - {key: "nominal", header: "Selected Px - Nominal (SAR)", column: "F",
           source: "profile", field: "nominal", format: "money"}
        - {key: "pv", header: "Selected Px - PV (SAR)", column: "H",
           source: "profile", field: "pv", format: "money"}
    reconciliation:
      heading_row: 260
      note_row: 261
      header_row: 262
      first_row: 263
      heading: "Reconciliation"
      note: "The accepted identity: the selected-Px annual profile sums to the reported selected-Px TOTAL. The verdict below is taken on the stored values, not on the rounded figures shown."
      headers: {label: "Check", nominal: "Nominal (SAR)", pv: "PV (SAR)"}
      rows:
        - {key: "total", label: "Total at Selected Px", format: "money"}
        - {key: "profile_sum", label: "Sum of Annual Profile", format: "money"}
        - {key: "difference", label: "Difference", format: "delta"}
        - {key: "allowance", label: "Identity Allowance", format: "delta"}
        - {key: "status", label: "Status", format: "text"}
      verdicts:
        reconciled: "Reconciled"
        mismatch: "NOT RECONCILED"
        # A reconciliation of a profile that is not the current answer must not
        # read as one that is. The state word is APPENDED between these two
        # fragments, never substituted for the verdict.
        qualifier_prefix: " - for the "
        qualifier_suffix: " profile, not the current model answer"
    number_formats:
      money: "#,##0"
      year: "0"
      delta: "0.00E+00"
      text: "General"

  # -------------------------------------------------------------------
  # PHASE 8, STEP 2. The Dashboard executive summary.
  #
  # DASHBOARD OWNS NOTHING. Every analytical value below is a MIRROR of a
  # Results cell - `=IF(Results!$D$47="","",Results!$D$47)` - and there is no
  # second form of it anywhere in this block. It derives no state, resolves no
  # percentile, subtracts no base, sums no profile and compares nothing to a
  # tolerance. That is not a style preference: P8-1 spent a round establishing
  # that a presentation layer owning half a semantic owns a semantic that will
  # diverge, and this sheet is one layer further from the owner than that one.
  #
  # NOT ONE `_SimData` ADDRESS APPEARS BELOW, and not one Results ROW NUMBER
  # either. A row is named by the BLOCK and KEY it has on Results
  # (`summary`/`deterministic_base_a`, `selected`/`total`, `state`/`profile_px`),
  # and the renderer resolves that pair against the same `results:` block above
  # that built the Results sheet. Move a Results row and this sheet moves with
  # it; delete one and the build fails naming the key. There is exactly one
  # geometry authority and it is not this block.
  #
  # WHAT IS DELIBERATELY ABSENT. There is no deterministic-model-status line,
  # because Results does not publish one - see `status.note`. Inventing it here
  # from `_Calc` would be the bypass this step exists to refuse.
  dashboard:
    sheet: "Dashboard"
    source_sheet: "Results"
    label_column: "B"
    nominal_column: "D"
    pv_column: "F"
    # A MIRROR, AND THE BLANK IS PART OF IT. The guard is what stops an empty
    # Results cell arriving here as a hard zero: Excel reads a blank reference
    # as 0, and a fabricated 0 next to the words NOT PRODUCED is exactly the
    # dishonesty P8-1's empty-state gate was built to catch. `{ref}` is the
    # resolved absolute address of the Results cell and nothing else is
    # substituted into it.
    mirror_formula: '=IF({ref}="","",{ref})'
    sections:
      - key: "status"
        row: 8
        note_row: 9
        first_row: 10
        title: "Result Status"
        # THE LIVE ANSWER IS THE ANNUAL STATE, and the order of these rows says
        # so. The four state lines are volatile Phase-8 adapters over the
        # accepted Phase-7 accessors: they re-derive on every calculation cycle.
        # The two simulation-status lines beneath them are the PERSISTED pair -
        # Results labels its own row "(last evaluated)" - so they are shown
        # last, under their own heading, and never as the headline. Reading them
        # as the current state is the first defect P8-1 disclosed.
        note: "The annual state lines are re-derived live on every recalculation. The simulation status beneath them is the last evaluated record, not a live answer, and is shown for provenance only."
        rows:
          - {key: "distribution_state", source_block: "state", source_key: "distribution_state", format: "text"}
          - {key: "profile_state", source_block: "state", source_key: "profile_state", format: "text"}
          - {key: "profile_px", source_block: "state", source_key: "profile_px", format: "text"}
          - {key: "year_count", source_block: "state", source_key: "year_count", format: "year"}
          - {key: "selected_confidence_level", source_block: "selected", source_key: "confidence_level", format: "text"}
          - {key: "simulation_status", source_block: "run_stamp", source_key: "simulation_status", format: "text"}
          - {key: "status_evaluated_at", source_block: "run_stamp", source_key: "status_evaluated_at", format: "text"}
      - key: "headline"
        row: 18
        note_row: 19
        header_row: 20
        first_row: 21
        title: "Headline Cost"
        note: "The deterministic base, the total at the selected confidence level, and the difference between them. Blank until a simulation has been published."
        headers: {label: "Measure", nominal: "Nominal (SAR)", pv: "PV (SAR)"}
        # THE TWO LADDERS STAY TWO ROWS. W5 read the contingency block as the
        # total and failed four reconciliations by exactly the deterministic
        # base; a dashboard that showed one of them under the other's name would
        # make the same error unfalsifiable, because nothing here recomputes the
        # difference that would expose it.
        rows:
          - {key: "deterministic_base", source_block: "summary", source_key: "deterministic_base_a", format: "money", emphasis: false}
          - {key: "selected_total", source_block: "selected", source_key: "total", format: "money", emphasis: true}
          - {key: "contingency", source_block: "selected", source_key: "contingency", format: "money", emphasis: true}
      - key: "distribution"
        row: 25
        note_row: 26
        header_row: 27
        first_row: 28
        title: "Distribution Summary"
        note: "Persisted by the run. Nothing on this sheet recomputes a statistic, and no percentile is interpolated here."
        headers: {label: "Statistic", nominal: "Nominal (SAR)", pv: "PV (SAR)"}
        # NAMED BY LADDER KEY, NEVER BY THE WORD "P90". Which rung each key
        # spells is the simulation contract's to say, and Results already
        # carries its label; this sheet takes that label rather than typing a
        # second one that a contract move would silently falsify.
        rows:
          - {key: "mean", source_block: "summary", source_key: "mean", format: "money"}
          - {key: "sample_standard_deviation", source_block: "summary", source_key: "sample_standard_deviation", format: "money"}
          - {key: "lower", source_block: "summary", source_key: "quantile_1", format: "money"}
          - {key: "median", source_block: "summary", source_key: "quantile_2", format: "money"}
          - {key: "upper", source_block: "summary", source_key: "quantile_10", format: "money"}
      - key: "annual"
        row: 34
        note_row: 35
        header_row: 36
        first_row: 37
        title: "Annual Profile and Reconciliation"
        # NOT THE TABLE. The 200-row annual window stays on Results; an
        # executive needs to know that a profile exists, whose Px it is, whether
        # it is the current answer and whether it reconciles - which is four
        # lines, and the state lines above already carry the first three.
        note: "The identity, taken on Results from the stored values. The status carries its own qualifier when the profile is not the current model answer; this sheet repeats that qualifier and never strips it."
        headers: {label: "Check", nominal: "Nominal (SAR)", pv: "PV (SAR)"}
        rows:
          - {key: "total", source_block: "reconciliation", source_key: "total", format: "money"}
          - {key: "profile_sum", source_block: "reconciliation", source_key: "profile_sum", format: "money"}
          - {key: "difference", source_block: "reconciliation", source_key: "difference", format: "delta"}
          - {key: "status", source_block: "reconciliation", source_key: "status", format: "text"}
      - key: "context"
        row: 43
        note_row: 44
        first_row: 45
        title: "Run Context"
        note: "The identity of the published run, as Results records it. Blank until a simulation commits."
        rows:
          - {key: "run_id", source_block: "run_stamp", source_key: "run_id", format: "text"}
          - {key: "model_version", source_block: "run_stamp", source_key: "model_version", format: "text"}
          - {key: "iterations_run", source_block: "run_stamp", source_key: "iterations_run", format: "year"}
          - {key: "seed_mode", source_block: "run_stamp", source_key: "seed_mode", format: "text"}
          - {key: "effective_seed", source_block: "run_stamp", source_key: "effective_seed", format: "text"}
          - {key: "applied_timeline", source_block: "run_stamp", source_key: "applied_timeline", format: "text"}
      # P8-3. THE ONE STATE LINE THE CHARTS NEED THAT IS NOT ALREADY ABOVE.
      # The annual distribution state, the profile state and the profile Px are
      # mirrored at rows 10-12 and a reader meets them there; repeating them
      # here would be one Results cell under two labels, which the projection
      # refuses. What is genuinely new is whether the sensitivity ranking the
      # tornado plots is available at all, and for which run.
      # P8-3. PLACED INSIDE THE CHART REGION, DIRECTLY ABOVE THE CHARTS, and
      # that position is the point. The annual state lines are frozen on screen
      # by the pane setting above; these two are the ones the histogram and the
      # tornado need, and a reader meets them immediately before the plots they
      # qualify rather than forty rows away.
      - key: "chart_status"
        row: 60
        note_row: 61
        first_row: 62
        title: "Chart Status"
        note: "The two lines the charts below need that the summary above does not carry. The simulation state is live: it goes STALE the moment the request drifts, with nothing rerun. The availability sentence says whether the ranked sensitivity table belongs to the published run - a different question, and neither answers the other."
        rows:
          - {key: "simulation_state", source_block: "chart_status", source_key: "simulation_state", format: "text"}
          - {key: "sensitivity_availability", source_block: "chart_status", source_key: "sensitivity_availability", format: "text"}
    # THE CHART REGION. P8-3 draws into it; the cells inside it stay empty,
    # because a chart is an object anchored over cells rather than a value in
    # them. It is declared here so the summary above can never grow down into it
    # unnoticed: the loader refuses a section that reaches this row.
    chart_region:
      heading_row: 57
      note_row: 58
      # THE FIRST ROW A CHART MAY BE ANCHORED IN. The chart-status section sits
      # between the note and this row: inside the region, above every plot, and
      # below the summary it must not disturb.
      first_row: 64
      last_row: 124
      heading: "Charts"
      note: "The cumulative cost curve, the total-cost distribution, the annual cash flow and the top drivers by rank correlation. Each plots the published answer the summary above reports and inherits its state; none of them recomputes anything."
    number_formats:
      money: "#,##0"
      year: "0"
      delta: "0.00E+00"
      text: "General"

  # -------------------------------------------------------------------
  # PHASE 8, STEP 3. The analytical chart layer.
  #
  # A SEPARATE BLOCK ON PURPOSE. The `results:` block above is the surface the
  # accepted P8-1 Windows run was produced against and a control asserts it is
  # byte-identical to that commit; `dashboard:` is P8-2's. Charts need geometry
  # in BOTH sheets, so they get their own block rather than growing either of
  # the two that already carry accepted evidence.
  #
  # THE ARCHITECTURE, IN ONE LINE PER HOP:
  #   accepted engine -> Results (or Sensitivity) -> chart bridge -> chart
  # No chart series reads `_SimData` or `_Calc`. The BRIDGE does, exactly as
  # every other Results formula does, because Results is the presentation
  # surface that is allowed to; a chart pointed at machine storage would be a
  # fourth reader of a block whose addresses have already moved once.
  #
  # WHY A BRIDGE AT ALL, RATHER THAN CHARTING RESULTS DIRECTLY. Two reasons and
  # they are both about honesty, not convenience:
  #
  #   BLANK IS NOT ZERO, BUT EXCEL CHARTS IT AS ZERO. The display tables emit
  #   "" past the stamped year count and when nothing is produced. A chart
  #   series over "" plots a flat run of zeros - fabricated years that look like
  #   a project costing nothing. The bridge emits NA() instead, which every
  #   chart type declines to plot. The display table keeps its "" because a
  #   READER wants an empty cell and a CHART wants an absent point.
  #
  #   A CUMULATIVE SERIES DOES NOT EXIST ANYWHERE YET. It is display arithmetic
  #   over cells already on the sheet - a running SUM of the published profile -
  #   and it is the one series this step adds. It re-allocates nothing.
  #
  # EVERY BLOCK BELOW IS DERIVED CHART-ONLY DATA. None of it is an analytical
  # output, none of it is an authority, and nothing but a chart reads it. It is
  # rendered visibly rather than hidden so an auditor can see what each chart is
  # actually plotting.
  charts:
    bridge_sheet: "Results"
    chart_sheet: "Dashboard"
    # THE ONE HOP OUTSIDE RESULTS. Sensitivity is where Phase 7 publishes the
    # ranked driver population, so it is the tornado's presentation authority -
    # the manifest names it here rather than letting a chart discover it.
    sensitivity_sheet: "Sensitivity"
    # THE ENDPOINT THAT PRODUCES THE RANKING THE TORNADO PLOTS. Named here
    # because the tornado is its only consumer in this layer, and because a
    # Windows runner that had to type it would be a second declaration of
    # something the structure contract owns. Nothing calls it automatically:
    # sensitivity is produced when an operator asks for it, and the chart says
    # so when nobody has.
    sensitivity_endpoint: "PCCM_RunSensitivity"
    number_formats:
      money: "#,##0"
      year: "0"
      rho: "0.000"
      text: "General"
    # -----------------------------------------------------------------
    # THE BRIDGE, ON RESULTS, BELOW EVERYTHING THE EARLIER STEPS OWN
    # -----------------------------------------------------------------
    bridge:
      heading_row: 272
      note_row: 273
      heading: "Chart Data"
      note: "Derived for the Dashboard charts and read by nothing else. Not an analytical output and not an authority: every value below is taken from the published tables above, with NA() where a chart must plot no point rather than a zero."
      annual:
        heading_row: 275
        note_row: 276
        header_row: 278
        first_row: 279
        heading: "Annual Series"
        note: "The published annual profile, bounded by the stamped year count, plus its running total. NA() past the last stamped year and whenever no annual result is produced."
        columns:
          - {key: "project_index", header: "Project Year", column: "B", source: "annual", field: "project_index", format: "year"}
          - {key: "calendar_year", header: "Calendar Year", column: "D", source: "annual", field: "calendar_year", format: "year"}
          - {key: "annual_nominal", header: "Annual Nominal", column: "F", source: "annual", field: "nominal", format: "money"}
          - {key: "cumulative_nominal", header: "Cumulative Nominal", column: "H", source: "cumulative", field: "nominal", format: "money"}
          - {key: "cumulative_pv", header: "Cumulative PV", column: "J", source: "cumulative", field: "pv", format: "money"}
      distribution:
        heading_row: 483
        note_row: 484
        header_row: 486
        first_row: 487
        bin_count: 20
        heading: "Distribution Bins"
        note: "Equal-width bins across the published minimum and maximum of the total nominal cost, counted over the published iteration column. No statistic is recomputed here: the edges come from the summary rows above and the counts are a tally."
        # NOMINAL ONLY, AND DELIBERATELY. The headline TOTAL and the contingency
        # this workbook exists to set are read off the nominal ladder; a second
        # histogram on a different scale would double the ink and halve the
        # readability for a question nobody asked at this altitude.
        measure: "nominal"
        columns:
          - {key: "lower", header: "Bin Lower", column: "B", format: "money"}
          - {key: "upper", header: "Bin Upper", column: "D", format: "money"}
          - {key: "count", header: "Iterations", column: "F", format: "year"}
      drivers:
        heading_row: 511
        note_row: 512
        header_row: 514
        first_row: 515
        top_n: 10
        heading: "Top Drivers"
        note: "The first rows of the accepted Sensitivity ranking, in the order that sheet publishes them. This block selects a window; it does not rank, re-sort or sign anything."
        columns:
          - {key: "driver_name", header: "Driver", column: "B", source: "driver_name", format: "text"}
          - {key: "rho", header: "Rho", column: "D", source: "rho", format: "rho"}
      status:
        heading_row: 528
        note_row: 529
        first_row: 530
        heading: "Chart Status"
        note: "The two state lines the charts need that Results does not already publish. Neither is re-derived here: the simulation state is the accepted pure evaluator asked through a volatile adapter, and the availability sentence is mirrored whole from Sensitivity, so the Dashboard keeps mirroring one sheet."
        rows:
          # THE LIVE SIMULATION STATE, and it is the one the histogram needs.
          # Results already publishes the persisted `(last evaluated)` row, and
          # P8-1 proved in live Excel that it can still read CURRENT after a
          # request change - so a chart qualified by it would look current for a
          # run the model has moved past. This asks the pure semantic owner
          # instead, through a volatile adapter, and passes the word through
          # untranslated: STALE stays STALE and INVALID stays INVALID.
          - {key: "simulation_state", label: "Simulation State (live)", source: "simulation_state", format: "text"}
          - {key: "sensitivity_availability", label: "Sensitivity Availability", source: "sensitivity_availability", format: "text"}
    # -----------------------------------------------------------------
    # THE CHARTS, ON THE DASHBOARD, IN THE RESERVED REGION
    # -----------------------------------------------------------------
    # NO CHART JUNK. Every chart below is 2-D, has no legend unless it carries
    # more than one series, has no major gridlines on the category axis, and
    # carries its title once - on the chart, not repeated in a cell above it.
    charts:
      - key: "s_curve"
        kind: "line"
        anchor: "B65"
        width: 9.6
        height: 7.2
        title: "Cumulative Cost"
        source: "annual"
        categories: "calendar_year"
        series:
          - {key: "cumulative_nominal", name: "Cumulative Nominal"}
          - {key: "cumulative_pv", name: "Cumulative PV"}
        state_source: "profile_state"
      - key: "histogram"
        kind: "column"
        anchor: "F65"
        width: 9.6
        height: 7.2
        title: "Total Cost Distribution"
        source: "distribution"
        categories: "lower"
        series:
          - {key: "count", name: "Iterations"}
        # THE PUBLISHED SIMULATION'S OWN STATE, not the annual product's. The
        # annual line reads NOT PRODUCED whenever the annual step has not run,
        # which says nothing about a histogram whose data is present.
        state_source: "simulation_state"
      - key: "annual_cash_flow"
        kind: "column"
        anchor: "B85"
        width: 9.6
        height: 7.2
        title: "Annual Cash Flow"
        source: "annual"
        categories: "calendar_year"
        series:
          - {key: "annual_nominal", name: "Annual Nominal"}
        state_source: "profile_state"
      - key: "tornado"
        kind: "bar"
        anchor: "F85"
        width: 9.6
        height: 7.2
        title: "Top Drivers by Rank Correlation"
        source: "drivers"
        categories: "driver_name"
        series:
          - {key: "rho", name: "Rho"}
        # TWO QUESTIONS, AND THEY DO NOT COLLAPSE. The availability sentence
        # answers "does this ranked table belong to the published run?" by
        # comparing two PERSISTED records - it is structurally blind to a model
        # that has moved since. The live simulation state answers "does that
        # published run still match the model?". A tornado is only current when
        # both are, and either one alone would have said CURRENT after the
        # request drifted.
        state_source: "sensitivity_availability"
        also_qualified_by: "simulation_state"

sheets:

  - name: "Dashboard"
    codename: "shDashboard"
    visibility: "visible"
    role: "output"
    purpose: "Executive decision summary. Read-only; every figure originates on Results."
    show_gridlines: false
    title: "Dashboard"
    subtitle: "Executive summary - every figure is a mirror of Results"
    # P8-3. THE RESULT STATUS BLOCK STAYS ON SCREEN. Rows 8-16 carry the annual
    # distribution and profile states, the published profile Px, the year count
    # and the selected level; the charts are forty rows below them. Without this
    # a reader scrolled to a chart sees no state at all, and HISTORICAL becomes
    # indistinguishable from CURRENT by simply being out of view. Freezing costs
    # nothing, duplicates nothing, and creates no second authority.
    freeze_panes: "A17"
    column_widths: { A: 3, B: 34, C: 3, D: 22, E: 3, F: 22, G: 3, H: 22 }
    blocks:
      # P8-2. THE SECTION PLACEHOLDERS ARE GONE, replaced by the projected
      # geometry in `phase6_shell.dashboard`. What stays is the one line that
      # says where these numbers come from - it belongs to the sheet rather
      # than to any section of it, and it sits at the manifest's body start
      # row, two rows above the first projected heading.
      - type: note
        text: "Every figure on this sheet is a mirror of a Results cell. Nothing here is derived, recomputed or re-stated: Results is the authority for every value, every state word and every reconciliation verdict below."

  - name: "Setup"
    codename: "shSetup"
    visibility: "visible"
    role: "input"
    purpose: "Project-level parameters and the FX rate table. Sole FX-rate authority."
    show_gridlines: false
    title: "Setup"
    subtitle: "Project parameters, FX rates, and the applied timeline"
    body: "contract"
    freeze_panes: "A6"
    column_widths: { A: 3, B: 34, C: 26, D: 3, E: 54 }

  - name: "Config"
    codename: "shConfig"
    visibility: "visible"
    role: "admin"
    purpose: "User-maintainable list masters and locked model constants. Owns no FX rates."
    show_gridlines: false
    title: "Config"
    subtitle: "List masters - user-maintainable lists and locked model constants"
    body: "contract"
    freeze_panes: "A6"
    column_widths: { A: 3, B: 34, C: 26, D: 3, E: 54 }

  - name: "Cost Lines"
    codename: "shCostLines"
    visibility: "visible"
    role: "input"
    purpose: "Base cost driver register. Uncertainty is entered at unit-cost level only."
    show_gridlines: false
    title: "Cost Lines"
    subtitle: "Base cost drivers - schema and validation are functional; no calculation is wired yet"
    body: "drivers"
    freeze_panes: "C12"
    column_widths: { A: 3 }

  - name: "Risk Register"
    codename: "shRiskRegister"
    visibility: "visible"
    role: "input"
    purpose: "Discrete risk driver register. Every risk entered is simulated; there is no Included field."
    show_gridlines: false
    title: "Risk Register"
    subtitle: "Risk drivers - schema and validation are functional; no occurrence logic is wired yet"
    body: "drivers"
    freeze_panes: "C12"
    column_widths: { A: 3 }

  - name: "Inflation"
    codename: "shInflation"
    visibility: "visible"
    role: "input"
    purpose: "Annual escalation rates by inflation profile."
    show_gridlines: false
    title: "Inflation"
    subtitle: "Annual escalation profiles - calendar-year columns are generated by Apply / Update Timeline"
    body: "structure"
    freeze_panes: null
    column_widths: { A: 3 }

  - name: "Cost Profiling"
    codename: "shCostProfiling"
    visibility: "visible"
    role: "input"
    purpose: "Annual percentage allocation of each cost line across project years."
    show_gridlines: false
    title: "Cost Profiling"
    subtitle: "Cost line annual allocation - project-year columns are generated by Apply / Update Timeline"
    body: "structure"
    freeze_panes: null
    column_widths: { A: 3 }

  - name: "Risk Profiling"
    codename: "shRiskProfiling"
    visibility: "visible"
    role: "input"
    purpose: "Annual percentage allocation of each risk across project years."
    show_gridlines: false
    title: "Risk Profiling"
    subtitle: "Risk annual allocation - project-year columns are generated by Apply / Update Timeline"
    body: "structure"
    freeze_panes: null
    column_widths: { A: 3 }

  - name: "Model Check"
    codename: "shModelCheck"
    visibility: "visible"
    role: "output"
    purpose: "Validation register and the gate that blocks simulation on ERROR."
    show_gridlines: false
    title: "Model Check"
    subtitle: "Validation register - the aggregate of what the model's own owners report"
    freeze_panes: "A6"
    # PHASE 9. The register is six columns wide, so this sheet no longer uses
    # the two-column label/value shape the placeholder had. B through G are the
    # register; the evaluation source below it runs on to O and is deliberately
    # left at the default width, which is also what keeps the header rule -
    # drawn across the declared columns - over the register and not over the
    # working columns behind it.
    column_widths: { A: 3, B: 24, C: 14, D: 12, E: 44, F: 72, G: 72 }
    # ONE AUTHOR. `body: model_check` names `phase9_shell.model_check` as the
    # layout authority for this sheet, and the loader refuses blocks beside a
    # body: a placeholder block next to a rendered surface would be two authors
    # writing into the same rows, and whichever ran last would win in silence.
    body: "model_check"

  - name: "Results"
    codename: "shResults"
    visibility: "visible"
    role: "output"
    purpose: "Full statistical output, cash flow and the analytical reconciliation bridge."
    show_gridlines: false
    title: "Results"
    subtitle: "Simulation results and statistical summary"
    freeze_panes: "A6"
    # G and H are Phase-8 Step-1 additions: the annual table is the first
    # four-column table on this sheet. F keeps its width - `_write_block` uses
    # column F as the note column across the workbook - and nothing that was
    # already here moves.
    column_widths: { A: 3, B: 34, C: 2, D: 26, E: 3, F: 46, G: 3, H: 26 }
    blocks:
      - type: note
        text: "Run identity, summary statistics and selected-confidence reporting are published by the simulation; the annual cash flow and the reconciliation below are read back from the stored annual result."
      - type: section
        title: "Run Stamp"
        note: "Reserved for model version, run id, timestamp, iterations, seed and applied timeline."
      - type: section
        title: "Summary Statistics"
        note: "Reserved for the percentile ladder, mean, standard deviation and dispersion."
      - type: section
        title: "Annual Cash Flow"
        note: "The selected-Px annual profile of the published run, nominal and PV."
      - type: section
        title: "Reconciliation"
        note: "The selected-Px annual profile against the reported selected-Px total."

  - name: "Sensitivity"
    codename: "shSensitivity"
    visibility: "visible"
    role: "output"
    purpose: "Driver ranking by Spearman rank correlation against total project cost."
    show_gridlines: false
    title: "Sensitivity"
    subtitle: "Drivers ranked by Spearman rank correlation against Total Nominal Project Cost"
    freeze_panes: "A6"
    column_widths: { A: 3, B: 34, C: 2, D: 26, E: 3, F: 46 }
    blocks:
      # PHASE 7. The placeholder note is gone because the contract behind this
      # sheet now exists: `sim_contract.yaml: sensitivity` owns the statistic,
      # the ranking and the state rules, and `sim_data.sensitivity_records`
      # owns where the numbers are persisted. The tornado CHART is Phase 8, and
      # so is any Top-N selection over this table.
      - type: note
        text: "Spearman measures monotone association with the total, not a share of its variance. Correlated uncertainty between drivers is out of scope."
      - type: section
        title: "Ranked Drivers"
        # THE FIELD LIST HAS ONE OWNER, AND IT IS NOT THIS FILE.
        # `sim_contract.yaml: sim_data.sensitivity_records.columns` declares the
        # eight columns and the loader locks them; restating them here as
        # structured keys would be a second source of truth, and this file's
        # block schema does not read such keys anyway - they would look
        # authoritative and govern nothing. The prose below names them, exactly
        # as it named the seven before, and STATUS is the eighth: without it a
        # zero-variance driver has nowhere to be reported except as a rho it
        # does not have.
        note: "Driver ID, type, name, Spearman rho, absolute rho, rank, direction and status. Ranked by absolute rho, descending. A driver whose contribution has no variance is reported as n/a - no variance and is not ranked."

  - name: "Methodology"
    codename: "shMethodology"
    visibility: "visible"
    role: "reference"
    purpose: "In-workbook documentation of the calculation methodology and assumptions."
    show_gridlines: false
    title: "Methodology"
    subtitle: "In-workbook documentation - written progressively as each phase lands"
    freeze_panes: "A6"
    column_widths: { A: 3, B: 34, C: 2, D: 26, E: 3, F: 62 }
    blocks:
      - type: section
        title: "Model Description"
        note: "PCCM is a probabilistic cost model for a single project. It combines deterministic cost estimating, three-point estimating and Monte Carlo simulation to produce a total project cost distribution and a defensible contingency at a stated confidence level."
      - type: section
        title: "Build Metadata"
        note: "Recorded at build time. None of these values is a computational input."
        metadata: true
      - type: section
        title: "Methodology Sections"
        note: "Reserved for escalation, FX, profiling, discounting, distributions, percentile method, contingency definitions, sensitivity method and stated limitations."

  - name: "_Calc"
    codename: "shCalc"
    visibility: "hidden"
    role: "technical"
    purpose: "Derived factor tables. Hidden but not very hidden, so an auditor can inspect it."
    show_gridlines: true
    title: "_Calc"
    subtitle: "Internal calculation workspace - holds the persistent permanent-ID counters"
    body: "structure"
    freeze_panes: null
    column_widths: { A: 3, B: 34, C: 16, D: 3, E: 62 }

  - name: "_SimData"
    codename: "shSimData"
    visibility: "veryHidden"
    role: "technical"
    purpose: "Raw iteration output. Machine data with no audit value in raw form."
    show_gridlines: true
    title: "_SimData"
    subtitle: "Internal simulation workspace"
    freeze_panes: null
    column_widths: { A: 3, B: 34, C: 2, D: 26 }
    blocks:
      - type: note
        text: "Not implemented yet. Internal workspace; intentionally empty."
