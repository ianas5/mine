# =============================================================================
# PCCM SIMULATION CONTRACT - the sixth authority.
#
# Owns the SIMULATION EXECUTION SEMANTICS settled by Phase-6 Step 0: the RNG and
# its versions, seeding execution, the AUTO nonce lifecycle, component streams
# and their assignment, jump-ahead, distribution sampling including the exact
# Cheng formulation, Risk occurrence and severity semantics, the simulation
# request identity, the result digest, iteration rules, statistics, contingency,
# simulation state, run identity, the Phase-5 prerequisite, and the future
# `_SimData` machine layout from which the technical storage ceiling follows.
#
# WHAT IS DELIBERATELY ABSENT, and why:
#
#   * the admissible Random Seed DOMAIN. D6-19 closed on input-contract
#     ownership: `input_contract.yaml` owns `random_seed` and its admissibility.
#     This file REFERENCES that authority in `authority_references` and stores no
#     copy of the range. The loader FAILS if a seed minimum or maximum appears
#     here, because two files holding one rule is the drift this architecture
#     exists to prevent.
#   * the Monte Carlo business minimum (>= 1000). Also owned by
#     `input_contract.yaml`. This file owns only the TECHNICAL storage ceiling,
#     which is a different category and must never be presented as validation.
#   * every ORACLE COMPARISON TOLERANCE. Settled in Step 0 section 10 as an
#     evidence policy, not a runtime contract: the engine performs no approximate
#     comparison at run time - replay comparison is by `result_digest`, which is
#     exact. The loader FAILS if a tolerance appears here.
#   * the fingerprint hash mathematics. Defined once, in
#     `builder/pccm_builder/calc_fingerprint.py`. Only version numbers live here.
#   * any executable algorithm. This file states WHAT must hold. Step 2 onward
#     implements it.
#
# Scope: Phase 6, Step 1. Contract only. No RNG implementation, no sampler, no
# Monte Carlo, no VBA, no emission, no workbook change.
# =============================================================================

sim_contract_version: "1.0.0"

# -----------------------------------------------------------------------------
# Versions - Step-0 section 9.
#
# FP_VERSION is INHERITED from calc_contract.yaml and is not restated here as a
# value; it appears in `authority_references` as a boundary. RNG_VERSION and
# SIM_METHOD_VERSION are new and owned here.
#
# The `PCCM-RD` version field IS SIM_METHOD_VERSION. There is no third version:
# the digest exists to compare runs, and two runs are comparable exactly when the
# method that produced the numbers is the same.
# -----------------------------------------------------------------------------
versions:
  rng_version: 1
  sim_method_version: 1
  result_digest_version_source: "sim_method_version"

  # Every rule that can change a retained output or a stream identity is owned by
  # exactly one version. A rule that can change either and is owned by neither is
  # the defect this table exists to prevent.
  bump_ownership:
    rng_version:
      - "mrg32k3a_constants_or_uniform_combination"
      - "scalar_seed_to_state_mapping"
      - "auto_seed_nonce_mapping"
      - "component_stream_assignment"
      - "jump_matrices_exponent_or_arithmetic_semantics"
    sim_method_version:
      - "cheng_formulation_literals_or_expression_order"
      - "risk_severity_invocation_semantics"
      - "degenerate_sampling_rule"
      - "canonical_accumulation_order"
      - "percentile_or_statistical_method"
      - "result_digest_framing_or_hash_stream"

# -----------------------------------------------------------------------------
# The random number generator - MRG32k3a.
#
# `Rnd` and `Randomize` are forbidden constructs and appear nowhere in PCCM.
# -----------------------------------------------------------------------------
rng:
  family: "MRG32k3a"
  constants:
    m1: 4294967087
    m2: 4294944443
    a12: 1403580
    a13n: 810728
    a21: 527612
    a23n: 1370589
    # Identical Double to 1.0 / (m1 + 1); both are 0x1.000000d00000bp-32.
    norm: 2.328306549295727688e-10

  # The state PCCM stores and exposes, oldest-first. The jump matrices operate on
  # NEWEST-FIRST triples, so each triple is reversed at the matrix boundary and
  # reversed back afterwards. Getting that wrong produces a plausible but wrong
  # stream, which is why the orientation is contract text rather than a comment.
  state:
    words: 6
    order: ["s10", "s11", "s12", "s20", "s21", "s22"]
    orientation: "oldest_first"
    matrix_operand_orientation: "newest_first"
    reversal_required_at_matrix_boundary: true

  recurrence:
    p1: "(a12 * s11 - a13n * s10) mod m1"
    p2: "(a21 * s22 - a23n * s20) mod m2"
    advance: "[s10, s11, s12, s20, s21, s22] <- [s11, s12, p1, s21, s22, p2]"

  combination:
    rule: "if p1 <= p2 then u = (p1 - p2 + m1) * norm else u = (p1 - p2) * norm"
    comparison_operator: "less_than_or_equal"

  output_domain:
    lower: 0
    upper: 1
    lower_inclusive: false
    upper_inclusive: false

  # MATHEMATICAL semantics above; IMPLEMENTATION obligation here. The two are
  # separated deliberately: `mod` above is exact modular arithmetic, and a later
  # implementation must realise it on an exact arithmetic path rather than a
  # naive floating one. No such path is implemented in Step 1.
  arithmetic:
    modulo_semantics: "exact_non_negative_residue"
    implementation_requirement: "exact_safe_double_path"
    naive_floating_modulo_permitted: false

# -----------------------------------------------------------------------------
# Seeding execution semantics.
#
# The admissible FIXED domain is NOT here. See `authority_references`.
# -----------------------------------------------------------------------------
seeding:
  modes: ["AUTO", "FIXED"]
  blank_input_means: "AUTO"
  populated_input_means: "FIXED"

  # D6-05 (a). Every admissible seed is a valid residue in both components,
  # because seed_max < m2 < m1 and the minimum admissible seed is 1.
  scalar_to_state:
    rule: "repeated_scalar"
    expansion: "[seed, seed, seed, seed, seed, seed]"
    mixer: null
    alternate_expansion_permitted: false

  # D6-03 (b). The authority is a modular POWER. Stating it as a power is what
  # tells an implementation that an exact O(log nonce) method is required; O(nonce)
  # stepped multiplication is not the authority and is not acceptable.
  auto:
    modulus: 2147483647
    multiplier: 48271
    mapping: "effective_seed = multiplier ^ auto_nonce mod modulus"
    mapping_kind: "modular_exponentiation"
    implementation_complexity_requirement: "O(log nonce)"
    stepped_multiplication_is_the_authority: false
    period: 2147483646
    freshness_scope: "single_workbook_persisted_nonce_history"
    cross_workbook_uniqueness_claimed: false
    timestamp_derived_uniqueness_permitted: false

  # The lifecycle is authoritative because it is what makes an allocated seed
  # CONSUMED on failure. Any other order silently hands a retry the same sequence.
  nonce_lifecycle:
    meaning: "next_nonce_to_allocate"
    initial: 0
    first_valid_allocation: 0
    last_valid_allocation: 2147483645
    exhausted_value: 2147483646
    on_exhaustion: "REFUSE"
    wrap_permitted: false
    reuse_permitted: false
    order:
      - "validate_pre_allocation_prerequisites"
      - "read_current_auto_nonce"
      - "derive_effective_seed"
      - "persist_auto_nonce_plus_one"
      - "begin_sampling"
    failure_before_allocation_consumes_nonce: false
    failure_after_allocation_consumes_nonce: true
    prior_successful_publication_untouched: true

    # ------------------------------------------------------------------
    # THE THREE ALLOCATION STATES.
    #
    # Step 0 modelled allocation as binary - before / after - which is true of
    # the intent but not of a fallible COM substrate. A `Range.Value2` that
    # RAISES is not proof that Excel wrote nothing, so "did the advance
    # persist?" has a third answer: unknown. The binary model forced that third
    # answer to be mislabelled as one of the other two, and a run-local flag
    # cannot carry it across invocations.
    #
    # `reuse_permitted: false` above continues to refer to a nonce that is
    # KNOWN CONSUMED. A nonce whose advance is known NOT to have persisted was
    # never allocated, no sampling drew from it, and attempting it again is not
    # reuse.
    # ------------------------------------------------------------------
    allocation_states: ["PRE_ALLOCATION", "CONSUMED", "PERSISTENCE_INDETERMINATE"]

    allocation_state_semantics:
      PRE_ALLOCATION:
        advance_persisted: false
        nonce_consumed: false
        sampling_began: false
        retry_may_reuse_the_same_nonce: true
      CONSUMED:
        advance_persisted: true
        nonce_consumed: true
        sampling_may_begin: true
        retry_may_reuse_the_same_nonce: false
      PERSISTENCE_INDETERMINATE:
        advance_persisted: "unknown"
        nonce_consumed: "unknown"
        sampling_began: false
        must_not_be_called_allocated: true
        must_not_be_called_unconsumed: true
        audit_attempt_result: "AUTO_NONCE_INDETERMINATE"
        audit_result_is_the_recovery_authority: false
        durable_recovery_authority: "pending_auto_nonce"
        next_run_must_reconcile_before_allocating: true

    # WRITE-AHEAD. The counter write must not begin until the pending marker is
    # durably established, so no outcome of the marker write can lose a nonce:
    # if it did not land the next run sees blank and counter m; if it did land
    # the next run sees pending m and counter m, and resolves PRE_ALLOCATION.
    #
    # `order` above remains the Step-0 coarse intent. This is the settled
    # executable sequence that REFINES it: every nonce step of `order` survives,
    # in the same relative order, with the marker and its cleanup interleaved.
    # Stating that relationship as a CHECKABLE property - the loader proves the
    # subsequence - is what stops the coarse sequence from quietly becoming a
    # stale second authority.
    write_ahead_order_refines: "order"
    write_ahead_order_refinement_drops_prefix: "validate_pre_allocation_prerequisites"
    write_ahead_order:
      - "read_current_auto_nonce"
      - "derive_effective_seed"
      - "establish_and_verify_pending_auto_nonce"
      - "persist_auto_nonce_plus_one"
      - "reconcile_and_clear_pending"
      - "begin_sampling"

    # ONE bounded observation after an infrastructure failure. No retry loop,
    # no decrement, and no forward skip taken merely to make uncertainty go
    # away. `m` is the candidate nonce; the advance writes `m + 1`.
    #
    # A raised verification READ is a verification-read failure: `Range.Value2`
    # is a COM call on the way in as well as on the way out, so it takes the
    # same single bounded observation as a raised write.
    immediate_reconciliation:
      attempts: 1
      after: ["counter_write_raised", "verification_read_failed",
              "verification_read_raised"]
      observed_m_plus_1: "CONSUMED"
      observed_m: "PRE_ALLOCATION"
      observed_other: "RECOVERY_REQUIRED"
      observation_unavailable: "PERSISTENCE_INDETERMINATE"

    # Activated by the DURABLE SIDECAR, never by the attempt row. The attempt
    # row records the last attempt and is rewritten by any later attempt -
    # including a FIXED one unrelated to the pending AUTO transaction - so it
    # cannot carry a lock that must outlive it.
    next_run_reconciliation:
      activated_by_pending_auto_nonce_cell: true
      activated_by_attempt_result: false
      activated_by_generic_unsuccessful_result: false
      # Settled tokens, not prose: `m+1` resolves the prior advance as having
      # persisted, so allocation continues from the counter; `m` resolves it as
      # never persisted, so `m` itself may be allocated - it was never consumed.
      counter_equals_m_plus_1: "CONSUMED"
      counter_equals_m: "PRE_ALLOCATION"
      counter_is_neither: "RECOVERY_REQUIRED"
      counter_unreadable: "RECOVERY_REQUIRED"
      applies_to_fixed_mode: false

    # A FIXED run touches NOTHING in the AUTO transaction. It may proceed while
    # a pending marker stands, and its own attempt metadata may legitimately
    # replace a prior AUTO attempt's - which is safe only because the recovery
    # authority is the sidecar and not that row. This is the decisive reason
    # the sidecar exists.
    fixed_mode:
      reads_pending_auto_nonce: false
      writes_pending_auto_nonce: false
      clears_pending_auto_nonce: false
      reads_next_auto_nonce: false
      writes_next_auto_nonce: false
      executes_after_nonce_failpoint: false
      may_proceed_while_pending_marker_exists: true
      may_overwrite_prior_auto_attempt_metadata: true

    # The fifth Phase-6 attempt-result token, scoped. It records that THIS
    # attempt met an AUTO nonce persistence outcome it could not classify, and
    # nothing more. A later attempt may overwrite it; the sidecar survives.
    attempt_result_token:
      token: "AUTO_NONCE_INDETERMINATE"
      audit_only: true
      is_the_durable_recovery_authority: false
      may_be_overwritten_by_a_later_attempt: true
      # TIED TO ONE AXIS. The token means exactly "this attempt's counter
      # transition could not be classified", which is the
      # PERSISTENCE_INDETERMINATE allocation state and nothing else. A recovery
      # ACTION layered on top of a known CONSUMED or PRE_ALLOCATION observation
      # must not turn that known physical state into the indeterminate token,
      # and a refusal taken while reconciling a PRIOR marker - before this run
      # selects an identity - never began a transition to be indeterminate about.
      recorded_for: ["PERSISTENCE_INDETERMINATE"]
      recorded_for_recovery_action: false
      other_unsuccessful_outcomes_record: "REFUSED"
      phase5_axis_unchanged: true

    # ------------------------------------------------------------------
    # THE RECOVERY AXIS, SEPARATE FROM THE ALLOCATION AXIS.
    #
    # RECOVERY_REQUIRED is an ACTION: the workbook must be reconciled before
    # any further AUTO allocation. It is NOT a physical classification of a
    # counter transition, so it is not a member of allocation_states and no
    # physical fact may be derived from it.
    #
    # The rule that makes this load-bearing: a recovery or cleanup problem must
    # never erase an allocation fact that was already established. If the
    # counter was observed at m+1 the nonce IS consumed, and a later failure to
    # clear the sidecar cannot un-prove that.
    # ------------------------------------------------------------------
    recovery_action:
      token: "RECOVERY_REQUIRED"
      is_an_allocation_state: false
      derives_physical_consumption: false
      may_revise_allocation_state: false
      carried_separately_from_allocation_state: true
      raised_by:
        - "prior_pending_marker_unreadable"
        - "prior_counter_unreadable"
        - "prior_counter_is_neither_m_nor_m_plus_1"
        - "prior_marker_clear_failed"
        - "current_marker_clear_failed"
        - "current_counter_is_neither_m_nor_m_plus_1"
      allocation_state_when_raised_before_identity_selection: "NOT_APPLICABLE"
      allocation_state_when_raised_by_cleanup: "unchanged"
      permits_sampling: false

    # Clearing is a COM write like any other, so a raised clear is NOT proof the
    # marker survived. Both physical outcomes are safe for the NEXT run - a
    # surviving marker only costs one more reconciliation - but THIS run must
    # not sample while its own transaction cleanup is unresolved, and it must
    # not roll the counter back to tidy up.
    pending_clear:
      is_a_real_com_write: true
      raised_clear_proves_marker_remains: false
      unresolved_cleanup_permits_sampling: false
      counter_rollback_on_clear_failure: false

    # The attempt row keeps different facts in different states. Row 27 must
    # never assert physical consumption merely because it holds the number.
    attempt_metadata_preserves:
      known_consumed: ["consumed_auto_nonce", "effective_seed"]
      pre_allocation: ["attempted_auto_nonce", "effective_seed"]
      persistence_indeterminate:
        - "attempted_auto_nonce"
        - "effective_seed"
        - "durable_indeterminate_result"

    # THE RESIDUAL, REWRITTEN. It used to say that indeterminate persistence
    # plus a failed attempt-row write lost the reconciliation authority. That
    # was true only while the attempt row WAS the authority. The pending sidecar
    # is established BEFORE the counter write and is independent of the attempt
    # block, so reuse prevention no longer depends on the attempt row storing
    # anything: a failed attempt write loses the audit line, not safety.
    indeterminate_marker_storage_failure:
      reuse_prevention_depends_on_attempt_row: false
      reuse_prevention_depends_on_pending_cell: true
      attempt_row_failure_loses_audit_line_only: true
      second_write_ahead_log_required: false

# -----------------------------------------------------------------------------
# Component streams - D6-16.
# -----------------------------------------------------------------------------
components:
  kinds:
    - key: "COST_SAMPLE"
      driver_kind: "cost_line"
      per_driver: 1
      role: "value"
    - key: "RISK_OCCURRENCE"
      driver_kind: "risk"
      per_driver: 1
      role: "occurrence"
    - key: "RISK_SEVERITY"
      driver_kind: "risk"
      per_driver: 1
      role: "severity"
  count_rule: "cost_line_count + 2 * risk_count"

stream_assignment:
  policy: "canonical_sorted_order"
  sort_keys: ["component_kind", "permanent_id", "role"]
  permanent_id_comparison: "ordinal_utf16_code_units"
  physical_row_order_permitted: false
  locale_order_permitted: false
  case_insensitive_order_permitted: false
  numeric_suffix_interpretation_permitted: false
  index_origin: 0
  index_rule: "stream k is the base state advanced by k canonical stream jumps"

  # PRESERVED, not hidden. Adding or removing a driver changes the canonical
  # order, so later components move to different streams and their samples change.
  # Adding a driver changes the model, so the run is a new run - but a user may
  # expect an unrelated driver's numbers to hold still, and they will not.
  accepted_consequence: "inserting_or_removing_a_driver_may_change_later_stream_identities"

# -----------------------------------------------------------------------------
# Jump-ahead. Exact Step-0 authority.
# -----------------------------------------------------------------------------
jump:
  stream_spacing_exponent: 127
  substream_spacing_exponent: null
  substreams_used_in_phase_6: false
  decomposition: "mult_mod_m"
  decomposition_h: 131072
  naive_floating_matrix_product_permitted: false
  a1_p127:
    - [1230515664, 986791581, 1988835001]
    - [3580155704, 1230515664, 226153695]
    - [949770784, 3580155704, 2427906178]
  a2_p127:
    - [2093834863, 32183930, 2824425944]
    - [1022607788, 1464411153, 32183930]
    - [1610723613, 277697599, 1464411153]
  # SHA-256 of the canonical matrix text retained in the accepted Step-0
  # evidence. Present so silent drift between contract and evidence is
  # detectable rather than a matter of reading nine numbers by eye.
  a1_p127_sha256: "e31a727398a2d4461cf708f77034b9bc5e60f88c54556c56c3f4b015a813b66a"
  a2_p127_sha256: "0d20b47aa206b1231c22e20afaa84e71b81cff52a2395be9aeb0bbb97b1e8208"

# -----------------------------------------------------------------------------
# Distributions. Exactly three families; no fourth may be added here.
#
# Negative values remain legal when correctly ordered. No positivity rule exists.
# -----------------------------------------------------------------------------
distributions:
  families: ["Uniform", "Triangular", "Beta-PERT"]

  # Plan section 4.0, uniform across all three families. Detected BEFORE dispatch
  # and BEFORE parameterisation, so Beta's r = (m-a)/(b-a) is never formed and
  # 0/0 cannot arise.
  degenerate:
    # FAMILY-SPECIFIC, and it has to be. The previous common predicate
    # `a == m == b` made a degenerate Uniform depend on Most Likely, which
    # accepted Phase-5 D1 IGNORES numerically and excludes from the calculation
    # fingerprint. A Uniform with Min = Max and a populated, unrelated Most
    # Likely was therefore treated as non-degenerate: it would enter the sampler
    # and consume a uniform, so an ignored input silently changed RNG
    # consumption and every subsequent draw on that stream.
    #
    # For Triangular and Beta-PERT the accepted ordering a <= m <= b already
    # makes a == b imply m == a, so the explicit three-way condition is a
    # statement of the semantic rather than an extra restriction.
    conditions:
      uniform: "a == b"
      triangular: "a == m == b"
      beta_pert: "a == m == b"
    most_likely_read_by_uniform_degeneracy: false
    detected_before_dispatch: true
    detected_before_parameterisation: true
    returns: "a"
    uniforms_consumed: 0
    sampler_entered: false
    stream_state_changed: false
    applies_to_all_families: true

  uniform:
    # Not read numerically, not read for degeneracy, and not in the calculation
    # fingerprint. Phase-5 D1, inherited unchanged.
    most_likely_used: false
    most_likely_affects_degeneracy: false
    most_likely_affects_uniform_consumption: false
    transform: "x = (1 - u) * a + u * b"
    formulation: "stable_convex"
    uniforms_per_non_degenerate_sample: 1

  triangular:
    method: "inverse_cdf"
    uniforms_per_non_degenerate_sample: 1
    branch_point: "c = (m - a) / (b - a)"
    lower_branch: "u <= c : x = a + sqrt(u * (b - a) * (m - a))"
    upper_branch: "u >  c : x = b - sqrt((1 - u) * (b - a) * (b - m))"
    boundary_cases:
      m_equals_a: "c = 0; the upper branch is always taken"
      m_equals_b: "c = 1; the lower branch is always taken"
    rng_endpoints_open: true
    normalised_formulation_required: true
    conditioning_scale: "s = max(abs(a), abs(m), abs(b))"

  beta_pert:
    lambda: 4
    shape_ratio: "r = (m - a) / (b - a)"
    alpha: "1 + 4 * r"
    beta: "1 + 4 * (1 - r)"
    alpha_plus_beta: 6
    shape_lower: 1
    shape_upper: 5
    rescale: "x = (1 - y) * a + y * b, y ~ Beta(alpha, beta)"
    rescale_formulation: "stable_convex"
    normalised_formulation_required: true
    conditioning_scale: "s = max(abs(a), abs(m), abs(b))"
    dispatch:
      rule: "min(alpha, beta) > 1 -> BB; otherwise BC"
      comparison_operator: "strictly_greater_than"
      equality_belongs_to: "BC"

# -----------------------------------------------------------------------------
# The EXACT Cheng formulation - Step-0 section 5.2a.
#
# "Cheng 1978" is a citation, not a contract: recognised implementations differ
# in their literals and in the logit form, and those choices change results. One
# formulation is locked here. It belongs to SIM_METHOD_VERSION.
#
# EVERY literal below is a LITERAL. 1.3862944 is those eight digits and is NOT
# evaluated as log(4); 2.609438 is not evaluated as 1 + log(5); 0.0138889,
# 0.0416667 and 0.777778 are not evaluated as 1/72, 3/72 and 7/9.
# -----------------------------------------------------------------------------
cheng:
  uniforms_per_non_degenerate_proposal_attempt: 2

  logit_form: "log(u1 / (1.0 - u1))"
  logit_form_rejected_alternative: "log(u1) - log1p(-u1)"

  literals_are_literal: true
  algebraic_simplification_permitted: false

  bb:
    applies_when: "min(alpha, beta) > 1"
    orientation:
      a: "min(alpha0, beta0)"
      b: "max(alpha0, beta0)"
    per_driver:
      - "alpha = a + b"
      - "beta = sqrt((alpha - 2) / (2 * a * b - alpha))"
      - "gamma = a + 1 / beta"
    per_attempt:
      - "u1 = next_u(); u2 = next_u()"
      - "vlog = log(u1 / (1 - u1))"
      - "v = beta * vlog"
      - "w = a * exp(v)"
      - "z = u1 * u1 * u2"
      - "rr = gamma * v - 1.3862944"
      - "s = a + rr - w"
      - "accept if s + 2.609438 >= 5.0 * z"
      - "else t = log(z); accept if s >= t"
      - "else accept if rr + alpha * log(alpha / (b + w)) >= t"
      - "else reject and retry"
    literals: ["1.3862944", "2.609438", "5.0", "2.0", "1.0"]
    acceptance_operator: "greater_than_or_equal"
    return: "w / (b + w) when the caller's first parameter was the min, else b / (b + w)"

  bc:
    applies_when: "min(alpha, beta) <= 1"
    # The OPPOSITE of BB. Inverting it is a silent defect that returns a valid
    # Beta variate of the MIRRORED distribution.
    orientation:
      a: "max(alpha0, beta0)"
      b: "min(alpha0, beta0)"
    per_driver:
      - "alpha = a + b"
      - "beta = 1 / b"
      - "delta = 1 + a - b"
      - "k1 = delta * (0.0138889 + 0.0416667 * b) / (a * beta - 0.777778)"
      - "k2 = 0.25 + (0.5 + 0.25 / delta) * b"
    per_attempt:
      - "u1 = next_u(); u2 = next_u()"
      - "if u1 < 0.5: y = u1 * u2; z = u1 * y; reject if 0.25 * u2 + z - y >= k1"
      - "else: z = u1 * u1 * u2"
      - "  if z <= 0.25: vlog = log(u1 / (1 - u1)); v = beta * vlog; w = a * exp(v); ACCEPT"
      - "  if z >= k2: reject"
      - "vlog = log(u1 / (1 - u1)); v = beta * vlog; w = a * exp(v)"
      - "accept if alpha * (log(alpha / (b + w)) + v) - 1.3862944 >= log(z)"
      - "else reject and retry"
    literals: ["0.0138889", "0.0416667", "0.777778", "1.3862944", "0.25", "0.5"]
    acceptance_operator: "greater_than_or_equal"
    return: "w / (b + w) when the caller's first parameter was the max, else b / (b + w)"

  # MEASURED in Step 0, not assumed: the squeeze literals never change the value
  # of an accepted proposal - they change WHICH proposals are accepted, and
  # therefore consumption and every draw after it. The logit form changes the
  # value itself. Both are locked, for different reasons.
  literal_effect:
    squeeze_literals_affect: "acceptance_decision_only"
    logit_form_affects: "returned_sample_value"

  # Binding to the accepted Step-0 evidence, so silent drift is detectable.
  # This is provenance, NOT a runtime dependency: no production code may import
  # the evidence directory. Tests read it; the engine never does.
  source_binding:
    evidence_file: "evidence/phase6_step0/raw/cheng_formulation.json"
    functions_sha256: "d5ca71b806015ed9039f713295dca3b45d2f66dbcabe60b6709896e3a89eed90"
  conformance_vectors:
    evidence_file: "evidence/phase6_step0/vectors/cheng_vectors.json"
    role: "conformance_authority"
    runtime_lookup_table: false

# -----------------------------------------------------------------------------
# Risk semantics - D6-18 (b), as corrected in Step-0 section 6.1.
#
# The withdrawn phrase "the severity stream advances once per iteration" is FALSE
# for a degenerate severity and must not appear. Invocation is unconditional;
# CONSUMPTION is a property of the distribution.
# -----------------------------------------------------------------------------
risk:
  occurrence:
    uniforms_per_risk_per_iteration: 1
    rule: "occurred = u_occurrence < probability"
    comparison_operator: "strictly_less_than"
    probability_zero_never_occurs: true
    probability_one_always_occurs: true

  severity:
    invocation_policy: "unconditional"
    sampler_invoked_every_risk_iteration: true
    non_degenerate_consumption: "as_the_selected_sampler_contract_requires"
    degenerate_consumption: 0
    degenerate_stream_state_changed: false
    value_used_only_when_occurred: true

  probability_folded_into_knom: false
  probability_folded_into_kpv: false

# -----------------------------------------------------------------------------
# Canonical driver evaluation and accumulation order.
#
# Belongs to SIM_METHOD_VERSION: changing it changes retained totals.
# -----------------------------------------------------------------------------
accumulation:
  driver_kind_order: ["cost_line", "risk"]
  within_kind_order: "ascending_permanent_id"
  permanent_id_comparison: "ordinal_utf16_code_units"
  physical_row_order_permitted: false
  accumulators: ["nominal", "pv"]
  accumulators_share_driver_order: true

# -----------------------------------------------------------------------------
# What a driver actually CONTRIBUTES to one iteration.
#
# Without this, a future engine could satisfy every other section and still
# implement the most important arithmetic wrongly. The rules are inherited from
# the accepted Phase-5 analytical semantics; Phase 6 replaces the deterministic
# central value with a sampled one and changes nothing else.
# -----------------------------------------------------------------------------
contribution:
  cost_line:
    # The sample is UNIT COST uncertainty. Quantity is deterministic and sits
    # OUTSIDE the distribution, so total-cost uncertainty is never sampled
    # directly.
    sampled_quantity: "unit_cost"
    sampled_from: "distribution(Min, MostLikely, Max)"
    total_cost_uncertainty_sampled: false
    quantity_is_deterministic: true
    quantity_inside_distribution: false
    quantity_applications: 1
    probability_applies: false
    nominal: "unit_cost * Quantity * Knom"
    pv: "unit_cost * Quantity * Kpv"

  risk:
    # No Quantity. A Risk's severity IS its money amount.
    occurred: "occurrence_uniform < Probability"
    severity_source: "severity_sampler_under_d6_18b"
    quantity_applies: false
    probability_folded_into_k_factors: false
    occurrence_and_severity_share_a_stream: false
    nominal_when_occurred: "severity * Knom"
    pv_when_occurred: "severity * Kpv"
    nominal_when_not_occurred: 0
    pv_when_not_occurred: 0

  # PV is an INDEPENDENT contribution computed with Kpv, never a post-hoc
  # discount applied to the nominal total.
  pv_derived_from_nominal: false

  iteration_total:
    rule: "canonical sum of every Cost Line contribution, then every Risk contribution"
    order_source: "accumulation"
    measures_independent: true

# -----------------------------------------------------------------------------
# The hot-kernel execution boundary - INHERITED, and locked here.
#
# The accepted plan's central performance invariant. It is semantic authority,
# not an implementation note: an engine that touches a worksheet inside the loop
# is wrong even if its numbers are right.
# -----------------------------------------------------------------------------
kernel:
  inputs_resolved_once_before_simulation: true
  operates_on_resolved_in_memory_structures: true
  worksheet_access_inside_iteration_loop: false
  range_access_inside_iteration_loop: false
  listobject_access_inside_iteration_loop: false
  application_object_access_inside_iteration_loop: false
  thisworkbook_or_activeworkbook_access_inside_iteration_loop: false
  com_round_trip_inside_iteration_loop: false
  resolved_before_loop:
    - "knom_per_driver"
    - "kpv_per_driver"
    - "quantities"
    - "probabilities"
    - "distribution_parameters"
    - "component_stream_initial_states"
  recomputes_worksheet_inflation_inside_loop: false
  recomputes_worksheet_fx_inside_loop: false
  recomputes_worksheet_profiles_inside_loop: false

# -----------------------------------------------------------------------------
# The numerical domain - plan section 4.6, encoded in full.
#
# Phase 5 accepted ANY finite, correctly ordered triple, including negatives and
# supports crossing zero, and built overflow-safe primitives rather than
# narrowing the domain. Phase 6 may not silently narrow it.
# -----------------------------------------------------------------------------
numerical_domain:
  negative_values_legal: true
  supports_crossing_zero_legal: true
  positivity_rule: null
  magnitude_restriction: null
  narrower_than_phase5: false

  # The rule that makes "overflow-safe" mean something: a representable, valid
  # result must not be refused merely because a NAIVE intermediate would overflow.
  representable_result_refused_for_naive_intermediate_overflow: false
  refusal_when_no_valid_double_result: "explicit_and_names_the_numerical_stage"
  silent_non_finite_result_permitted: false

  disciplines:
    driver_contribution: "accepted_safe_product"
    accumulation: "accepted_safe_signed_sum"
    percentile_interpolation: "convex"
    contingency_subtraction: "accepted_safe_subtract"
    statistics: "scale_safe"

# -----------------------------------------------------------------------------
# Driver dependence.
#
# The component-stream architecture makes independence achievable; it does not
# STATE it, and an unstated invariant is one a later phase can quietly break.
# -----------------------------------------------------------------------------
dependence:
  inter_driver_dependence: "independent"
  correlation_matrix_supported: false
  copula_supported: false
  shared_or_hidden_dependence_permitted: false
  authority: "no inter-driver correlation authority exists in the repository"

# -----------------------------------------------------------------------------
# Publication and the Phase-6 command surface.
# -----------------------------------------------------------------------------
publication:
  persisted_source_of_truth: "_SimData"
  results_derives_from: "_SimData"
  results_recomputes_monte_carlo: false
  publish_only_after_simulation_and_statistics_complete: true
  commit_last: true
  partial_new_distribution_published_on_refusal_or_failure: false
  prior_successful_publication_survives: true

  # TWO BANKS, ONE ACTIVE.
  #
  # `prior_successful_publication_survives` was aspirational until this closure.
  # Writing a new distribution over the published rows and only then stamping the
  # Run ID cannot survive a COM failure half way through a million rows, and no
  # rollback of a million rows is a transaction anybody should attempt.
  #
  # So a candidate success is written ENTIRELY into the INACTIVE bank, verified
  # there, and published by one small final write that moves `active_bank`. A
  # failure at any earlier point leaves the active bank physically untouched and
  # the corrupted candidate with no semantic standing at all.
  #
  # THE SECOND BANK CONSUMES COLUMNS, NEVER ROWS: the row axis, the reserved-row
  # count and the technical iteration ceiling are exactly what they were.
  banks:
    labels: ["A", "B"]
    count: 2
    third_bank_permitted: false
    initial_active_bank: null
    candidate_target:
      "": "A"
      "A": "B"
      "B": "A"
    candidate_writes_to_active_bank: false
    inactive_bank_is_published: false
    inactive_bank_is_staging_storage: true
    temporary_worksheet_required: false
    duplicate_workbook_required: false
    row_axis_shared_by_both_banks: true

  # The order is the authority, not a suggestion. Everything numerical is
  # complete in memory before any candidate cell is written, and the active-bank
  # switch is the LAST thing that happens.
  transaction:
    order:
      - "prepare_phase5_inputs_and_require_current"
      - "validate_pre_allocation_prerequisites"
      - "allocate_auto_nonce_when_auto"
      - "run_simulation_and_statistics_in_memory"
      - "build_request_fingerprint_and_result_digest_in_memory"
      - "choose_inactive_bank"
      - "write_candidate_snapshot_to_inactive_bank"
      - "write_candidate_summary_to_inactive_bank"
      - "write_candidate_contingency_to_inactive_bank"
      - "write_candidate_iterations_to_inactive_bank"
      - "verify_inactive_bank_against_staged_package"
      - "final_commit_shared_block_including_active_bank"
    final_commit_range: "D22:D30"
    final_commit_is_one_write: true
    final_commit_fields:
      - "last_run_id"
      - "last_attempt_result"
      - "last_attempt_detail"
      - "last_attempt_seed_mode"
      - "last_attempt_effective_seed"
      - "last_attempt_auto_nonce"
      - "simulation_status"
      - "status_evaluated_at"
      - "active_bank"
    prior_final_commit_block_captured_before_write: true
    final_commit_failure_restores_prior_block: true
    million_row_rollback_required: false
    results_is_a_written_transaction: false

  # Run ID is ALLOCATED by the successful commit and by nothing else. The
  # candidate value is `last_run_id + 1`, held locally until then, so a refused
  # or failed attempt burns no identity.
  run_id_allocation:
    candidate_value: "last_run_id + 1"
    held_locally_until_commit: true
    allocated_by: "successful_final_commit"
    headroom_checked_before_auto_allocation: true

  # WHAT SURVIVES WHAT.
  failure_semantics:
    refusal_before_auto_allocation:
      next_auto_nonce_advanced: false
      active_bank_changed: false
      successful_banks_changed: false
      attempt_metadata_updated: true
    refusal_or_failure_after_auto_allocation:
      next_auto_nonce_advanced: true
      active_bank_changed: false
      successful_banks_changed: false
      attempt_metadata_updated: true
    inactive_bank_write_failure:
      active_bank_changed: false
      prior_publication_remains_authoritative: true
      corrupted_candidate_has_semantic_standing: false
    final_commit_failure:
      prior_block_restored: true
      active_bank_changed: false

command_surface:
  automation_endpoint: "PCCM_RunSimulation"
  user_facing_run_button_in_phase_6: false
  msgbox_introduced_by_phase_6: false
  userform_introduced_by_phase_6: false
  ribbon_introduced_by_phase_6: false
  # SETTLED at Step 11A, before the reporting module exists, so the
  # implementation cannot invent a name. This list is EXACT: a `PCCM_` procedure
  # Phase 6 introduces and that is not named here is an unauthorised endpoint.
  read_accessor_names_settled: true
  read_accessors:
    - "PCCM_SimulationStatus"
    - "PCCM_SimulationRequestFingerprint"
    - "PCCM_CurrentSimulationRequestFingerprint"
    - "PCCM_SimulationResultDigest"
    - "PCCM_SimulationAttemptResult"
    - "PCCM_SimulationAttemptDetail"
  read_accessor_semantics:
    PCCM_SimulationStatus: "the derived status; writes only simulation_status and status_evaluated_at"
    PCCM_SimulationRequestFingerprint: "the stored request fingerprint of the ACTIVE bank, blank when no bank is active"
    PCCM_CurrentSimulationRequestFingerprint: "the request fingerprint recomputed through the SAME preparation path the run uses, blank when the current prerequisites refuse"
    PCCM_SimulationResultDigest: "the stored result digest of the ACTIVE bank, blank when no bank is active"
    PCCM_SimulationAttemptResult: "the shared last attempt result"
    PCCM_SimulationAttemptDetail: "the shared last attempt detail"
  run_id_public_accessor_required_in_phase_6: false
  effective_seed_public_accessor_required_in_phase_6: false

interruption:
  user_cancellation_supported_in_phase_6: false

# -----------------------------------------------------------------------------
# Simulation request identity.
#
# The accepted Phase-5 canonical sections are a PREFIX. Phase 6 appends SIM and
# changes no existing byte or ordering, so the analytical fingerprint remains
# computable from the same stream prefix.
# -----------------------------------------------------------------------------
request_fingerprint:
  section_order: ["HEADER", "COST", "RISK", "SIM"]
  analytical_prefix: ["HEADER", "COST", "RISK"]
  extension_semantics: "prefix_plus_extension"
  existing_sections_modified: false

  # The SIM extension is ONE record. Its semantic field order was locked from
  # Step 0; what was NOT locked - and is locked here - is the canonical record
  # grammar: how many records, which encoder each field uses, and the two
  # different effective shapes AUTO and FIXED produce. Without this, several
  # byte-distinct streams satisfied the contract and a later implementation
  # would have chosen one by accident. `result_digest` already had token-level
  # authority; this brings the request fingerprint to the same standard.
  sim_section:
    name: "SIM"
    record_count: 1

    # SEMANTIC POSITION ONLY, exactly as the Phase-5 HEADER record works. These
    # names are never encoded into the stream.
    fields:
      - "iterations"
      - "seed_mode"
      - "supplied_seed"
      - "rng_version"
      - "sim_method_version"
    encoded_field_names: false

    # One canonical encoder per field. F_I for every integer identity: a count,
    # a seed and a version are structural facts, not model magnitudes, and F_N
    # would make a version of 1 collide with a Double of 1.
    field_types:
      iterations: "F_I"
      seed_mode: "F_S"
      supplied_seed: "F_I"
      rng_version: "F_I"
      sim_method_version: "F_I"

    # The two shapes, and the field COUNT each one hashes. AUTO is four fields
    # because the supplied seed DOES NOT EXIST there - not zero, not blank, not
    # null and not the previous effective seed.
    effective_records:
      AUTO:
        field_count: 4
        fields:
          - "iterations"
          - "seed_mode"
          - "rng_version"
          - "sim_method_version"
      FIXED:
        field_count: 5
        fields:
          - "iterations"
          - "seed_mode"
          - "supplied_seed"
          - "rng_version"
          - "sim_method_version"

    grammar:
      section: 'F_S("SIM") F_I(1) sim_record'
      auto_record: 'F_I(4) F_I(iterations) F_S("AUTO") F_I(rng_version) F_I(sim_method_version)'
      fixed_record: 'F_I(5) F_I(iterations) F_S("FIXED") F_I(supplied_seed) F_I(rng_version) F_I(sim_method_version)'

    supplied_seed_present_only_when: "FIXED"
    auto_supplied_seed_representation: "absent"

    # The extension carries NO stream tag and NO stream version of its own. It is
    # a section of the accepted PCCM-FP stream, whose tag and FP_VERSION are
    # owned by the Phase-5 fingerprint authority. RNG_VERSION and
    # SIM_METHOD_VERSION are fields INSIDE this record and own the
    # simulation-method compatibility axes; there is no SIM_FP_VERSION.
    stream_tag_repeated_in_extension: false
    stream_version_repeated_in_extension: false
    stream_tag_owner: "calc_contract.yaml"

    # The seed DOMAIN stays with input_contract.yaml. This grammar owns TYPE and
    # PRESENCE, never admissibility.
    supplied_seed_domain_owner: "input_contract.yaml"

    excluded_fields:
      - "effective_seed"
      - "auto_nonce"
      - "run_id"
      - "selected_confidence_level"
    analytical_fingerprint_hashed_as_a_field: false

  # An AUTO run leaves C21 blank, and blank is part of the request. Two AUTO runs
  # of the same model therefore share one request fingerprint and stay CURRENT.
  auto_blank_seed_remains_recomputable: true

# -----------------------------------------------------------------------------
# result_digest - D6-17. The accepted Phase-5 encoder and hash primitives.
# No competing hash is defined here; only the framing.
# -----------------------------------------------------------------------------
result_digest:
  stream_tag: "PCCM-RD"
  version_field_source: "sim_method_version"
  section_name: "RESULT"
  record_field_count: 3
  record_fields: ["iteration_index", "total_nominal", "total_pv"]
  field_types: ["F_I", "F_N", "F_N"]
  iteration_index_origin: 1
  grammar:
    stream: 'F_S("PCCM-RD") F_I(sim_method_version) section'
    section: 'F_S("RESULT") F_I(record_count) record*'
    record: "F_I(field_count) F_I(iteration_index) F_N(total_nominal) F_N(total_pv)"
  order_source: "persisted_iteration_order"
  samples_sorted_for_digest: false
  equality: "exact"
  # NO tolerance key exists here, or anywhere in this document. Step 0 section 10
  # settled the comparison tolerance as an ORACLE/EVIDENCE policy owned outside
  # the contract; `equality: exact` already states the runtime rule, and a
  # null-valued tolerance field would still be a tolerance semantic living in the
  # wrong file. The loader rejects any tolerance-shaped field, null included.

# -----------------------------------------------------------------------------
# Iterations. The BUSINESS minimum is owned by input_contract.yaml and is not
# restated here. What lives here is the TECHNICAL storage ceiling and nothing
# else - it is never presented as validation.
# -----------------------------------------------------------------------------
iterations:
  business_minimum_owner: "input_contract.yaml"
  business_maximum: null
  technical_ceiling:
    max_excel_rows: 1048576
    # Derived from the _SimData layout below; the loader recomputes it and
    # refuses a free literal that disagrees.
    reserved_rows_h: 33
    max_iterations_representable: 1048543
    refusal_kind: "technical"
    presented_as_business_validation: false
    refusal_precedes:
      - "sample_allocation"
      - "stream_construction"
      - "auto_seed_allocation"
      - "any_random_draw"
    # A storage-ceiling refusal must not consume an AUTO nonce. That is a
    # consequence of the ordering above, and it is the reason the ordering is
    # contract text.
    consumes_auto_nonce: false

# -----------------------------------------------------------------------------
# `_SimData` - the FUTURE persisted machine layout.
#
# Owned here until the publication step materialises it. `workbook.yaml` still
# declares the sheet as an intentionally empty placeholder and is NOT changed by
# Step 1. Column widths remain presentation and remain workbook.yaml's; they are
# adjusted when the layout is materialised, not now.
#
# EVERY row of the sheet is accounted for below. H is the count of rows an
# iteration record cannot occupy, and there is no footer: iteration rows run from
# `first_iteration_row` to the last representable Excel row with nothing after
# them, so capacity cannot be silently reduced later.
# -----------------------------------------------------------------------------
sim_data:
  sheet: "_SimData"
  required_visibility: "veryHidden"

  reserved_rows:
    - rows: [1, 1]
      purpose: "shell top margin"
    - rows: [2, 2]
      purpose: "shell title"
    - rows: [3, 3]
      purpose: "shell subtitle"
    - rows: [4, 4]
      purpose: "shell rule"
    - rows: [5, 5]
      purpose: "spacer"
    - rows: [6, 6]
      purpose: "run identity section heading"
    - rows: [7, 7]
      purpose: "run identity section note"
    - rows: [8, 30]
      purpose: "run identity fields"
    - rows: [31, 31]
      purpose: "iteration records section heading"
    - rows: [32, 32]
      purpose: "iteration records section note"
    - rows: [33, 33]
      purpose: "iteration table header"

  run_identity:
    label_column: "B"
    # The SHARED value column. The counter, attempt, derived and control fields
    # live here and belong to no bank.
    value_column: "D"
    # The BANKED value columns. A successful snapshot field is written only in
    # the INACTIVE bank's column; the active bank's column is not touched until
    # it stops being active through a successful final commit. The labels are
    # NOT duplicated per bank - there is one label column for both.
    bank_value_columns:
      A: "D"
      B: "F"
    note_column: "H"
    first_row: 8
    last_row: 30
    fields:
      - key: "last_successful_stamp"
        row: 8
        group: "snapshot"
        label: "Last Successful Simulation"
        value_type: "timestamp"
        initial: null
      - key: "run_id"
        row: 9
        group: "snapshot"
        label: "Run ID"
        value_type: "integer"
        initial: null
      - key: "request_fingerprint"
        row: 10
        group: "snapshot"
        label: "Request Fingerprint"
        value_type: "text"
        initial: null
      - key: "result_digest"
        row: 11
        group: "snapshot"
        label: "Result Digest"
        value_type: "text"
        initial: null
      - key: "seed_mode"
        row: 12
        group: "snapshot"
        label: "Seed Mode"
        value_type: "enum"
        enum: "seed_mode"
        initial: null
      - key: "supplied_seed"
        row: 13
        group: "snapshot"
        label: "Supplied Seed"
        value_type: "integer"
        initial: null
      - key: "effective_seed"
        row: 14
        group: "snapshot"
        label: "Effective Seed"
        value_type: "integer"
        initial: null
      - key: "consumed_auto_nonce"
        row: 15
        group: "snapshot"
        label: "Consumed AUTO Nonce"
        value_type: "integer"
        initial: null
      - key: "iterations_run"
        row: 16
        group: "snapshot"
        label: "Iterations Run"
        value_type: "integer"
        initial: null
      - key: "rng_version"
        row: 17
        group: "snapshot"
        label: "RNG Version"
        value_type: "integer"
        initial: null
      - key: "sim_method_version"
        row: 18
        group: "snapshot"
        label: "Simulation Method Version"
        value_type: "integer"
        initial: null
      # The model version AT THE TIME OF THE SUCCESSFUL RUN. It is snapshot data,
      # which is why it sits with the other version fields rather than being
      # appended after the derived group. Results must not look this up live: the
      # workbook's current model version is not necessarily the version that
      # produced the retained samples.
      - key: "model_version"
        row: 19
        group: "snapshot"
        label: "Model Version"
        value_type: "text"
        initial: null
      - key: "applied_timeline"
        row: 20
        group: "snapshot"
        label: "Applied Timeline"
        value_type: "text"
        initial: null
      - key: "next_auto_nonce"
        row: 21
        group: "counter"
        label: "Next AUTO Nonce"
        value_type: "integer"
        initial: 0
      - key: "last_run_id"
        row: 22
        group: "counter"
        label: "Last Run ID"
        value_type: "integer"
        initial: 0
      - key: "last_attempt_result"
        row: 23
        group: "attempt"
        label: "Last Attempt Result"
        value_type: "enum"
        enum: "attempt_result"
        initial: "NONE"
      - key: "last_attempt_detail"
        row: 24
        group: "attempt"
        label: "Last Attempt Detail"
        value_type: "text"
        initial: null
      - key: "last_attempt_seed_mode"
        row: 25
        group: "attempt"
        label: "Last Attempt Seed Mode"
        value_type: "enum"
        enum: "seed_mode"
        initial: null
      - key: "last_attempt_effective_seed"
        row: 26
        group: "attempt"
        label: "Last Attempt Effective Seed"
        value_type: "integer"
        initial: null
      - key: "last_attempt_auto_nonce"
        row: 27
        group: "attempt"
        label: "Last Attempt AUTO Nonce"
        value_type: "integer"
        initial: null
      - key: "simulation_status"
        row: 28
        group: "derived"
        label: "Simulation Status (last evaluated)"
        value_type: "enum"
        enum: "sim_state"
        initial: null
      - key: "status_evaluated_at"
        row: 29
        group: "derived"
        label: "Status Evaluated At"
        value_type: "timestamp"
        initial: null
      # THE PUBLICATION SELECTOR. Blank means no successful simulation has ever
      # committed - the absence of a publication, not a third bank. It moves
      # exactly once per successful run, in the final commit write, and it is the
      # last field in that block.
      - key: "active_bank"
        row: 30
        group: "control"
        label: "Active Bank"
        value_type: "enum"
        enum: "bank"
        initial: null

  iteration_records:
    header_row: 33
    first_iteration_row: 34
    footer_rows: 0
    order: "canonical_iteration_order"
    sorted: false
    columns:
      - key: "iteration_index"
        column: "B"
        header: "Iteration"
        value_type: "integer"
      - key: "total_nominal"
        column: "C"
        header: "Total Nominal"
        value_type: "double"
      - key: "total_pv"
        column: "D"
        header: "Total PV"
        value_type: "double"
    # THE SECOND BANK CONSUMES COLUMNS, NOT ROWS. Both banks share the row axis
    # above, so the reserved-row count, the first iteration row and the technical
    # ceiling are exactly what they were before a second bank existed. `columns`
    # above IS bank A, and the loader requires these to agree.
    banks:
      A:
        iteration_index: "B"
        total_nominal: "C"
        total_pv: "D"
      B:
        iteration_index: "F"
        total_nominal: "G"
        total_pv: "H"

  # ---------------------------------------------------------------------------
  # PHASE-7 RECORDS - COLUMNS, NEVER ROWS.
  #
  # Both blocks below share the row axis with the iteration records, exactly as
  # bank B already does. That is not a convenience: `reserved_rows` is the
  # audit trail from which H, `first_iteration_row` and the technical ceiling
  # are derived, so a Phase-7 block that consumed rows would silently reduce
  # the number of iterations the workbook can hold. reserved_rows is unchanged,
  # H is still 33, the first iteration row is still 34, and
  # `max_iterations_representable` is still 1048543.
  # ---------------------------------------------------------------------------
  sensitivity_records:
    header_row: 33
    first_record_row: 34
    footer_rows: 0
    row_rule: "one row per eligible driver, in ranked order"
    shares_row_axis_with_iteration_records: true
    consumes_reserved_rows: false
    # The eighth field, `status`, carries "n/a - no variance" for a driver that
    # has no variance to correlate. It is the reason a zero-variance driver can
    # be reported without being ranked.
    #
    # ------------------------------------------------------------------
    # WHERE THIS BLOCK LIVES, AND WHY IT MOVED
    # ------------------------------------------------------------------
    # P7-1 put bank A at J-Q and bank B at S-Z. Both bands were already taken
    # on this sheet, and the Windows timing run of 0734a38 read the proof out
    # of the workbook:
    #
    #   summary_statistics  label column J, values K-N, rows 8-23
    #   contingency_ladder  label column P, values Q-R (A) and S-T (B), rows 8-18
    #
    # The records themselves start at row 34 and so never met either block,
    # but THE STAMP SITS AT ROWS 8-14 of the bank's first column. J8:J14 is the
    # summary-statistics label column, so reading the stamp on Windows returned
    # that block's labels for rows 8 to 14 - the mean, the sample standard
    # deviation, the minimum, and then the first four ladder labels, which this
    # file deliberately does not spell because input_contract.yaml owns them.
    # S8:S14 is worse: those are published contingency-ladder bank-B NOMINAL
    # VALUES, so a bank-B sensitivity run would have overwritten accepted
    # Phase-6 results.
    #
    # The block now occupies columns no other block reserves at ANY row, so
    # the disjointness holds without a row-band argument - and
    # `sim_loader.py` proves the whole sheet cell by cell rather than trusting
    # a comment, which is what was missing when J-Q was chosen.
    #
    #   bank A  CC-CJ, stamp CC        bank B  CL-CS, stamp CL
    #
    # The highest column any other block reserves is CB (annual bank-B
    # selected-Px PV), and CK is the gap between the two banks.
    # ------------------------------------------------------------------
    columns:
      - {key: "driver_id",   column: "CC", header: "Driver ID", value_type: "text"}
      - {key: "driver_type", column: "CD", header: "Type",      value_type: "text"}
      - {key: "driver_name", column: "CE", header: "Name",      value_type: "text"}
      - {key: "rho",         column: "CF", header: "Rho",       value_type: "double"}
      - {key: "abs_rho",     column: "CG", header: "|Rho|",     value_type: "double"}
      - {key: "rank",        column: "CH", header: "Rank",      value_type: "integer"}
      - {key: "direction",   column: "CI", header: "Direction", value_type: "text"}
      - {key: "status",      column: "CJ", header: "Status",    value_type: "text"}
    banks:
      A: {first_column: "CC", last_column: "CJ"}
      B: {first_column: "CL", last_column: "CS"}

    # ------------------------------------------------------------------
    # THE STAMP - P7-4 DELTA, and the smallest one that makes the block safe.
    #
    # P7-1 contracted WHAT a sensitivity row holds. Three things were still
    # missing before a row could be written safely, and each is a defect the
    # block would otherwise have:
    #
    #   record_count   A later model can have FEWER drivers than the block
    #                  already holds. Overwriting the first n rows would leave
    #                  the surplus visible and indistinguishable from the new
    #                  result, so the count bounds what is authoritative and
    #                  the rows beyond it are cleared.
    #   the identity   run_id, effective_seed, request_fingerprint and
    #                  result_digest. Without them sensitivity from Run A can
    #                  be presented as current for Run B, which is the one
    #                  thing this whole block must not permit.
    #   published      Written LAST, after the rows and the identity are in
    #                  place and verified. A write that fails part way leaves
    #                  this cell unpublished, so a partial block can never
    #                  carry a current stamp.
    #
    # ROWS, NOT NEW ROWS. The stamp sits on rows the sheet already reserves,
    # in the same columns the records use lower down - records begin at row 34,
    # so rows 8-14 of the BLOCK'S OWN columns are free. reserved_rows is
    # untouched, H is still 33 and the iteration ceiling does not move.
    #
    # "OF THE BLOCK'S OWN COLUMNS" IS THE PART THAT WAS MISSING. The first
    # version of this paragraph said rows 8-14 were free because the records
    # begin at row 34 - true of the rows, and irrelevant, because the columns
    # J and S it had chosen were already occupied at those rows by
    # summary_statistics and contingency_ladder. Freedom is a property of the
    # CELL, not of the row; see the relocation note above, and
    # `sim_loader.py`, which now decides it cell by cell.
    # ------------------------------------------------------------------
    stamp:
      bank_value_columns:
        A: "CC"
        B: "CL"
      published_written_last: true
      cleared_before_write: true
      surplus_rows_cleared: true
      fields:
        - {key: "run_id", row: 8, value_type: "integer"}
        - {key: "effective_seed", row: 9, value_type: "integer"}
        - {key: "request_fingerprint", row: 10, value_type: "text"}
        - {key: "result_digest", row: 11, value_type: "text"}
        - {key: "iterations", row: 12, value_type: "integer"}
        - {key: "record_count", row: 13, value_type: "integer"}
        - {key: "published", row: 14, value_type: "text"}

  annual_records:
    header_row: 33
    first_record_row: 34
    footer_rows: 0
    row_rule: "one row per applied project year"
    shares_row_axis_with_iteration_records: true
    consumes_reserved_rows: false
    max_rows_owner: "structure_contract.yaml: year_columns.max_generated_year_columns"
    # THE LADDER, NOT THE MATRIX. Eleven quantiles per measure per year, plus
    # the selected-Px profile value for that year. No iteration-level annual
    # value is persisted anywhere.
    index_columns:
      A: {project_index: "AB", calendar_year: "AC"}
      B: {project_index: "BC", calendar_year: "BD"}
    quantile_first_column:
      A: {nominal: "AD", pv: "AO"}
      B: {nominal: "BE", pv: "BP"}
    quantile_count: 11
    quantile_keys_owner: "sim_data.summary_statistics.metrics"
    selected_px_profile_columns:
      A: {nominal: "AZ", pv: "BA"}
      B: {nominal: "CA", pv: "CB"}
    iteration_level_annual_values_persisted: false
    # ------------------------------------------------------------------
    # P7-6. THE PUBLICATION STAMP
    # ------------------------------------------------------------------
    # The block's own first column, rows 8-16, mirroring the sensitivity
    # stamp: a stamp beside the records it describes cannot be paired with
    # the wrong block by a later reader.
    #
    # WHY selected_px IS STAMPED AND THE SENSITIVITY STAMP HAS NO SUCH FIELD.
    # `selected_confidence_level` is a REPORTING SELECTOR: it does not enter
    # the request fingerprint, does not affect staleness and does not require
    # a rerun. So a user may move it while the simulation stays CURRENT - and
    # the persisted annual PROFILE is the blend for ONE particular Px. Without
    # the Px recorded beside it, a profile computed at one confidence level
    # would be read as the profile for whatever level is selected NOW, with
    # every value intact and every identity field matching. The stamp records
    # which Px the profile represents so a reader can tell.
    #
    # No percentile LABEL is written here. The selectable ladder is owned by
    # input_contract.yaml, and naming one of its values in this file would be
    # the copy that is free to drift from it.
    #
    # year_count bounds the records. A four-year run published after a
    # twenty-year one must not leave years 5-20 readable as current, and a
    # count is what says where the answer stops - not the last non-blank row.
    stamp:
      bank_value_columns: {A: "AB", B: "BC"}
      published_written_last: true
      cleared_before_write: true
      surplus_rows_cleared: true
      fields:
        - {key: "run_id", row: 8, value_type: "integer"}
        - {key: "effective_seed", row: 9, value_type: "integer"}
        - {key: "request_fingerprint", row: 10, value_type: "text"}
        - {key: "result_digest", row: 11, value_type: "text"}
        - {key: "iterations", row: 12, value_type: "integer"}
        - {key: "year_count", row: 13, value_type: "integer"}
        - {key: "selected_px_label", row: 14, value_type: "text"}
        - {key: "selected_px_probability", row: 15, value_type: "double"}
        - {key: "published", row: 16, value_type: "text"}
    # THE SELECTED Px IS NOT INVENTED HERE. It is the reporting selector the
    # accepted contract already owns, resolved through the accepted ladder.
    # P7-6 records WHICH Px a profile represents; it does not choose one.
    selected_px_owner: "selected_confidence_level.source"
    selected_px_resolution_owner: "statistics.selected_confidence_level"
    # A moved selector does not invalidate the simulation, so it must not be
    # allowed to invalidate the annual records either - but the profile it
    # produced is no longer the profile the selector now asks for, and a
    # reader must be able to see that.
    profile_px_recorded_in_stamp: true
    selector_move_invalidates_simulation: false
    selector_move_makes_profile_current: false
    # ------------------------------------------------------------------
    # THE TWO ANNUAL PRODUCTS DO NOT SHARE A CURRENTNESS RULE
    # ------------------------------------------------------------------
    # The per-year percentile LADDERS are a property of the run alone: every
    # rung of every year is computed across all iterations and no selector
    # enters them. Moving the reporting selector cannot make them wrong, so it
    # must not make them stale either - marking them stale would retire a
    # correct answer for a reason that has nothing to do with it.
    #
    # The selected-Px PROFILE is the blend at ONE resolved Px. It stays
    # historically valid for the Px stamped into it, and it stops being current
    # the moment the selector resolves to a different one. It is never
    # relabelled: a profile computed at one confidence level may not be
    # presented as the profile for another.
    #
    # So a reader needs BOTH answers, and a single annual_current Boolean
    # cannot carry them.
    distribution_currentness_is_selector_specific: false
    profile_currentness_is_selector_specific: true
    profile_relabelled_on_selector_change: false
    # BOTH stamped fields must agree with the authoritative resolution. A stamp
    # whose label and probability disagree with each other is internally
    # inconsistent and is not current whatever either half says.
    profile_current_requires_label_and_probability_match: true
    selector_change_requires_new_simulation: false

  # THE STEP-9 SUMMARY, PERSISTED.
  #
  # `Results derives from _SimData` and `modSimStats` is the one owner of these
  # numbers. Both are true only if the summary is PERSISTED: a worksheet
  # AVERAGE/STDEV/PERCENTILE would be a second statistics engine, and reading the
  # iteration rows to recompute would make Results a calculator.
  #
  # The values come from modSimStats over the SAME retained arrays that are
  # written to that candidate iteration bank, and are never recomputed from
  # worksheet data.
  summary_statistics:
    label_column: "J"
    bank_value_columns:
      A: {nominal: "K", pv: "L"}
      B: {nominal: "M", pv: "N"}
    first_row: 8
    last_row: 23
    source: "modSimStats"
    recomputed_from_worksheet_data: false
    # THE RUNG LABELS ARE NOT SPELLED HERE. The selectable confidence-level
    # ladder belongs to input_contract.yaml; a rung is identified by its
    # projected key and its label is resolved through the accepted ladder
    # authority. A rung label written out here would be a second ladder.
    metrics:
      - {key: "mean", row: 8, label: "Mean", source: "SimStatsMean"}
      - {key: "sample_standard_deviation", row: 9, label: "Sample Standard Deviation", source: "SimStatsSampleStandardDeviation"}
      - {key: "minimum", row: 10, label: "Minimum", source: "SimStatsDescribe"}
      - {key: "quantile_1", row: 11, label: null, source: "SimStatsDescribe"}
      - {key: "quantile_2", row: 12, label: null, source: "SimStatsDescribe"}
      - {key: "quantile_3", row: 13, label: null, source: "SimStatsDescribe"}
      - {key: "quantile_4", row: 14, label: null, source: "SimStatsDescribe"}
      - {key: "quantile_5", row: 15, label: null, source: "SimStatsDescribe"}
      - {key: "quantile_6", row: 16, label: null, source: "SimStatsDescribe"}
      - {key: "quantile_7", row: 17, label: null, source: "SimStatsDescribe"}
      - {key: "quantile_8", row: 18, label: null, source: "SimStatsDescribe"}
      - {key: "quantile_9", row: 19, label: null, source: "SimStatsDescribe"}
      - {key: "quantile_10", row: 20, label: null, source: "SimStatsDescribe"}
      - {key: "quantile_11", row: 21, label: null, source: "SimStatsDescribe"}
      - {key: "maximum", row: 22, label: "Maximum", source: "SimStatsDescribe"}
      - {key: "deterministic_base_a", row: 23, label: "Deterministic Base A", source: "phase5_preparation"}

  # THE WHOLE CONTINGENCY LADDER, PRECOMPUTED.
  #
  # Selected Confidence Level is reporting-only and may change without rerunning.
  # A publication that stored only the currently selected rung would force either
  # a rerun or a worksheet subtraction the moment the selector moved. Neither is
  # acceptable, so every reported rung's contingency is computed through
  # SimStatsContingency BEFORE the candidate bank may commit.
  #
  # If ANY of the twenty-two values is unrepresentable the successful publication
  # is refused and the active bank does not move. P10 is persisted too, even
  # though it is not selectable, so the ladder is structurally uniform.
  contingency_ladder:
    label_column: "P"
    bank_value_columns:
      A: {nominal: "Q", pv: "R"}
      B: {nominal: "S", pv: "T"}
    first_row: 8
    last_row: 18
    source: "SimStatsContingency"
    baseline: "deterministic_base_estimate_a"
    worksheet_subtraction_permitted: false
    computed_for_whole_ladder_before_commit: true
    all_values_representable_required_before_commit: true
    fixed_rung_persisted_though_not_selectable: true
    # Identified by projected key only, for the same reason as the summary block.
    rungs:
      - {key: "quantile_1", row: 8, label: null}
      - {key: "quantile_2", row: 9, label: null}
      - {key: "quantile_3", row: 10, label: null}
      - {key: "quantile_4", row: 11, label: null}
      - {key: "quantile_5", row: 12, label: null}
      - {key: "quantile_6", row: 13, label: null}
      - {key: "quantile_7", row: 14, label: null}
      - {key: "quantile_8", row: 15, label: null}
      - {key: "quantile_9", row: 16, label: null}
      - {key: "quantile_10", row: 17, label: null}
      - {key: "quantile_11", row: 18, label: null}

  # Deliberately absent, and not to be added without a new authority.
  #
  # PHASE 7 REMOVED TWO OF THESE AND DELIBERATELY KEPT THE THIRD.
  # `sensitivity_data` and the annual LADDER are now contracted below, because
  # Phase 7 owns them. `per_driver_samples` STAYS EXCLUDED, and so does the
  # iteration x year matrix: sensitivity reaches per-driver values by RESET AND
  # REPLAY, and annual output by BLOCK REPLAY, precisely so that neither
  # retention is ever created. Contracting an output is not the same as
  # retaining the matrix behind it, and the distinction is the memory
  # architecture.
  excluded:
    - "per_driver_samples"
    - "annual_iteration_matrix"

  # ---------------------------------------------------------------------------
  # THE PENDING AUTO NONCE SIDECAR - a write-ahead recovery marker.
  #
  # WHY IT IS NOT THE ATTEMPT ROW. `last_attempt_result` is contractually the
  # result of the chronologically LAST simulation attempt, and a durable AUTO
  # recovery lock must survive attempts that have nothing to do with it. A FIXED
  # run necessarily rewrites the attempt block: preserving an AUTO token across
  # it would make "Last Attempt Result" lie, and overwriting it would erase the
  # recovery authority. One cell cannot be both.
  #
  # WHY F21. Column F carries the bank-B SNAPSHOT, which ends at row 20; row 21
  # is `next_auto_nonce`, a SHARED counter that lives in column D only. F21 is
  # therefore unused, and using it shifts no row: the iteration header stays at
  # 33, the first iteration row at 34, and the technical ceiling is unchanged.
  # ---------------------------------------------------------------------------
  pending_auto_nonce:
    cell: "F21"
    column: "F"
    row: 21
    label: "Pending AUTO Nonce"
    value_type: "integer_or_blank"
    blank_means: "no AUTO allocation transaction requires recovery"
    integer_means: "AUTO nonce m is pending; reconcile the counter before allocating"
    is_a_consumed_nonce_claim: false
    is_an_enum_sentinel: false
    written_before_counter_persist: true
    counter_persist_forbidden_until_established: true
    cleared_on: ["counter_equals_m", "counter_equals_m_plus_1"]
    retained_on: ["counter_is_neither", "counter_unreadable", "observation_unavailable"]
    sampling_forbidden_while_unresolved: true
    survives_unrelated_attempts: true
    # FIXED-mode behaviour is stated ONCE, under
    # seeding.nonce_lifecycle.fixed_mode. Restating it here would create two
    # authorities for one fact and no rule about which governs.

# -----------------------------------------------------------------------------
# Enumerated label sets.
# -----------------------------------------------------------------------------
label_sets:
  # EXACTLY three. There is no fourth simulation state. A never-evaluated
  # workbook holds a BLANK status - the absence of an evaluation, not a state -
  # exactly as the accepted calc contract leaves Fingerprint Version blank until
  # a successful commit writes it.
  sim_state:
    - "CURRENT"
    - "STALE"
    - "INVALID"
  # The two publication banks. There is no third, and blank is not a bank - it
  # is the absence of any successful publication.
  bank:
    - "A"
    - "B"
  # PHASE-6 ONLY, and a strict SUPERSET of the Phase-5 calculation axis, which
  # remains exactly NONE / SUCCESS / REFUSED / FAILED in calc_contract.yaml.
  # `_Calc!Last Attempt Result` and `_SimData!Last Attempt Result` carry
  # analogous labels and are no longer required to share an enumeration.
  #
  # AUTO_NONCE_INDETERMINATE is an ATTEMPT/AUDIT result only. Like REFUSED and
  # FAILED it takes no part in deriving the simulation status.
  attempt_result:
    - "NONE"
    - "SUCCESS"
    - "REFUSED"
    - "FAILED"
    - "AUTO_NONCE_INDETERMINATE"
  seed_mode:
    - "AUTO"
    - "FIXED"

# -----------------------------------------------------------------------------
# Simulation state.
# -----------------------------------------------------------------------------
sim_state:
  states: ["CURRENT", "STALE", "INVALID"]

  # ORDERED. The first matching rule wins, so the rules are mutually exclusive by
  # construction, and rules 1 and 2 make them total: everything rules 3 and 4 do
  # not catch is caught above them.
  #
  # POST-ACCEPTANCE AUTHORITY CORRECTION (plan section 10.3). Revision 6's
  # predicates were neither exclusive nor complete - a corrected-then-restored
  # request had NO state, and a failed attempt on a changed request was both
  # STALE and INVALID - and they read the attempt history, contradicting the
  # inherited Phase-5 orthogonality.
  derivation:
    ordered: true
    rules:
      - order: 1
        condition: "current_prerequisites_do_not_resolve"
        status: "INVALID"
      - order: 2
        condition: "no_successful_snapshot_exists"
        status: null
      - order: 3
        condition: "request_fingerprint_equals_stored_successful"
        status: "CURRENT"
      - order: 4
        condition: "request_fingerprint_differs_from_stored_successful"
        status: "STALE"

  # The audit axis. It is recorded, and it NEVER participates in the derivation.
  attempt_result_participates_in_derivation: false
  attempt_axis_is_orthogonal: true

  # The absence of a successful-comparison state, not a fourth label: a status can
  # only be CURRENT or STALE RELATIVE TO a stored success, so with no success
  # there is nothing to be relative to.
  #
  # Renamed from `never_evaluated_status`, which was too narrow: a blank status
  # also occurs after an attempted-but-unsuccessful run when no successful
  # snapshot exists and the current request is now valid.
  no_success_valid_status: null
  status_evaluated_at_may_be_populated_while_status_is_blank: true

  definitions:
    CURRENT: "prerequisites resolve, a successful snapshot exists, and the recomputed request fingerprint equals the stored successful one"
    STALE: "prerequisites resolve, a successful snapshot exists, and the recomputed request fingerprint differs from the stored successful one"
    INVALID: "current simulation prerequisites do not resolve"

  on_failure:
    prior_sim_data_preserved: true
    prior_results_publication_preserved: true
    attempt_metadata_updated: true
    partial_distribution_published: false

prerequisite:
  phase5_analytical_state_required: "CURRENT"
  silent_recalculation_permitted: false
  phase6_may_call_pccm_calculate: false

# -----------------------------------------------------------------------------
# run_id - D6-15 (a).
# -----------------------------------------------------------------------------
run_id:
  initial: 0
  first_successful_value: 1
  allocated_on: "successful_commit_only"
  failure_consumes: false
  maximum: 2147483647
  on_exhaustion: "REFUSE_BEFORE_COMMIT"
  wrap_permitted: false
  reuse_permitted: false
  persisted: true
  independent_of: ["auto_nonce", "effective_seed", "request_fingerprint", "result_digest"]

# -----------------------------------------------------------------------------
# Statistics.
# -----------------------------------------------------------------------------
statistics:
  mean:
    method: "sample_mean"
    scale_safe_required: true
  standard_deviation:
    method: "sample_standard_deviation"
    divisor: "n_minus_1"
    naive_sum_of_squares_permitted: false
  percentile:
    method: "hyndman_fan_type_7"
    formula:
      h: "(n - 1) * p"
      lo: "floor(h)"
      hi: "min(lo + 1, n - 1)"
      f: "h - lo"
      value: "(1 - f) * x[lo] + f * x[hi]"
    interpolation: "convex"
  sorting: "on_copies_only"
  # ------------------------------------------------------------------
  # WHICH SOURCE ITERATION OWNS AN ORDER STATISTIC
  # ------------------------------------------------------------------
  # The percentile VALUE never needed this. When two iteration totals are
  # equal it does not matter which the sort returns - the number is the same
  # either way - and nothing downstream asked the question.
  #
  # The Phase-7 selected-Px ANNUAL PROFILE does ask it. The profile blends the
  # annual vectors of the two iterations owning the type-7 lo and hi positions,
  # and two iterations with equal TOTALS can have entirely different annual
  # SHAPES: the same money spread differently across years. Without a rule the
  # profile would depend on the sort implementation, which is not an authority.
  #
  # So the rule is stated here, narrowly: among equal values the LOWER ORIGINAL
  # ITERATION INDEX owns the position. It is a tie-break on IDENTITY only. It
  # cannot move a percentile, because it chooses between candidates that are
  # already equal, and that is proved by test rather than asserted.
  order_statistic_identity:
    exposed_for: "selected_px_annual_profile"
    source_index_basis: "original_iteration_order"
    equal_value_tie_break: "lower_original_iteration_index"
    tie_break_changes_percentile_value: false
    sort_implementation_order_is_authority: false
    exposes_lo_hi_f: true
    recomputes_percentile_value: false
  measures: ["nominal", "pv"]
  # Phase 6 stores the WHOLE ladder a selection could ask for, so Selected Px is
  # a deterministic lookup rather than a computation over samples. The ladder's
  # VALUES are not copied here: they are resolved from the owner through the
  # authority reference, so a legitimate future change to the ladder flows
  # through one authority instead of requiring a duplicate list to be edited.
  fixed_nonselectable_percentiles: ["P10"]
  include_all_selectable_ladder_values: true
  selectable_ladder_owner: "input_contract.yaml"
  selectable_ladder_locator: "config_tables.confidence_levels"
  headline_percentiles: ["P10", "P50", "P70", "P90"]
  moments_and_extremes:
    - "mean"
    - "sample_standard_deviation"
    - "minimum"
    - "maximum"
  p10_selectable: false
  selected_confidence_level:
    role: "reporting_selector"
    enters_simulation_execution: false
    enters_request_fingerprint: false
    affects_staleness: false

# -----------------------------------------------------------------------------
# Contingency.
# -----------------------------------------------------------------------------
contingency:
  measures: ["nominal", "pv"]
  formula: "selected_px_total - deterministic_base_estimate_a"
  baseline: "deterministic_base_estimate_a"
  forbidden_baselines:
    - "simulation_mean"
    - "analytical_expected_total"
    - "a_plus_emv"
  workbook_recommends_a_confidence_level: false

# =============================================================================
# SENSITIVITY - Phase 7.
#
# WHAT THIS IS, AND WHAT IT IS NOT. Sensitivity is OBSERVATIONAL POST-PROCESSING
# over an already-accepted successful run. It is not a simulation. It allocates
# no run identity, consumes no AUTO nonce, writes no attempt row and changes no
# published number. If it ever produced a different stochastic result and
# presented it as "the sensitivity of this run", the workbook would hold two
# sources of truth for one run, which is the failure this whole architecture is
# built to prevent.
#
# HOW IT GETS PER-DRIVER VALUES WITHOUT RETAINING THEM. `per_driver_samples`
# stays on the `sim_data.excluded` list: the driver x iteration matrix is
# 300 x 100,000 x 8 B = 240 MB and is never retained. Instead each driver is
# RESET AND REPLAYED at driver granularity from its own component initial
# state(s), one driver at a time, its column ranked and then discarded. Under
# D6-18b every component stream is deterministic per iteration, so one driver
# replays without touching any other. There is no random-access seek: a
# rejection sampler consumes a variable number of uniforms, so iteration j is
# reached by sequential advance.
# =============================================================================
sensitivity:
  phase: 7
  kind: "observational_post_processing"
  basis_run: "the accepted successful snapshot in the active bank"
  independent_monte_carlo_permitted: false

  # ---------------------------------------------------------------------------
  # Drivers. One per Cost Line, one per Risk. No category aggregation.
  # ---------------------------------------------------------------------------
  drivers:
    one_per_cost_line: true
    one_per_risk: true
    category_aggregation: false
    identity: "permanent_id"
    identity_is_worksheet_row: false

  # ---------------------------------------------------------------------------
  # The contribution a driver is correlated on. NOMINAL only, and it is the
  # SAME expression the engine already computes - `contribution` above owns it.
  # A second copy of this arithmetic anywhere is a duplicate source of truth.
  # ---------------------------------------------------------------------------
  contribution:
    measure: "nominal"
    expression_owner: "contribution"
    reimplementation_permitted: false
    cost_line: "unit_cost * Quantity * Knom"
    risk: "occurred ? severity * Knom : 0"
    # A Risk is ONE driver. Occurrence and severity are two streams of one
    # driver, paired by iteration; correlating against raw severity alone would
    # measure a quantity the model never spends.
    risk_occurrence_and_severity_are_one_driver: true
    correlation_against_raw_severity_permitted: false

  replay:
    granularity: "driver"
    resets_from: "component_initial_state"
    random_access_seek: false
    sequential_advance_required: true
    cost_line_streams: 1
    risk_streams: 2
    risk_streams_paired_by_iteration: true
    unrelated_drivers_advanced: false
    retains_driver_matrix: false
    concurrent_driver_columns_retained: 1

  # ---------------------------------------------------------------------------
  # Spearman, by MID-RANKS. The no-ties shortcut is not an optimisation here:
  # a Risk at p = 0.2 puts roughly 80% of its column on one tied value, and the
  # shortcut is simply the wrong number on tied data.
  # ---------------------------------------------------------------------------
  statistic:
    name: "spearman_rank_correlation"
    definition: "pearson(midrank(driver_contribution), midrank(total_nominal))"
    tie_rule: "average_ranks"
    no_ties_shortcut_permitted: false
    total_ranks_computed_once: true
    total_ranks_reused_across_drivers: true
    sorting: "on_copies_only"
    source_arrays_mutated: false
    iteration_correspondence_preserved: true

  # ---------------------------------------------------------------------------
  # Zero variance is UNDEFINED, not zero. Reporting rho = 0 for a constant
  # column asserts "no monotone association was found", which is a measurement.
  # No measurement was possible.
  # ---------------------------------------------------------------------------
  zero_variance:
    status_label: "n/a - no variance"
    rho_reported: false
    reported_as_zero_rho: false
    excluded_from_ranking: true
    excluded_from_tornado_input: true
    retained_diagnostically: true

  ranking:
    order_by: "absolute_rho"
    direction: "descending"
    signed_rho_retained: true
    direction_labels: ["+", "-"]
    # PHASE 7 PRODUCES THE WHOLE RANKED POPULATION. Top-N is a chart decision
    # and charts are Phase 8; truncating here would discard data the later
    # phase is entitled to choose from.
    top_n_truncation: false
    population: "every eligible non_zero_variance driver"
    # P7-2 DELTA. Two drivers can share |rho| exactly - a small model, or a pair
    # of drivers that move with the total identically - and P7-1 left what
    # happens then unsaid. Unsaid means the report depends on the order the
    # drivers reached the sort, so the same model could produce two different
    # tables. The narrowest deterministic rule is the identity the project
    # already orders by everywhere reproducibility matters, and the comparison
    # is the one `components` and `accumulation` already name. Worksheet row
    # position cannot serve: a driver's row moves when an unrelated driver is
    # added, and identity that moves is not identity.
    tie_break: "permanent_id"
    tie_break_direction: "ascending"
    tie_break_comparison: "ordinal_utf16_code_units"
    tie_break_uses_worksheet_row: false
    tie_break_uses_supply_order: false

  # ---------------------------------------------------------------------------
  # Full N. No subsampling is contracted, and none may be added from a desk
  # estimate: under replay the dominant cost is stream ADVANCEMENT, and a
  # skipped iteration must still be advanced through, so subsampling would
  # reduce only the ranking half. If measured runtime evidence later shows
  # full-N ranking is unacceptable, that evidence changes this contract first.
  # ---------------------------------------------------------------------------
  sampling:
    uses_all_iterations: true
    subsampling_contracted: false
    iteration_cap: null
    sensitivity_sample_size: null
    unmeasured_performance_safeguard_permitted: false
    # The rule that WOULD apply if subsampling were ever contracted. It is
    # recorded so a future implementation cannot invent a looser one.
    index_set_rule_if_ever_adopted:
      shared_index_set: true
      same_indices: true
      same_order: true
      independently_selected_samples_permitted: false
      full_run_statistics_recomputed_from_subset: false

  # ---------------------------------------------------------------------------
  # Interpretation. Spearman is MONOTONE ASSOCIATION. rho^2 is not a share of
  # variance, and presenting it as a percentage contribution would be a
  # quantitative claim this method does not support.
  # ---------------------------------------------------------------------------
  interpretation:
    measures: "monotone_association"
    measures_variance_contribution: false
    rho_squared_as_variance_share_permitted: false
    percentage_contribution_permitted: false
    inter_driver_correlation_owner: "dependence"

  identity_binding:
    stamped_with: ["run_id", "effective_seed", "request_fingerprint", "result_digest"]
    stored_in: "the same bank as the run it describes"
    valid_only_for_the_stamped_run: true

  state_safety:
    consumes_run_id: false
    advances_auto_nonce: false
    touches_pending_auto_nonce_marker: false
    writes_attempt_row: false
    mutates_successful_snapshot: false
    rewrites_iteration_records: false
    changes_result_digest: false

  # ---------------------------------------------------------------------------
  # Display. The state machine in `sim_state` is the authority; sensitivity adds
  # no fourth state and invents no rule of its own.
  # ---------------------------------------------------------------------------
  display:
    state_owner: "sim_state"
    presented_as_current_when: "sim_state is CURRENT and the stored sensitivity stamp equals the active bank successful stamp"
    presented_as_current_when_stale: false
    presented_as_current_when_invalid: false
    stale_must_be_labelled: true
    # Inherited from `sim_state.on_failure.prior_sim_data_preserved`. A REFUSED
    # attempt is an attempt; it destroys nothing that belonged to the last
    # accepted success.
    refused_attempt_destroys_prior_sensitivity: false
    prior_sensitivity_preserved_on_failure: true
    # THE SHEET IS A WINDOW ONTO THE BLOCK, AND A WINDOW HAS EDGES.
    #
    # `ranking.top_n_truncation` is false and `ranking.population` is every
    # eligible driver, and the persisted block honours both: the 300-driver
    # design-scale probe persisted 300 records. The SHEET, though, is a fixed
    # number of lookup rows, and at 200 it showed the first 200 of those 300
    # and said nothing about the other 100. A materialisation that drops rows
    # without saying so is a Top-N truncation wearing a different hat, and it
    # is the one the reader actually sees.
    #
    # There is no contracted maximum driver population to derive a window
    # from, so a fixed window can never be proved sufficient for every model.
    # Both halves below are therefore required, and neither alone is enough:
    # the window must clear the largest model this project has measured, AND
    # an overflow must announce itself on the sheet.
    silent_truncation_permitted: false
    overflow_disclosure_required: true
    sheet_window_owner: "workbook.yaml: phase6_shell.sensitivity.row_window"

# =============================================================================
# ANNUAL STOCHASTIC OUTPUT - Phase 7.
#
# TWO DIFFERENT THINGS, AND THEY MUST NOT BE CONFLATED:
#
#   (a) ANNUAL SIMULATED DISTRIBUTIONS - the percentile ladder of each project
#       year taken across iterations. Sum_y of a per-year Px does NOT equal the
#       reported total Px, and it is not a profile of anything.
#
#   (b) THE SELECTED-Px ANNUAL PROFILE - the annual vector belonging to the
#       reported total-cost percentile. It DOES reconcile: Sum_y = reported Px.
#
# Presenting (a) as (b) would be a reconciliation error, so both are contracted
# and named separately here.
#
# WHAT MAKES THIS POSSIBLE WITHOUT A NEW INPUT. Knom is already
# Sum_y (FX * w_y * infl_y); the per-year factor is a DECOMPOSITION of an
# accepted published number, not a new quantity, and it sums back to it.
# =============================================================================
annual_stochastic:
  phase: 7
  contracted: true

  per_year_factor:
    nominal: "Knom_y = FX * w_y * infl_y"
    pv: "Kpv_y = FX * w_y * infl_y * disc_y"
    decomposition_of: ["Knom", "Kpv"]
    reconciles: "sum_y Knom_y = Knom"
    factor_owner: "calc_contract.yaml"
    is_a_new_input: false

  iteration_annual_vector:
    nominal: "A_j(y) = sum_d sample_d_j * Quantity_d * Knom_d_y"
    pv: "A_j(y) = sum_d sample_d_j * Quantity_d * Kpv_d_y"
    # The per-iteration analogue of the accepted annual identity I3c. It is the
    # correctness anchor for everything below.
    identity: "sum_y A_j(y) = iteration total for j"
    identity_owner: "docs/phase5_plan.md I3c"

  # ---------------------------------------------------------------------------
  # RETENTION. The iteration x year matrix is 200 x 100,000 x 8 B = 160 MB at
  # the structural maximum and is NEVER retained or persisted - the same trap
  # `per_driver_samples` refuses. Years are processed in BLOCKS: hold a block,
  # compute its ladders, discard, advance. What is retained is the ladder.
  # ---------------------------------------------------------------------------
  retention:
    persisted_iteration_by_year_matrix: false
    retained_in_memory_matrix: false
    strategy: "block_replay"
    block_axis: "project_year"
    block_width_configurable: true
    passes: "ceil(applied_duration / block_width)"
    retained: ["annual_percentile_ladder", "selected_px_annual_profile"]

  # ---------------------------------------------------------------------------
  # (a) ANNUAL SIMULATED DISTRIBUTIONS.
  # ---------------------------------------------------------------------------
  annual_distributions:
    quantile_method_owner: "statistics.percentile"
    method: "hyndman_fan_type_7"
    sorting: "on_copies_only"
    measures: ["nominal", "pv"]
    ladder_owner: "statistics"
    per_year: true
    sums_to_total_percentile: false
    is_a_selected_px_profile: false

  # ---------------------------------------------------------------------------
  # (b) THE SELECTED-Px ANNUAL PROFILE - the approved convex Type-7 blend.
  #
  # The reported total Px is generally a blend of TWO order statistics, so "the
  # annual vector of the Px iteration" does not name one iteration. The profile
  # applies the SAME lo / hi / f the reported total used, to the annual vectors
  # of those exact two iterations. Sum_y then equals the reported Px exactly, by
  # linearity, and at f = 0 it degenerates to the single iteration's vector.
  # ---------------------------------------------------------------------------
  selected_px_profile:
    definition: "convex_type_7_blend"
    formula: "Profile_Px(y) = (1 - f) * AnnualVector_lo(y) + f * AnnualVector_hi(y)"
    lo_hi_f_source: "the same type-7 position used for the reported total Px"
    position_owner: "statistics.percentile"
    degenerates_to_single_iteration_when_f_is_zero: true
    # THE IDENTITY, AND NOT ITS ALLOWANCE. This contract stores no comparison
    # tolerance - Step 0 settled that as an oracle/evidence policy owned
    # elsewhere - so the numeric allowance for this reconciliation is the
    # project's accepted identity rule, referenced and never copied here.
    reconciliation_identity: "sum_y Profile_Px(y) = reported Px"
    reconciliation_rule_owner: "docs/phase5_plan.md section 15"
    nearest_rank_permitted: false
    per_year_percentile_as_profile_permitted: false
    other_definitions_permitted: false
    measures: ["nominal", "pv"]

  phase_8_handoff:
    provides: ["annual_percentile_ladder", "selected_px_annual_profile"]
    presentation_in_phase_7: false
    annual_cash_flow_presentation_owner: "phase 8"
    dashboard_owner: "phase 8"
    chart_owner: "phase 8"

# -----------------------------------------------------------------------------
# Results - MINIMUM scope only. Everything else is explicitly deferred.
# -----------------------------------------------------------------------------
results_minimum:
  sections: ["Run Stamp", "Summary Statistics"]
  deferred:
    - "Annual Cash Flow"
    - "Reconciliation presentation"
    - "Dashboard"
    - "Charts"
    - "Sensitivity"
  # PHASE 7. Annual simulated samples are now CONTRACTED - by
  # `annual_stochastic` above, not by Results. Results still presents nothing
  # new: `deferred` is unchanged, Annual Cash Flow remains Phase 8, and
  # `presentation.written_by_the_run` is still false.
  annual_simulated_samples_contracted: true

  # RESULTS IS PRESENTATION. It is not part of the per-run transaction, it is
  # materialised once by Stage A, and it computes nothing: every cell is a
  # lookup into the ACTIVE `_SimData` bank, or the live reporting selector.
  #
  # That is also why the commit is safe. If Results were a second written
  # transaction, `_SimData` could commit and the Results write could then fail,
  # leaving a published distribution the workbook does not show.
  presentation:
    written_by_the_run: false
    materialised_by_stage_a: true
    reads_only:
      - "the active _SimData bank"
      - "inpSelectedConfidenceLevel"
    computes_statistics: false
    computes_contingency: false
    recomputes_quantiles: false
    forbidden_functions:
      - "AVERAGE"
      - "STDEV"
      - "STDEV.S"
      - "STDEVP"
      - "PERCENTILE"
      - "PERCENTILE.INC"
      - "PERCENTILE.EXC"
      - "QUARTILE"
      - "MEDIAN"
      - "OFFSET"
      - "INDIRECT"
      - "RAND"
      - "RANDBETWEEN"
      - "NOW"
      - "TODAY"
    contingency_by_subtraction_on_results: false
    reads_a_fixed_bank: false
    # The Run Stamp fields, BY THE `_SimData` KEY THEY PRESENT. Where they sit is
    # workbook.yaml's; WHICH fields exist is this contract's, and the loader
    # cross-validates the two.
    run_stamp_fields:
      - "last_successful_stamp"
      - "run_id"
      - "model_version"
      - "iterations_run"
      - "seed_mode"
      - "supplied_seed"
      - "effective_seed"
      - "consumed_auto_nonce"
      - "applied_timeline"
      - "rng_version"
      - "sim_method_version"
      - "request_fingerprint"
      - "result_digest"
      - "simulation_status"
      - "status_evaluated_at"
    summary_metrics_source: "sim_data.summary_statistics.metrics"
    selected_rows:
      - key: "selected_confidence_level"
        source: "inpSelectedConfidenceLevel"
        lookup_only: false
      - key: "selected_quantile"
        source: "sim_data.summary_statistics"
        lookup_only: true
      - key: "selected_contingency"
        source: "sim_data.contingency_ladder"
        lookup_only: true
    blank_when_no_active_bank: true
    blank_when_selector_not_selectable: true

# -----------------------------------------------------------------------------
# Selected Confidence Level is REPORTING-ONLY. Locked here so no later step can
# quietly promote it into the request identity or the derived status.
# -----------------------------------------------------------------------------
selected_confidence_level:
  source: "inpSelectedConfidenceLevel"
  participates_in_request_fingerprint: false
  participates_in_execution_validity: false
  participates_in_auto_allocation: false
  participates_in_state_derivation: false
  change_requires_rerun: false
  invalid_selector_invalidates_simulation: false
  invalid_selector_blanks_selected_reporting_rows: true
  unselected_state_introduced: false

# -----------------------------------------------------------------------------
# The ONE reusable bridge into the accepted Phase-5 preparation.
#
# Phase 6 must not rebuild DriverFactors, the analytical fingerprint, the
# deterministic base or the applied timeline: modCalcReport already prepares all
# four from one resolved model, and a second construction is a second answer.
# The bridge is an INTERNAL cross-module API, not an automation endpoint.
# -----------------------------------------------------------------------------
phase5_bridge:
  owner_module: "modCalcReport"
  procedure: "CalcPrepareSimulationInputs"
  is_automation_endpoint: false
  name_prefix_pccm: false
  reuses_private_preparation: "PrepareCurrentCalculation"
  requires_phase5_status: "CURRENT"
  writes_to_calc_sheet: false
  updates_phase5_status_or_attempt_metadata: false
  duplicates_factor_mathematics: false
  zero_driver_model_succeeds: true
  returns:
    - "drivers"
    - "driver_count"
    - "analytical_fingerprint"
    - "deterministic_base_nominal"
    - "deterministic_base_pv"
    - "applied_timeline"
    - "decimal_separator"
  # The prefix state the request fingerprint continues MUST be the CURRENT
  # analytical fingerprint from this same preparation, never a stored
  # last-successful value.
  analytical_fingerprint_is_current_not_stored: true

# -----------------------------------------------------------------------------
# Boundaries. Every value this contract borrows is declared here as a reference
# whose locator resolves against the owning file. The VALUE is never copied.
# -----------------------------------------------------------------------------
authority_references:
  - concept: "Random Seed admissible domain"
    owner: "input_contract.yaml"
    locator: "inputs.random_seed"
  - concept: "Monte Carlo iterations business minimum"
    owner: "input_contract.yaml"
    locator: "inputs.monte_carlo_iterations"
  - concept: "selectable confidence level ladder"
    owner: "input_contract.yaml"
    locator: "config_tables.confidence_levels"
  - concept: "distribution master list"
    owner: "input_contract.yaml"
    locator: "config_tables.distributions"
  - concept: "Cost Line and Risk Register input schemas"
    owner: "driver_contract.yaml"
    locator: "registers"
  - concept: "permanent-ID prefixes, patterns and counter rules"
    owner: "structure_contract.yaml"
    locator: "identity.counters"
  - concept: "applied timeline and structural limits"
    owner: "structure_contract.yaml"
    locator: "timeline"
  - concept: "fingerprint algorithm version"
    owner: "calc_contract.yaml"
    locator: "fingerprint.version"
  - concept: "deterministic base estimate and analytical totals"
    owner: "calc_contract.yaml"
    locator: "scalar_blocks.calc_totals"
  - concept: "_SimData sheet declaration and visibility"
    owner: "workbook.yaml"
    locator: "sheets._SimData"
  - concept: "Results sheet placeholder sections"
    owner: "workbook.yaml"
    locator: "sheets.Results"
  - concept: "model version"
    owner: "workbook.yaml"
    locator: "model.model_version"
