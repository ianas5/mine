# CI per DEVELOPMENT_WORKFLOW §3: typecheck → lint (zero warnings) → format check → tests.
# The migration check joins in Phase 2 when the database layer exists.
name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test -- --ci
